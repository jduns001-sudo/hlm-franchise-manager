<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trend agreement</title><style>body{font:16px system-ui;margin:1rem auto;padding:0 1rem;max-width:38rem}button{min-height:48px;padding:.7rem;margin:.4rem .4rem .4rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{width:100%;box-sizing:border-box}</style><main><h1>Experimental trend agreement</h1><p>Read-only simulated player/team insights. No production saves or automated GM decisions.</p><button id="preview">Preview consistent evidence</button><button id="partial">Preview partial coverage</button><button id="strict">Preview insufficient evidence</button><button id="clear">Clear</button><pre id="result" aria-live="polite">Inactive by default</pre></main><script src="hlm-phase11-sample-quality-audit.browser.js"></script><script src="hlm-phase11-comparable-sample-insights.browser.js"></script><script src="hlm-phase11-window-stability-insights.browser.js"></script><script src="hlm-phase11-shot-volume-balance.browser.js"></script><script src="hlm-phase11-evidence-synthesis.browser.js"></script><script src="hlm-phase11-threshold-sensitivity.browser.js"></script><script src="hlm-phase11-trend-agreement.browser.js"></script><script>const result=document.getElementById('result'),home=[{shots:10,goals:2,expectedGoals:2},{shots:10,goals:2,expectedGoals:2},{shots:10,goals:4,expectedGoals:2},{shots:10,goals:4,expectedGoals:2}],away=[{shots:10,goals:1,expectedGoals:2},{shots:10,goals:1,expectedGoals:2},{shots:10,goals:1,expectedGoals:2},{shots:10,goals:1,expectedGoals:2}];function show(t){result.textContent=JSON.stringify(HLMPhase11TrendAgreement.evaluateTrendAgreement(home,away,t),null,2)}document.getElementById('preview').onclick=()=>show([5,10]);document.getElementById('partial').onclick=()=>show([5,10,25]);document.getElementById('strict').onclick=()=>show([50,100]);document.getElementById('clear').onclick=()=>{result.textContent='Inactive by default'};</script></html>
