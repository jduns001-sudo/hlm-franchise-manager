<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Window stability insights</title><style>body{font:16px system-ui;margin:1rem auto;padding:0 1rem;max-width:38rem}button{min-height:48px;padding:.7rem;margin:.4rem .4rem .4rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{width:100%;box-sizing:border-box}</style><main><h1>Experimental early/late comparisons</h1><p>Read-only simulated evidence. No production saves or automated GM decisions.</p><button id="preview">Preview windows</button><button id="limited">Preview limited evidence</button><button id="clear">Clear</button><pre id="result" aria-live="polite">Inactive by default</pre></main><script src="hlm-phase11-sample-quality-audit.browser.js"></script><script src="hlm-phase11-comparable-sample-insights.browser.js"></script><script src="hlm-phase11-window-stability-insights.browser.js"></script><script>const result=document.getElementById('result'),h=[{shots:10,goals:2,expectedGoals:2},{shots:10,goals:2,expectedGoals:2},{shots:10,goals:4,expectedGoals:2},{shots:10,goals:4,expectedGoals:2}],a=[{shots:10,goals:1,expectedGoals:2},{shots:10,goals:1,expectedGoals:2},{shots:10,goals:1,expectedGoals:2},{shots:10,goals:1,expectedGoals:2}];function show(x){result.textContent=JSON.stringify(HLMPhase11WindowStabilityInsights.compareWindows(h,x),null,2)}document.getElementById('preview').onclick=()=>show(a);document.getElementById('limited').onclick=()=>show(a.slice(0,2));document.getElementById('clear').onclick=()=>{result.textContent='Inactive by default'};</script></html>
