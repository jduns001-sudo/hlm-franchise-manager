<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated Franchise Recovery</title><style>body{font:16px system-ui;background:#102035;color:#fff;max-width:680px;margin:auto;padding:16px}button,input{font:inherit;min-height:44px;margin:8px 0}button{display:block;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,input:focus-visible{outline:3px solid gold}</style></head><body><h1>Isolated franchise recovery</h1><p>Experimental. No production save access. Review before approval.</p><label for="checkpoint">Checkpoint JSON</label><input id="checkpoint" type="file" accept=".json,application/json"><button id="preview" disabled>Preview isolated restore</button><pre id="report" aria-live="polite">Select a checkpoint file.</pre><label><input type="checkbox" id="approval" disabled> I approve replacing the isolated test session only</label><button id="restore" disabled>Restore isolated session</button><script src="./hlm-phase11-isolated-recovery.js"></script><script>
let content='',preview=null,restoreRevision=0;const file=document.getElementById('checkpoint'),report=document.getElementById('report'),approval=document.getElementById('approval'),restore=document.getElementById('restore');
file.addEventListener('change',async()=>{preview=null;approval.checked=false;approval.disabled=true;restore.disabled=true;content=file.files[0]?await file.files[0].text():'';document.getElementById('preview').disabled=!content;report.textContent=content?'Ready to validate.':'Select a checkpoint file.'});
document.getElementById('preview').addEventListener('click',()=>{try{preview=HLMIsolatedRecovery.previewRestore(content);const existing=sessionStorage.getItem('hlm-phase11-recovery-isolated-v1');restoreRevision=existing?JSON.parse(existing).revision:0;report.textContent='Isolated teams: '+preview.teamCount+'; players: '+preview.playerCount+'; games: '+preview.gameCount+'. Human approval required. No production save read or write.';approval.disabled=false}catch(e){preview=null;report.textContent='Rejected: '+e.message}});
approval.addEventListener('change',()=>{restore.disabled=!(approval.checked&&preview)});
restore.addEventListener('click',()=>{if(!preview||!approval.checked)return;try{const key='hlm-phase11-recovery-isolated-v1';const store={isolated:true,loadRevision(){const value=sessionStorage.getItem(key);return value?JSON.parse(value).revision:0},saveIfRevision(state,expected){const current=this.loadRevision();if(current!==expected)return false;sessionStorage.setItem(key,JSON.stringify({revision:expected+1,state}));return true}};HLMIsolatedRecovery.restoreWithRevision(preview,true,store,restoreRevision);report.textContent='Isolated session restored. Production saves unchanged.';restore.disabled=true;approval.checked=false}catch(e){report.textContent='Restore failed: '+e.message}});
</script></body></html>
