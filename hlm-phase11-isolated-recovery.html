<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated Franchise Recovery</title><style>body{font:16px system-ui;background:#102035;color:#fff;max-width:680px;margin:auto;padding:16px}button,input{font:inherit;min-height:44px;margin:8px 0}button{display:block;width:100%}pre{white-space:pre-wrap;overflow-wrap:anywhere}button:focus-visible,input:focus-visible{outline:3px solid gold}</style></head><body><h1>Isolated franchise recovery</h1><p>Experimental. No production save access. Review before approval.</p><label for="checkpoint">Checkpoint JSON</label><input id="checkpoint" type="file" accept=".json,application/json"><button id="preview" disabled>Preview isolated restore</button><pre id="report" aria-live="polite">Select a checkpoint file.</pre><label><input type="checkbox" id="approval" disabled> I approve replacing the isolated test session only</label><button id="restore" disabled>Restore isolated session</button><section aria-label="Experimental isolated season"><h2>Isolated season review</h2><p>Preview the next scheduled day before explicitly approving simulation. No production saves are accessed.</p><button id="season-preview" disabled>Preview next game day</button><pre id="season-report" aria-live="polite">Restore a checkpoint to review the season.</pre><label><input type="checkbox" id="season-approval" disabled> I approve advancing the isolated test season</label><button id="season-advance" disabled>Advance isolated game day</button></section><script src="./hlm-phase11-isolated-recovery.js"></script><script src="./hlm-phase11-isolated-recovery-store.js"></script><script src="./hlm-phase11-recovery-season-review.js"></script><script src="./hlm-phase11-isolated-day-stage.js"></script><script src="./hlm-phase11-isolated-season-advance.js"></script><script src="./hlm-phase10-game-simulator-browser.js"></script><script>
let content='',preview=null,restoreRevision=0;const file=document.getElementById('checkpoint'),report=document.getElementById('report'),approval=document.getElementById('approval'),restore=document.getElementById('restore');
file.addEventListener('change',async()=>{preview=null;approval.checked=false;approval.disabled=true;restore.disabled=true;content=file.files[0]?await file.files[0].text():'';document.getElementById('preview').disabled=!content;report.textContent=content?'Ready to validate.':'Select a checkpoint file.'});
document.getElementById('preview').addEventListener('click',()=>{try{preview=HLMIsolatedRecovery.previewRestore(content);restoreRevision=HLMIsolatedRecoveryStore.createStore(sessionStorage).loadRevision();report.textContent='Isolated teams: '+preview.teamCount+'; players: '+preview.playerCount+'; games: '+preview.gameCount+'. Human approval required. No production save read or write.';approval.disabled=false}catch(e){preview=null;report.textContent='Rejected: '+e.message}});
approval.addEventListener('change',()=>{restore.disabled=!(approval.checked&&preview)});
restore.addEventListener('click',()=>{if(!preview||!approval.checked)return;try{const store=HLMIsolatedRecoveryStore.createStore(sessionStorage);HLMIsolatedRecovery.restoreWithRevision(preview,true,store,restoreRevision);report.textContent='Isolated session restored. Production saves unchanged.';document.getElementById('season-preview').disabled=false;restore.disabled=true;approval.checked=false}catch(e){report.textContent='Restore failed: '+e.message}});
const seasonPreview=document.getElementById('season-preview'),seasonApproval=document.getElementById('season-approval'),seasonAdvance=document.getElementById('season-advance'),seasonReport=document.getElementById('season-report');let seasonRevision=-1;seasonPreview.addEventListener('click',()=>{try{const store=HLMIsolatedRecoveryStore.createStore(sessionStorage);const state=store.load();const r=HLMRecoverySeasonReview.review(state,[]);seasonRevision=store.loadRevision();seasonReport.textContent='Completed: '+r.completed+'; scheduled: '+r.pending+'; teams: '+r.standings.length+'. Human approval required.';seasonApproval.disabled=!r.pending;seasonApproval.checked=false;seasonAdvance.disabled=true}catch(e){seasonReport.textContent='Review failed: '+e.message}});seasonApproval.addEventListener('change',()=>{seasonAdvance.disabled=!(seasonApproval.checked&&seasonRevision>=0)});seasonAdvance.addEventListener('click',()=>{try{if(!seasonApproval.checked)throw Error('Approval required');const store=HLMIsolatedRecoveryStore.createStore(sessionStorage);const score=(input)=>{if(!window.HLMPhase10BrowserSimulator||typeof window.HLMPhase10BrowserSimulator.simulateGameScore!=='function')throw Error('Browser simulator unavailable');return window.HLMPhase10BrowserSimulator.simulateGameScore(input)};const bridge=HLMIsolatedDayStage.createStager(()=>store.load(),score);const controller=HLMIsolatedSeasonAdvance.createController(bridge,HLMRecoverySeasonReview,store);const r=controller.advance(true,1314,[],seasonRevision);seasonReport.textContent='Completed: '+r.review.completed+'; scheduled: '+r.review.pending+'; revision: '+r.revision+'. Isolated only.';seasonApproval.checked=false;seasonAdvance.disabled=true}catch(e){seasonReport.textContent='Advance failed: '+e.message}});</script></body></html>
