<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historical trend explorer</title><style>body{margin:0;padding:16px;background:#101827;color:#f8fafc;font:16px system-ui}main{max-width:720px;margin:auto}section{background:#1e293b;padding:16px;border-radius:12px;margin:12px 0}fieldset{border:1px solid #64748b;border-radius:8px}label{display:block;margin:9px 0}select{width:100%;padding:10px;font:inherit}.trend{padding:10px 0;border-bottom:1px solid #475569}meter{width:100%}small{color:#cbd5e1}</style></head><body><main><h1>Season-to-season trend explorer</h1><small>Experimental synthetic visualization. No production save access.</small><section><fieldset><legend>Compare seasons</legend><label><input type="checkbox" value="2027" checked>2027</label><label><input type="checkbox" value="2028" checked>2028</label><label><input type="checkbox" value="2029" checked>2029</label></fieldset><label for="metric">Metric</label><select id="metric"><option value="points">Points per game</option><option value="finishing">Finishing rate</option></select></section><section><h2>Player and team trends</h2><div id="chart" aria-live="polite"></div><p id="interpretation"></p></section></main><script>const rows=[{season:2027,games:3,points:[.35,.42],finishing:[.11,.09]},{season:2028,games:12,points:[.6,.55],finishing:[.16,.14]},{season:2029,games:30,points:[.72,.68],finishing:[.2,.18]}];function render(){const selected=new Set([...document.querySelectorAll('input:checked')].map(x=>Number(x.value))),metric=document.querySelector('#metric').value,chosen=rows.filter(r=>selected.has(r.season)),root=document.querySelector('#chart');root.replaceChildren();for(const r of chosen){const block=document.createElement('div');block.className='trend';const heading=document.createElement('strong');heading.textContent=r.season+' · '+r.games+' games · '+(r.games>=20?'established':r.games>=5?'developing':'limited')+' sample';block.append(heading);for(const [i,name] of ['Player','Team'].entries()){const label=document.createElement('div');label.textContent=name+' '+metric+': '+r[metric][i];const meter=document.createElement('meter');meter.min=0;meter.max=1;meter.value=r[metric][i];meter.setAttribute('aria-label',name+' '+metric);block.append(label,meter)}root.append(block)}document.querySelector('#interpretation').textContent=chosen.length?'Season-to-season trends are directional only, not predictive. Human GM retains final authority.':'No seasons selected. Choose at least one season.';}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',render));render();</script></body></html>
