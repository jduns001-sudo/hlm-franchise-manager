<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cross-season comparison dashboard</title><style>body{margin:0;padding:16px;background:#0f172a;color:#f8fafc;font:16px system-ui}main{max-width:760px;margin:auto}section{background:#1e293b;border-radius:12px;padding:14px;margin:12px 0}fieldset{border:1px solid #64748b;border-radius:8px}label{display:block;margin:10px 0}select{width:100%;padding:10px;font:inherit}.row{padding:10px 0;border-bottom:1px solid #475569}meter{width:100%}small{color:#cbd5e1}strong{font-variant-numeric:tabular-nums}</style></head><body><main><h1>Cross-season player/team insights</h1><small>Experimental synthetic preview. Production saves untouched.</small><section><fieldset><legend>Historical seasons</legend><label><input type="checkbox" value="2027" checked> 2027</label><label><input type="checkbox" value="2028" checked> 2028</label><label><input type="checkbox" value="2029" checked> 2029</label></fieldset><label for="metric">View metric</label><select id="metric"><option value="finishing">Finishing rate</option><option value="consistency">Consistency</option></select></section><section><h2>Comparison summary</h2><div id="summary" aria-live="polite"></div><div id="chart"></div><p id="explanation"></p></section></main><script>const data=[{year:2027,games:3,finishing:[.12,.10],consistency:[.70,.65]},{year:2028,games:10,finishing:[.17,.15],consistency:[.80,.75]},{year:2029,games:30,finishing:[.20,.18],consistency:[.85,.80]}];function render(){const years=new Set([...document.querySelectorAll('input:checked')].map(x=>Number(x.value))),metric=document.querySelector('#metric').value,chosen=data.filter(x=>years.has(x.year)),games=chosen.reduce((n,r)=>n+r.games,0),confidence=games>=30?'higher':games>=10?'moderate':'limited',root=document.querySelector('#chart');root.replaceChildren();for(const r of chosen){const item=document.createElement('div');item.className='row';const title=document.createElement('strong');title.textContent=r.year+' · '+r.games+' games';item.append(title);for(const [i,name] of ['Player','Team'].entries()){const label=document.createElement('div');label.textContent=name+' '+metric+': '+r[metric][i];const bar=document.createElement('meter');bar.min=0;bar.max=1;bar.value=r[metric][i];bar.setAttribute('aria-label',name+' '+metric);item.append(label,bar)}root.append(item)}document.querySelector('#summary').textContent=chosen.length?chosen.length+' seasons · '+games+' games · '+confidence+' sample confidence':'No seasons selected';document.querySelector('#explanation').textContent=chosen.length?'Historical sample confidence is descriptive, not predictive. Human GM retains authority.':'Select at least one season to compare.';}document.querySelectorAll('input,select').forEach(x=>x.addEventListener('change',render));render();</script></body></html>
