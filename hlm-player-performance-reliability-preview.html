<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Historical reliability preview</title><style>body{margin:0;padding:16px;background:#0f172a;color:#f8fafc;font:16px system-ui}main{max-width:720px;margin:auto}section{background:#1e293b;border-radius:12px;padding:14px;margin:12px 0}label{display:block;margin:8px 0}select{font:inherit;width:100%;padding:10px}meter{width:100%}small{color:#cbd5e1}.item{padding:8px 0;border-bottom:1px solid #475569}output{font-variant-numeric:tabular-nums}</style></head><body><main><h1>Historical reliability explorer</h1><small>Experimental synthetic data. No franchise saves or GM actions.</small><section><label for="season">Historical season</label><select id="season"><option value="all">All seasons</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option></select><label for="metric">Performance metric</label><select id="metric"><option value="consistency">Consistency</option><option value="volatility">Volatility</option></select></section><section><h2>Player and team comparison</h2><div id="chart" aria-live="polite"></div><p id="context"></p></section></main><script>const rows=[{season:2027,games:4,consistency:[.75,.65],volatility:[.25,.35]},{season:2028,games:12,consistency:[.68,.79],volatility:[.32,.21]},{season:2029,games:34,consistency:[.88,.73],volatility:[.12,.27]}];function render(){const season=document.querySelector('#season').value,metric=document.querySelector('#metric').value;const root=document.querySelector('#chart');root.replaceChildren();for(const r of rows.filter(x=>season==='all'||String(x.season)===season)){const item=document.createElement('div');item.className='item';const confidence=r.games>=30?'higher':r.games>=10?'moderate':'limited';const title=document.createElement('strong');title.textContent=r.season+' · '+r.games+' games · '+confidence+' sample confidence';item.append(title);for(const [i,name] of ['Player','Team'].entries()){const label=document.createElement('div');label.textContent=name+' '+metric+': '+r[metric][i];const bar=document.createElement('meter');bar.min=0;bar.max=1;bar.value=r[metric][i];bar.setAttribute('aria-label',name+' '+metric);item.append(label,bar)}root.append(item)}document.querySelector('#context').textContent='Sample-aware descriptive insights only. Confidence reflects sample size, not predictive certainty. Human GM retains authority.';}document.querySelectorAll('select').forEach(x=>x.addEventListener('change',render));render();</script></body></html>
