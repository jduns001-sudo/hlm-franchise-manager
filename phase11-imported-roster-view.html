<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 11 Imported Roster Viewer</title><style>
body{font:16px system-ui;background:#0a1727;color:#edf4ff;max-width:850px;margin:auto;padding:16px}a{color:#9bd0ff}select{font:inherit;padding:12px;width:100%;max-width:440px;background:#152b43;color:white}table{border-collapse:collapse;width:100%;margin-top:12px}td,th{border-bottom:1px solid #34506b;padding:9px;text-align:left}section{background:#152b43;border-radius:12px;padding:16px;margin:16px 0}#status{overflow-wrap:anywhere}
</style></head><body><a href="./phase11-roster-import.html">← Roster import</a><h1>Imported franchise roster</h1><p>Read-only preview of your isolated Phase 11 save. No changes to Front Office, active franchise, or saved data.</p><section><p id="status" role="status"></p><label for="team">Team</label><select id="team"></select><p id="count"></p><table><thead><tr><th>Player</th><th>Position</th><th>Overall</th></tr></thead><tbody id="players"></tbody></table></section><a href="./app.html">Existing Front Office (unchanged)</a>
<script src="./hlm-phase11-imported-roster-view.js"></script><script>
(function(){'use strict';const $=id=>document.getElementById(id);let roster;
function show(){const id=Number($('team').value),players=roster.players.filter(p=>p.teamId===id).sort((a,b)=>b.ovr-a.ovr||a.name.localeCompare(b.name));$('players').replaceChildren();for(const p of players){const tr=document.createElement('tr');for(const v of [p.name,p.position,String(p.ovr)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('players').append(tr)}$('count').textContent=players.length+' players';}
try{roster=window.HLMPhase11ImportedRoster.inspectImportedRoster(localStorage);if(!roster.available){$('status').textContent='No imported roster found. Import a roster first.';$('team').disabled=true;return}$('status').textContent=roster.teams.length+' teams and '+roster.players.length+' players loaded without modifying saves.';for(const t of roster.teams){const o=document.createElement('option');o.value=String(t.id);o.textContent=t.name;$('team').append(o)}$('team').onchange=show;show()}catch(e){$('status').textContent='Cannot inspect imported roster: '+e.message;$('team').disabled=true}
})();
</script></body></html>
