<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CPU GM Review | Hockey Franchise Manager</title>
<style>body{background:#07111f;color:#eef5ff;font:16px system-ui;margin:0;padding:20px}main{max-width:900px;margin:auto}a{color:#80cbff}button,input,select{font:inherit;padding:9px;border-radius:8px;margin:4px;background:#142c46;color:white;border:1px solid #57728e}button{cursor:pointer}.item{background:#11263c;border:1px solid #35516d;border-radius:12px;padding:14px;margin:10px 0}.muted{color:#a9b9cc}.status{font-size:13px;color:#c7dbef}label{display:inline-block}#details{white-space:pre-wrap}</style></head>
<body><main><p><a href="./app.html">← Front Office</a></p><h1>CPU GM Decision Review</h1><p class="muted">Advisory review only. This screen never approves or executes transactions. Import a CPU review export JSON file to inspect decisions. No game data is changed.</p>
<label>Review JSON file <input type="file" id="file" accept=".json,application/json"></label><div><label for="paste">Or paste review export JSON</label><textarea id="paste" rows="4" style="display:block;width:95%;background:#142c46;color:white;border:1px solid #57728e;border-radius:8px" placeholder="Paste a CPU review export JSON document"></textarea><button id="load-paste" type="button">Load pasted JSON</button><button id="demo" type="button">Load sample (demo only)</button><button id="download" type="button">Download matching JSON</button></div>
<div><input id="search" type="search" placeholder="Search decisions" aria-label="Search decisions"><select id="section" aria-label="Review section"><option value="all">All sections</option><option>Needs attention</option><option>Pending review</option></select><select id="sort" aria-label="Sort decisions"><option value="priority">Priority</option><option value="title">Title</option></select></div>
<p id="status" role="status">No review data loaded.</p><div id="results"></div><div><button id="prev" disabled>Previous</button><span id="page"></span><button id="next" disabled>Next</button></div><h2>Decision details</h2><div id="details" class="item">Select a decision to inspect it.</div>
</main><script src="./cpu-review-panel.js"></script></body></html>
