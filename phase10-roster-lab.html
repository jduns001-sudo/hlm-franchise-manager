<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phase 10 | Roster Season Lab</title>
<style>body{font:16px system-ui,sans-serif;background:#0a1727;color:#edf4ff;max-width:850px;margin:auto;padding:20px}button{background:#2872d9;border:0;border-radius:8px;color:white;padding:12px 16px;min-height:44px;margin:5px;cursor:pointer}button:disabled{opacity:.5}section{background:#152b43;border:1px solid #34506b;border-radius:12px;padding:18px;margin:15px 0}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #34506b;padding:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#9bd0ff}</style></head>
<body><a href="./phase10-demo.html">← Phase 10 Demo</a><h1>🏒 Roster Season Lab</h1>
<p>Experimental, isolated roster-driven simulation. This page does not access existing franchise saves. Fictional teams only. Results are not certified official league games.</p>
<section><h2>Season Controls</h2><p id="summary">Loading…</p><button id="new">Create Roster Season</button><button id="advance">Simulate Next Day</button><p id="status" role="status"></p></section>
<section><h2>Standings</h2><table><thead><tr><th>Team</th><th>GP</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th></tr></thead><tbody id="standings"></tbody></table></section>
<section><h2>Recent Results</h2><ul id="results"></ul></section>
<script src="./hlm-phase10-roster-lab.bundle.js"></script>
<script>
(function(){'use strict';
const api=window.HLMRosterLab, status=document.getElementById('status');
const store=api.createRosterBrowserStore(window.localStorage);
let state;
function render(){
 state=store.load();
 document.getElementById('summary').textContent=state?'Date: '+state.meta.currentDate+' | Games complete: '+state.activity.games.filter(g=>g.status==='final').length+' / '+state.activity.games.length:'No experimental roster season saved.';
 document.getElementById('advance').disabled=!state||!state.activity.games.some(g=>g.status==='scheduled');
 const standings=state?api.calculateStandings(state.universe.teams,state.activity.games):[];
 document.getElementById('standings').replaceChildren(...standings.map(t=>{const tr=document.createElement('tr');for(const value of [t.teamName,t.gp,t.w,t.l,t.otl,t.points]){const td=document.createElement('td');td.textContent=value;tr.append(td)}return tr}));
 document.getElementById('results').replaceChildren(...(state?state.activity.games.filter(g=>g.status==='final').slice(-8).reverse():[]).map(g=>{const li=document.createElement('li');li.textContent=g.date+' | '+g.homeTeamId+' '+g.homeGoals+' : '+g.awayGoals+' '+g.awayTeamId+(g.overtime?' OT':'');return li}));
}
document.getElementById('new').onclick=()=>{try{if(state&&!confirm('Replace the isolated experimental roster season?'))return;store.save(api.createRosterLabFranchise());status.textContent='Roster season created.';render()}catch(e){status.textContent=e.message}};
document.getElementById('advance').onclick=()=>{try{const current=store.load();const seed=Number(api.addCalendarDays(current.meta.currentDate,1).replaceAll('-',''));const result=store.advanceAndSave(seed);status.textContent=result.advanced?'Advanced to '+result.toDate+'; games: '+result.results.length:JSON.stringify(result.blocked);render()}catch(e){status.textContent=e.message}};
try{render()}catch(e){status.textContent='Could not load experimental save: '+e.message}
})();
</script></body></html>
