name: Phase 11 Mission 854 Browser Process Restart
on:
  pull_request:
    paths:
      - 'tests/phase11-m854-restart.html'
      - 'tests/phase11-m854-restart.spec.js'
      - '.github/workflows/phase11-m854-browser-restart.yml'
  push:
    branches: [phase11-m854-process-restart-idb]
permissions:
  contents: read
jobs:
  chromium-restart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m854-restart.spec.js --workers=1
      - run: npm test
