name: Phase 11 Mission 855 Chromium Unexpected Exit
on:
  pull_request:
    paths:
      - 'tests/phase11-m855-crash.html'
      - 'tests/phase11-m855-crash.spec.js'
      - '.github/workflows/phase11-m855-chromium-crash.yml'
  push:
    branches: [phase11-m855-unexpected-chromium-exit]
permissions:
  contents: read
jobs:
  chromium-crash-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m855-crash.spec.js --workers=1
      - run: npm test
