name: Phase 11 Team Mapping
on:
  pull_request:
    paths:
      - 'hlm-phase11-team-mapping.js'
      - 'hlm-phase11-team-mapping.test.js'
      - '.github/workflows/phase11-team-mapping.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-team-mapping.test.js
