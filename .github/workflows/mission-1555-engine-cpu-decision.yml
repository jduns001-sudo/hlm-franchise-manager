name: Mission 1555 Engine-Owned CPU Trade Decision
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1555-*'
      - '.github/workflows/mission-1555-engine-cpu-decision.yml'
  workflow_dispatch:
jobs:
  cpu-decision-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1555-engine-owned-cpu-decision.test.js
  cpu-decision-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1555-engine-owned-cpu-decision.chromium.test.js
