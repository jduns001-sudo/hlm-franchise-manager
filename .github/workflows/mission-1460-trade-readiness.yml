name: Mission 1460 Protected CPU Trade Readiness Integration
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1460-trade-readiness.integration.test.js'
      - '.github/workflows/mission-1460-trade-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-franchise-trade-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1460-trade-readiness.integration.test.js
  real-franchise-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-trade-execution-boundary.chromium.test.js
