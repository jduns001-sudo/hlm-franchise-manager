name: Mission 1556 CPU Settlement Gate
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1556-*'
      - '.github/workflows/mission-1556-cpu-settlement-gate.yml'
  workflow_dispatch:
jobs:
  cpu-settlement-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1556-cpu-settlement-gate.test.js
  cpu-settlement-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1556-cpu-settlement-gate.chromium.test.js
