name: Mission 747 Experimental Player Goals
on:
  push:
    branches: [mission-747-experimental-player-goal-stats]
  pull_request:
    paths:
      - 'hlm-phase10-experimental-player-goals.js'
      - 'hlm-phase10-experimental-player-goals.test.js'
      - '.github/workflows/mission-747-player-goals.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-player-goals.test.js
