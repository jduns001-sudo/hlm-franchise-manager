name: Phase 10 Main Release Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'phase10-roster-lab.html'
      - 'hlm-phase10-roster-lab.bundle.js'
      - 'hlm-phase10-roster-lab-*.js'
      - 'hlm-phase10-roster-save-integrity.test.js'
      - 'build-phase10-roster-lab.js'
      - '.github/workflows/phase10-main-release-acceptance.yml'
  workflow_dispatch:
jobs:
  release-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check committed browser bundle reproducibility
        run: |
          node build-phase10-roster-lab.js
          git diff --exit-code -- hlm-phase10-roster-lab.bundle.js
      - run: node hlm-phase10-roster-lab-browser.test.js
      - run: node hlm-phase10-roster-lab-ui-regression.test.js
      - run: node hlm-phase10-roster-lab-e2e.test.js
      - run: node hlm-phase10-roster-save-integrity.test.js
  pages-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check public HTML and browser bundle with retries
        shell: bash
        run: |
          set -euo pipefail
          root='https://jduns001-sudo.github.io/hlm-franchise-manager'
          for attempt in 1 2 3 4 5 6; do
            if curl -fLsS --connect-timeout 15 --max-time 30 "$root/phase10-roster-lab.html" -o page.html &&
               curl -fLsS --connect-timeout 15 --max-time 30 "$root/hlm-phase10-roster-lab.bundle.js" -o bundle.js; then
              if grep -q 'Roster Season Lab' page.html &&
                 grep -q 'hlm-phase10-roster-lab.bundle.js' page.html &&
                 grep -q 'Backup belongs to a different franchise save' bundle.js; then
                echo 'Public Pages HTML and matching bundle passed smoke check'
                exit 0
              fi
            fi
            echo "Pages not ready or missing expected content (attempt $attempt/6)"
            sleep 20
          done
          echo 'Public Pages deployment smoke test failed'
          exit 1
