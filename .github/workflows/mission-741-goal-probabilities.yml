name: Mission 741 Experimental Goal Probabilities
on:
  push:
    branches:
      - mission-741-experimental-goals-probability
  pull_request:
    paths:
      - 'hlm-phase10-experimental-goal-probabilities.js'
      - 'hlm-phase10-experimental-goal-probabilities.test.js'
      - 'docs/MISSION_741_EXPERIMENTAL_GOAL_PROBABILITIES.md'
      - '.github/workflows/mission-741-goal-probabilities.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-goal-probabilities.test.js
