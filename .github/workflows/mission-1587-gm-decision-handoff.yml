name: Mission 1587 Actionable GM Handoff
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1587-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1587-gm-decision-handoff.yml'
  workflow_dispatch:
jobs:
  exact-handoff-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1587-gm-decision-handoff.js
      - run: node hlm-phase11-m1587-gm-decision-handoff.test.js
      - run: node hlm-phase11-m1586-multiseason-gm-readiness.test.js
      - run: node hlm-phase11-m1585-multiseason-continuation.test.js
  exact-handoff-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1587-gm-decision-handoff.chromium.test.js
