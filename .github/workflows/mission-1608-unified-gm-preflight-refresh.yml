name: Mission 1608 Unified GM Preflight Refresh
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1608-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1608-unified-gm-preflight-refresh.yml'
  workflow_dispatch:
jobs:
  gm-preflight-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1608-unified-gm-preflight-refresh.js
      - run: node hlm-phase11-m1608-unified-gm-preflight-refresh.test.js
  gm-preflight-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1608-unified-gm-preflight-refresh.chromium.test.js
