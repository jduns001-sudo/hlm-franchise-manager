name: Phase 11 Safe Import Staging Browser
on:
  pull_request:
    paths:
      - 'hlm-phase11-safe-import-staging.js'
      - 'hlm-phase11-safe-import-staging.spec.js'
      - 'hlm-phase11-safe-import-staging.config.js'
      - '.github/workflows/phase11-safe-import-staging.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-safe-import-staging.config.js
      - run: node hlm-phase11-team-mapping.test.js
