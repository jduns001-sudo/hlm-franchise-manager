name: Phase 11 Production Backup Browser
on:
  pull_request:
    paths:
      - 'phase11-production-backup.html'
      - 'hlm-phase11-production-backup-browser.js'
      - 'hlm-phase11-production-backup-browser.spec.js'
      - 'hlm-phase11-production-backup-browser.config.js'
      - '.github/workflows/phase11-production-backup-browser.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-production-backup-browser.config.js
      - run: node hlm-phase11-backup-verification.test.js
