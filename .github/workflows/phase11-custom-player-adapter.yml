name: Phase 11 Verified Custom Player Adapter
on:
  pull_request:
    paths:
      - 'hlm-phase11-custom-player-adapter.js'
      - 'hlm-phase11-custom-player-adapter.test.js'
      - '.github/workflows/phase11-custom-player-adapter.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-custom-player-adapter.test.js
      - run: node hlm-phase11-import-impact.test.js
