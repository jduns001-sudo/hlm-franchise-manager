name: Phase 11 Finance Tools Entry
on:
  pull_request:
    paths:
      - 'index.html'
      - 'hlm-phase11-finance-tools-entry.test.js'
      - '.github/workflows/phase11-finance-tools-entry.yml'
  workflow_dispatch:
jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-finance-tools-entry.test.js
      - run: node hlm-phase11-finance-dashboard.test.js
