name: Mission 1507N Mobile Trade Chromium
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1507n-mobile-trade.chromium.test.js'
      - '.github/workflows/mission-1507n-mobile-trade-chromium.yml'
jobs:
  mobile-trade-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1507n-mobile-trade.chromium.test.js
