name: Mission 1507K CPU Trade Policy
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1507k-cpu-trade-policy*'
      - '.github/workflows/mission-1507k-cpu-trade-policy.yml'
jobs:
  cpu-trade-policy-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1507k-cpu-trade-policy.test.js
