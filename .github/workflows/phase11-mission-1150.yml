name: Phase 11 Mission 1150 Reliability Insights
on:
  pull_request:
    paths:
      - 'hlm-player-performance-reliability*'
      - '.github/workflows/phase11-mission-1150.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node hlm-player-performance-reliability.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-player-performance-reliability-mobile.test.js
