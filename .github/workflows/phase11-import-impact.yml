name: Phase 11 Import Impact Safety
on:
  pull_request:
    paths:
      - 'hlm-phase11-import-impact.js'
      - 'hlm-phase11-import-impact.test.js'
      - '.github/workflows/phase11-import-impact.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-import-impact.test.js
      - run: node hlm-phase11-roster-import.test.js
