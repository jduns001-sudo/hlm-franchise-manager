name: Mission 1534 Invalid Trade Ownership
on:
  pull_request:
  workflow_dispatch:
jobs:
  invalid-owner-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node -e "const {chromium}=require('playwright');const fs=require('fs');if(!fs.existsSync(chromium.executablePath()))process.exit(1)"
      - run: node hlm-phase11-m1534-invalid-owner-trade.chromium.test.js
