name: Phase 11 Real Engine Playable Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-real-engine-playable.test.js'
      - '.github/workflows/phase11-real-engine-playable.yml'
  workflow_dispatch:
jobs:
  real-engine-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-real-engine-playable.test.js
