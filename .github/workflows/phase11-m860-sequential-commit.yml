name: Phase 11 Mission 860 Sequential Commit Crash
on:
  pull_request:
    paths:
      - 'tests/phase11-m860-sequential-commit.html'
      - 'tests/phase11-m860-sequential-commit.spec.js'
      - '.github/workflows/phase11-m860-sequential-commit.yml'
  push:
    branches: [phase11-m860-sequential-commit-crash]
permissions:
  contents: read
jobs:
  chromium-sequential-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m860-sequential-commit.spec.js --workers=1
      - run: npm test
