name: Phase 11 Cross Tab Safety
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-tab-guard*'
      - '.github/workflows/phase11-cross-tab.yml'
  workflow_dispatch:
jobs:
  node-coordination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-isolated-tab-guard.test.js
      - run: node hlm-phase11-isolated-journal.test.js
      - run: node hlm-phase11-season-ledger-session.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-isolated-tab-guard.chromium.test.js
