name: Phase 11 Front Office Roster Bridge
on:
  pull_request:
    paths:
      - 'hlm-phase11-frontoffice-roster-bridge*'
      - '.github/workflows/phase11-frontoffice-roster-bridge.yml'
  workflow_dispatch:
jobs:
  node-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-frontoffice-roster-bridge.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-frontoffice-roster-bridge.chromium.test.js
