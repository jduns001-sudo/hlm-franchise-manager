name: Mission 1643 CPU Trade Review Integration
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1643-*'
      - '.github/workflows/mission-1643-cpu-trade-review-integration.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1643-cpu-trade-review-integration.test.js
  review-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node hlm-phase11-m1643-cpu-trade-review-integration.chromium.test.js
