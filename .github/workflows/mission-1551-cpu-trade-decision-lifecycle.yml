name: Mission 1551 CPU Trade Decision Lifecycle
on:
  pull_request:
  workflow_dispatch:
jobs:
  cpu-lifecycle-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1551-cpu-trade-decision-lifecycle.test.js
      - run: node hlm-phase11-m1549-cpu-trade-evidence-bridge.test.js
  cpu-lifecycle-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node -e "const {chromium}=require('playwright');const fs=require('fs');if(!fs.existsSync(chromium.executablePath()))process.exit(1)"
      - run: node hlm-phase11-m1551-cpu-trade-decision-lifecycle.chromium.test.js
