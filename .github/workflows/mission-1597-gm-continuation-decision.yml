name: Mission 1597 GM Continuation Decision
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1597-*'
      - '.github/workflows/mission-1597-gm-continuation-decision.yml'
  workflow_dispatch:
jobs:
  gm-decision-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1597-gm-continuation-decision.js
      - run: node hlm-phase11-m1597-gm-continuation-decision.test.js
  gm-decision-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1597-gm-continuation-decision.chromium.test.js
