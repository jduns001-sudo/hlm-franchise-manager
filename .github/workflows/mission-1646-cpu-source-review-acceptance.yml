name: Mission 1646 CPU Source Review Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1646-*'
      - '.github/workflows/mission-1646-cpu-source-review-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-review-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1646-cpu-source-review-acceptance.test.js
