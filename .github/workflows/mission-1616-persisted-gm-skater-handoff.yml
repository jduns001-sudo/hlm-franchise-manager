name: Mission 1616 Persisted GM Skater Handoff
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1616-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1616-persisted-gm-skater-handoff.yml'
  workflow_dispatch:
jobs:
  gm-handoff-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1616-persisted-gm-skater-handoff.js
      - run: node hlm-phase11-m1616-persisted-gm-skater-handoff.test.js
  gm-handoff-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1616-persisted-gm-skater-handoff.chromium.test.js
