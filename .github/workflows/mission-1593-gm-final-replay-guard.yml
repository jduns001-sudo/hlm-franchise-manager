name: Mission 1593 GM Final Replay Guard
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1593-*'
      - '.github/workflows/mission-1593-gm-final-replay-guard.yml'
  workflow_dispatch:
jobs:
  final-replay-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1593-gm-final-replay-guard.js
      - run: node hlm-phase11-m1593-gm-final-replay-guard.test.js
  final-replay-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1593-gm-final-replay-guard.chromium.test.js
