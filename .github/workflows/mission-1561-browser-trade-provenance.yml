name: Mission 1561 Browser Trade Provenance
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1561-*'
      - '.github/workflows/mission-1561-browser-trade-provenance.yml'
  workflow_dispatch:
jobs:
  provenance-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1561-browser-trade-provenance.test.js
  provenance-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1561-browser-trade-provenance.chromium.test.js
