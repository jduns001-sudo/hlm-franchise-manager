  workflow_dispatch:
jobs:
  browser-persistent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Experimental shift shot-event gameplay regression
        run: node hlm-phase11-shift-shot-events.test.js
      - name: Experimental positional shift rotation gameplay regression
        run: node hlm-phase11-shift-rotation.test.js
      - name: Experimental five-skater lineup ice-time gameplay regression
        run: node hlm-phase11-lineup-ice-time.test.js
      - name: Experimental GM evidence review action plan and human approval regression
        run: node hlm-phase11-gm-evidence-review-action-plan.test.js
      - name: Experimental GM evidence review priority summary and human approval regression
        run: node hlm-phase11-gm-evidence-review-priority-summary.test.js
      - name: Experimental GM evidence review summary and human approval regression
        run: node hlm-phase11-gm-evidence-review-summary.test.js
      - name: Experimental GM evidence review readiness and human approval regression
        run: node hlm-phase11-gm-evidence-review-readiness.test.js
      - name: Experimental GM evidence decision review and human approval regression
        run: node hlm-phase11-gm-evidence-decision-review.test.js
      - name: Experimental GM evidence decision explanations and human approval regression
        run: node hlm-phase11-gm-evidence-decision-explanations.test.js
      - name: Experimental GM evidence priority decisions and human approval regression
        run: node hlm-phase11-gm-evidence-priority-decisions.test.js
      - name: Experimental GM evidence trend priorities and human approval regression
        run: node hlm-phase11-gm-evidence-trend-priorities.test.js
      - name: Experimental GM evidence trend alerts and human approval regression
        run: node hlm-phase11-gm-evidence-trend-alerts.test.js
      - name: Experimental GM evidence trend and human approval regression
        run: node hlm-phase11-gm-evidence-trend.test.js
      - name: Experimental GM evidence coverage and human approval regression
        run: node hlm-phase11-gm-evidence-coverage.test.js
      - name: Experimental GM evidence action queue and human approval regression
        run: node hlm-phase11-gm-evidence-action-queue.test.js
      - name: Experimental GM evidence summary and human approval regression
        run: node hlm-phase11-gm-evidence-summary.test.js
      - name: Experimental GM decision evidence readiness and approval regression
        run: node hlm-phase11-gm-decision-readiness.test.js
      - name: Experimental GM decision audit and evidence regression
        run: node hlm-phase11-gm-decision-audit.test.js
      - name: Experimental GM priority history provenance and approval regression
        run: node hlm-phase11-gm-priority-history.test.js
      - name: Experimental season priority board GM authority regression
        run: node hlm-phase11-season-priority-board.test.js
      - name: Experimental performance advisory and human GM authority regression
        run: node hlm-phase11-performance-advisory.test.js
      - name: Experimental owner CPU season momentum and GM advisory regression
        run: node hlm-phase11-season-momentum.test.js
      - name: Experimental owner CPU form and history regression
        run: node hlm-phase11-league-trends.test.js
      - name: Experimental GM readiness and approval regression
        run: node hlm-phase11-gm-readiness.test.js
      - name: Experimental season history and GM decision regression
        run: node hlm-phase11-season-decision-history.test.js
      - name: Atomic save and recovery regressions
        run: node hlm-phase11-isolated-season-atomic-store.test.js
      - name: Integrated roster season regression
        run: node hlm-phase11-real-roster-multiday-preview.test.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Existing browser preview regression
        run: node hlm-phase11-browser-season-workbench.test.js
      - name: Mobile browser isolated save, reload and production safety
        run: node hlm-phase11-browser-persistent-season.test.js
