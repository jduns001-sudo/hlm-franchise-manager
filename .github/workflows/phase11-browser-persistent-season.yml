name: Phase 11 Browser Persistent Season
on:
  pull_request:
    paths:
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-season-workbench.bundle.js'
      - 'hlm-phase11-isolated-season-store.bundle.js'
      - 'hlm-phase11-browser-persistent-season.test.js'
      - 'hlm-phase11-season-decision-history.js'
      - 'hlm-phase11-season-decision-history.bundle.js'
      - 'hlm-phase11-season-decision-history.test.js'
      - 'hlm-phase11-gm-readiness.js'
      - 'hlm-phase11-gm-readiness.bundle.js'
      - 'hlm-phase11-gm-readiness.test.js'
      - 'hlm-phase11-league-trends.js'
      - 'hlm-phase11-league-trends.bundle.js'
      - 'hlm-phase11-league-trends.test.js'
      - 'hlm-phase11-season-momentum.js'
      - 'hlm-phase11-season-momentum.bundle.js'
      - 'hlm-phase11-season-momentum.test.js'
      - 'hlm-phase11-performance-advisory.js'
      - 'hlm-phase11-performance-advisory.bundle.js'
      - 'hlm-phase11-performance-advisory.test.js'
      - '.github/workflows/phase11-browser-persistent-season.yml'
  workflow_dispatch:
jobs:
  browser-persistent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Experimental performance advisory and human GM authority regression
        run: node hlm-phase11-performance-advisory.test.js
      - name: Experimental owner CPU season momentum and GM advisory regression
        run: node hlm-phase11-season-momentum.test.js
      - name: Experimental owner CPU form and history regression
        run: node hlm-phase11-league-trends.test.js
      - name: Experimental GM readiness and approval regression
        run: node hlm-phase11-gm-readiness.test.js
      - name: Experimental season history and GM decision regression
        run: node hlm-phase11-season-decision-history.test.js
      - name: Atomic save and recovery regressions
        run: node hlm-phase11-isolated-season-atomic-store.test.js
      - name: Integrated roster season regression
        run: node hlm-phase11-real-roster-multiday-preview.test.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Existing browser preview regression
        run: node hlm-phase11-browser-season-workbench.test.js
      - name: Mobile browser isolated save, reload and production safety
        run: node hlm-phase11-browser-persistent-season.test.js
