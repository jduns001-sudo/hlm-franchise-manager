name: Phase 11 Guarded Save Consent
on:
  pull_request:
    paths:
      - 'app.html'
      - 'hlm-phase11-guarded-save-consent*'
      - '.github/workflows/phase11-guarded-save-consent.yml'
  workflow_dispatch:
jobs:
  consent-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-guarded-save-consent.test.js
  actual-app-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-guarded-save-consent.chromium.test.js
