name: Mission 1638 Atomic Failure Recovery
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1638-atomic-failure-recovery.test.js'
      - '.github/workflows/mission-1638-atomic-failure-recovery.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atomic-failure-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts miniflare@3
      - run: node --test hlm-phase11-m1638-atomic-failure-recovery.test.js
