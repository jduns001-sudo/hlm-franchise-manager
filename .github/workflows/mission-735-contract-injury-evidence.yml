name: Mission 735 Contract Injury Evidence Tests
on:
  push:
    branches:
      - mission-735-contract-injury-evidence
  pull_request:
    paths:
      - 'hlm-phase10-contract-injury-evidence.js'
      - 'hlm-phase10-contract-injury-evidence.test.js'
      - 'docs/MISSION_735_CONTRACT_INJURY_EVIDENCE.md'
      - '.github/workflows/mission-735-contract-injury-evidence.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-contract-injury-evidence.test.js
