name: Phase 11 App Roster Contract Chromium
on:
  pull_request:
    paths:
      - 'hlm-phase11-app-roster-contract.spec.js'
      - 'hlm-phase11-app-roster-contract.config.js'
      - '.github/workflows/phase11-app-roster-contract.yml'
      - 'app.html'
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-app-roster-contract.config.js
