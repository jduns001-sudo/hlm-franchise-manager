name: Mission 1553 CPU Consent Evidence Boundary
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1553-*'
      - '.github/workflows/mission-1553-cpu-consent-evidence.yml'
  workflow_dispatch:
jobs:
  consent-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1553-cpu-consent-evidence-boundary.test.js
  consent-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1553-cpu-consent-evidence-boundary.chromium.test.js
