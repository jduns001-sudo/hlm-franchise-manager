name: Mission 1507C GM Decision Center
on:
  pull_request:
    paths:
      - 'hlm-phase11-gm-decision-center.js'
      - 'hlm-phase11-gm-decision-center.test.js'
      - 'hlm-phase11-mobile-office.html'
      - '.github/workflows/mission-1507c-gm-decision-center.yml'
  workflow_dispatch:
jobs:
  gm-decision-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-decision-center.test.js
  gm-decision-mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-mobile-office.chromium.test.js
