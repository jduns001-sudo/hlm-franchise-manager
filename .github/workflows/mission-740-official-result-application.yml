name: Mission 740 Official Result Application Tests
on:
  push:
    branches:
      - mission-740-official-result-application-gate
  pull_request:
    paths:
      - 'hlm-phase10-official-result-application.js'
      - 'hlm-phase10-official-result-application.test.js'
      - '.github/workflows/mission-740-official-result-application.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-official-result-application.test.js
