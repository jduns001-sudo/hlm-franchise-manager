name: Phase 11 Mission 924 Explicit Commit Error Recovery
on:
  pull_request:
    paths:
      - 'tests/phase11-m924-commit-error-recovery.html'
      - 'tests/phase11-m924-commit-error-recovery.spec.js'
      - '.github/workflows/phase11-m924-commit-error-recovery.yml'
  push:
    branches: [phase11-m924-explicit-commit-request-error-recovery]
permissions:
  contents: read
jobs:
  chromium-commit-error-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m924-commit-error-recovery.spec.js --workers=1
      - run: npm test
