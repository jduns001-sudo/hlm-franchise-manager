name: Phase 11 Real Browser IndexedDB Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-real-browser-idb.spec.js'
      - 'hlm-phase11-real-browser-idb.config.js'
      - '.github/workflows/phase11-real-browser-idb.yml'
  push:
    branches: [phase11-real-browser-idb-acceptance]
permissions:
  contents: read
jobs:
  browser-idb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-real-browser-idb.config.js
      - run: node hlm-phase11-idb-portable-export.test.js
      - run: node hlm-phase11-indexeddb-backup.test.js
      - run: npm test
