name: Phase 11 Real Front Office GM Entry
on:
  pull_request:
    paths:
      - 'app.html'
      - 'hlm-phase11-frontoffice-gm-entry*'
      - '.github/workflows/phase11-real-frontoffice-gm-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-frontoffice-gm-entry.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-frontoffice-gm-entry.chromium.test.js
