name: Batch 957-964 Experimental Highlight Period Analytics
on:
  push:
    branches:
      - batch-957-964-experimental-highlight-period-analytics
  pull_request:
    paths:
      - 'hlm-experimental-highlight-period-analytics.js'
      - 'hlm-experimental-highlight-period-analytics.test.js'
      - 'docs/BATCH_957_964_EXPERIMENTAL_HIGHLIGHT_PERIOD_ANALYTICS.md'
      - '.github/workflows/batch-957-964-highlight-period-analytics.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-experimental-highlight-period-analytics.test.js
