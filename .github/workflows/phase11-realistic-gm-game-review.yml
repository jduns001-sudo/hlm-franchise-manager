name: Phase 11 Realistic GM Game Review
on:
  pull_request:
    paths:
      - 'hlm-phase11-gameplay-bridge.js'
      - 'hlm-phase11-gameplay-bridge.html'
      - 'hlm-phase11-realistic-gm-game-review*'
      - '.github/workflows/phase11-realistic-gm-game-review.yml'
  workflow_dispatch:
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-realistic-gm-game-review.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-realistic-gm-game-review.chromium.test.js