name: Phase 11 Durable Export Failure Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-idb-portable-export.js'
      - 'hlm-phase11-idb-portable-export.test.js'
      - '.github/workflows/phase11-durable-export.yml'
  push:
    branches: [phase11-durable-export-failure-acceptance]
permissions:
  contents: read
jobs:
  durable-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-idb-portable-export.test.js
      - run: node hlm-phase11-indexeddb-backup.test.js
      - run: node hlm-phase11-production-readiness.test.js
      - run: npm test
