name: Phase 11 Ordinary Save Concurrency
on:
  pull_request:
    paths:
      - 'hlm-phase11-ordinary-save-concurrency*'
      - '.github/workflows/phase11-ordinary-save-concurrency.yml'
  workflow_dispatch:
jobs:
  ordinary-save-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-ordinary-save-concurrency.test.js
  actual-app-two-tab-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-ordinary-save-concurrency.chromium.test.js
