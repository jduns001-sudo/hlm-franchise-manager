name: Mission 1359 Continuous GM Journey
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-continuous-gm-journey.chromium.test.js'
      - '.github/workflows/mission-1359-continuous-gm-journey.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-journey-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-stat-review.test.js
      - run: node hlm-phase11-career-rollover.test.js
      - run: node hlm-phase11-isolated-single-game.test.js
  mobile-continuous-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-continuous-gm-journey.chromium.test.js
