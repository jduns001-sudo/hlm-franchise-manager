name: Foundation Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  foundation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run foundation and Phase 2 tests
        run: npm test
