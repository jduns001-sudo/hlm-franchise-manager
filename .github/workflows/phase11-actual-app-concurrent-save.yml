name: Phase 11 Actual App Concurrent Save
on:
  pull_request:
    paths:
      - 'hlm-phase11-actual-app-concurrent-save*'
      - '.github/workflows/phase11-actual-app-concurrent-save.yml'
  workflow_dispatch:
jobs:
  node-guard-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-actual-app-concurrent-save.test.js
  real-app-two-tab-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-actual-app-concurrent-save.chromium.test.js
