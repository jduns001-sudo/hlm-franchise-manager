name: Mission 1599 GM Receipt Game Review
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1599-*'
      - '.github/workflows/mission-1599-gm-receipt-game-review.yml'
  workflow_dispatch:
jobs:
  receipt-review-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1599-gm-receipt-game-review.js
      - run: node hlm-phase11-m1599-gm-receipt-game-review.test.js
  receipt-review-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1599-gm-receipt-game-review.chromium.test.js
