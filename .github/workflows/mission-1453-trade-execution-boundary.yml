name: Mission 1453 Trade Execution Boundary
on:
  pull_request:
    paths:
      - 'hlm-phase11-trade-execution-boundary*'
      - '.github/workflows/mission-1453-trade-execution-boundary.yml'
  workflow_dispatch:
jobs:
  trade-boundary-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-trade-execution-boundary.test.js
  trade-boundary-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-trade-execution-boundary.chromium.test.js
