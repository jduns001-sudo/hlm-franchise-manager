name: Mission 1608 CPU Fixture Progress
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1608-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1608-cpu-fixture-progress.yml'
  workflow_dispatch:
jobs:
  progress-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1608-visible-cpu-fixture-progress.js
      - run: node hlm-phase11-m1608-visible-cpu-fixture-progress.test.js
  progress-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1608-visible-cpu-fixture-progress.chromium.test.js
