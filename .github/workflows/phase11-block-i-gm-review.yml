name: Phase 11 Block I GM Review Replay Safety
on:
  pull_request:
    paths:
      - 'hlm-phase11-block-i-gm-review.test.py'
      - 'hlm-phase11-block-e-guarded-synthetic-day.py'
      - '.github/workflows/phase11-block-i-gm-review.yml'
  workflow_dispatch:
jobs:
  gm-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Review-bound multi-day simulation regression
        run: python3 hlm-phase11-block-i-gm-review.test.py -v
