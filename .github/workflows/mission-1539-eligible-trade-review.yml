name: Mission 1539 Eligible Trade Review
on:
  pull_request:
  workflow_dispatch:
jobs:
  eligible-review-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node hlm-phase11-m1539-eligible-trade-review.chromium.test.js
