name: Mission 1607 Visible CPU Fixture List
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1607-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1607-visible-cpu-fixture-list.yml'
  workflow_dispatch:
jobs:
  cpu-fixtures-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1607-visible-cpu-fixture-list.js
      - run: node hlm-phase11-m1607-visible-cpu-fixture-list.test.js
  cpu-fixtures-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1607-visible-cpu-fixture-list.chromium.test.js
