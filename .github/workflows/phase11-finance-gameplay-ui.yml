name: Phase 11 Finance Gameplay UI
on:
  pull_request:
    paths:
      - 'index.html'
      - 'hlm-phase11-browser-finance.js'
      - 'hlm-phase11-real-finance.html'
      - 'hlm-phase11-finance-gameplay-ui.test.js'
      - '.github/workflows/phase11-finance-gameplay-ui.yml'
  workflow_dispatch:
jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-finance-gameplay-ui.test.js
      - run: node hlm-phase11-browser-finance.test.js
