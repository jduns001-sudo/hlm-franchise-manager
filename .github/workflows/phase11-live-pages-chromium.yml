name: Phase 11 Live Pages Chromium
on:
  pull_request:
    paths:
      - 'hlm-phase11-live-pages-chromium.test.js'
      - '.github/workflows/phase11-live-pages-chromium.yml'
  workflow_dispatch:
jobs:
  live-pages-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-live-pages-chromium.test.js
