name: Mission 1441 Source Pick Ownership
on:
  push:
    branches: [mission-1441-source-backed-pick-ownership]
  pull_request:
    paths:
      - 'hlm-phase11-source-pick-transfer*'
      - 'hlm-phase11-isolated-single-game.js'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1441-source-pick-ownership.yml'
jobs:
  source-pick-ownership-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-source-pick-transfer.test.js
  source-pick-ownership-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-source-pick-transfer.chromium.test.js
