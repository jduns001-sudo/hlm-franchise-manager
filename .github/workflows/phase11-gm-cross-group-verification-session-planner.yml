name: Phase 11 GM Cross Group Verification Session Planner
on:
  pull_request:
    paths:
      - 'hlm-phase11-gm-cross-group-verification-session-planner*'
      - 'hlm-phase11-gameplay-bridge.html'
      - '.github/workflows/phase11-gm-cross-group-verification-session-planner.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-cross-group-verification-session-planner.test.js
      - run: node hlm-phase11-gm-human-verification-action-queue.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-cross-group-verification-session-planner.chromium.test.js
