name: Phase 11 Mission 914 Multi Connection Versionchange Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m914-multiconnection-upgrade.html'
      - 'tests/phase11-m914-multiconnection-upgrade.spec.js'
      - '.github/workflows/phase11-m914-multiconnection-upgrade.yml'
  push:
    branches: [phase11-m914-multiconnection-versionchange]
permissions:
  contents: read
jobs:
  chromium-multiconnection-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m914-multiconnection-upgrade.spec.js --workers=1
      - run: npm test
