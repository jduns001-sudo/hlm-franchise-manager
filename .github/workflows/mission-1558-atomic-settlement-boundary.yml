name: Mission 1558 Atomic Settlement Boundary
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1558-*'
      - '.github/workflows/mission-1558-atomic-settlement-boundary.yml'
  workflow_dispatch:
jobs:
  settlement-boundary-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1558-atomic-settlement-boundary.test.js
  settlement-boundary-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1558-atomic-settlement-boundary.chromium.test.js
