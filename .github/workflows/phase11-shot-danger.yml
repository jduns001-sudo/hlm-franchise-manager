name: Phase 11 Shot Danger
on:
  pull_request:
    paths:
      - 'hlm-phase11-shot-danger*'
      - 'hlm-phase11-player-xg*'
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-persistent-season.test.js'
      - '.github/workflows/phase11-shot-danger.yml'
  workflow_dispatch:
jobs:
  shot-danger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-shot-danger.test.js
      - run: node hlm-phase11-player-xg.test.js
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-browser-persistent-season.test.js
