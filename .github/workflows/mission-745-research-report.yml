name: Mission 745 Experimental Research Report
on:
  push:
    branches:
      - mission-745-experimental-research-report
  pull_request:
    paths:
      - 'hlm-phase10-experimental-research-report.js'
      - 'hlm-phase10-experimental-research-report.test.js'
      - 'docs/MISSION_745_EXPERIMENTAL_RESEARCH_REPORT.md'
      - '.github/workflows/mission-745-research-report.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-research-report.test.js
