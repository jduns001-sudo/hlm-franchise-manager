name: Phase 11 Mission 872 Read Snapshot Consistency
on:
  pull_request:
    paths:
      - 'tests/phase11-m872-read-snapshot.html'
      - 'tests/phase11-m872-read-snapshot.spec.js'
      - '.github/workflows/phase11-m872-read-snapshot.yml'
  push:
    branches: [phase11-m872-readonly-snapshot-consistency]
permissions:
  contents: read
jobs:
  chromium-read-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m872-read-snapshot.spec.js --workers=1
      - run: npm test
