name: Phase 11 Integrated Season Readiness
on:
  pull_request:
    paths:
      - 'hlm-phase11-integrated-season-readiness.js'
      - 'hlm-phase11-integrated-season-readiness.test.js'
      - '.github/workflows/phase11-integrated-season-readiness.yml'
  workflow_dispatch:
jobs:
  integrated-season-readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrated season and owner CPU regression
        run: node hlm-phase11-integrated-season-readiness.test.js
