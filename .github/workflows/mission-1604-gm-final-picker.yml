name: Mission 1604 GM Final Picker
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1604-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1604-gm-final-picker.yml'
  workflow_dispatch:
jobs:
  gm-final-picker-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1604-gm-final-picker.js
      - run: node hlm-phase11-m1604-gm-final-picker.test.js
  gm-final-picker-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1604-gm-final-picker.chromium.test.js
