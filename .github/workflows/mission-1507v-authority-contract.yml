name: Mission 1507V Receiving Team Authority Contract
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1507v-authority-contract.js'
      - 'hlm-phase11-m1507v-authority-contract.test.js'
      - '.github/workflows/mission-1507v-authority-contract.yml'
  workflow_dispatch:
jobs:
  authority-contract-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1507v-authority-contract.test.js
