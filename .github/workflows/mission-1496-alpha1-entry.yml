name: Mission 1496 Alpha 1 Front Office Entry
on:
  pull_request:
    paths:
      - 'app.html'
      - 'hlm-phase11-alpha1-entry.chromium.test.js'
      - '.github/workflows/mission-1496-alpha1-entry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-entry-chromium:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node hlm-phase11-alpha1-entry.chromium.test.js
