name: Phase 11 Mission 895 Reverse Primary Jump Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m895-reverse-primary-jump.html'
      - 'tests/phase11-m895-reverse-primary-jump.spec.js'
      - '.github/workflows/phase11-m895-reverse-primary-jump.yml'
  push:
    branches: [phase11-m895-index-cursor-prev-primary-jump-durability]
permissions:
  contents: read
jobs:
  chromium-reverse-primary-jump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m895-reverse-primary-jump.spec.js --workers=1
      - run: npm test
