name: Mission 1535 Trade Permission Acceptance
on:
  pull_request:
  workflow_dispatch:
jobs:
  permission-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1535-trade-permission.chromium.test.js
