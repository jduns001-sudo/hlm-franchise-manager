name: Mission 1411 GM Queue Game Commit
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-gm-day-matchup.chromium.test.js'
      - '.github/workflows/mission-1411-gm-queue-game-commit.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-reviewed-game-day-participation.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-day-matchup.chromium.test.js
