name: Phase 11 Live Import Preview Browser
on:
  pull_request:
    paths:
      - 'phase11-live-import-preview.html'
      - 'hlm-phase11-live-import-preview.js'
      - 'hlm-phase11-live-import-preview.spec.js'
      - 'hlm-phase11-live-import-preview.config.js'
      - '.github/workflows/phase11-live-import-preview.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-live-import-preview.config.js
      - run: node hlm-phase11-import-impact.test.js
