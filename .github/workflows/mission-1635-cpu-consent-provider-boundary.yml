name: Mission 1635 CPU Consent Provider Boundary
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1635-*'
      - '.github/workflows/mission-1635-cpu-consent-provider-boundary.yml'
  workflow_dispatch:
jobs:
  provider-boundary-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1635-cpu-consent-provider-boundary.test.js
