name: Mission 1574 Saved-Season Trade Source Preflight
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1573-*'
      - 'hlm-phase11-m1574-*'
      - '.github/workflows/mission-1574-season-trade-source-preflight.yml'
  workflow_dispatch:
jobs:
  source-preflight-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1573-season-trade-source.js
      - run: node --check hlm-phase11-m1573-season-trade-panel.js
      - run: node hlm-phase11-m1574-season-trade-preflight.test.js
      - run: node hlm-phase11-m1573-season-trade-source.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  source-preflight-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1573-active-season-trade-planning.chromium.test.js
