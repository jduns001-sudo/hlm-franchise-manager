name: Phase 11 Real Universe Career Gate
on:
  pull_request:
    paths:
      - 'hlm-phase11-real-universe-career-gate*'
      - '.github/workflows/phase11-real-universe-career-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-real-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-real-universe-career-gate.test.js
      - run: node hlm-phase11-real-universe-gameplay-acceptance.test.js
      - run: node hlm-phase11-multiseason-continuity.test.js
  mobile-real-universe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-real-universe-career-gate.chromium.test.js
