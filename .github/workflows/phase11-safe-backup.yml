name: Phase 11 Safe Backup Chromium
on:
  pull_request:
    paths:
      - 'app.html'
      - 'hlm-phase11-safe-backup.spec.js'
      - 'hlm-phase11-safe-backup.config.js'
      - '.github/workflows/phase11-safe-backup.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-safe-backup.config.js
