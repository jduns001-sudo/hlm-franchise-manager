name: Mission 1374 Mobile GM Skater Controls
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-mobile-skater-controls.test.js'
      - 'hlm-phase11-mobile-skater-controls.chromium.test.js'
      - '.github/workflows/mission-1374-mobile-skater-controls.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-mobile-skater-controls.test.js
      - run: node hlm-phase11-approved-skater-participation.test.js
      - run: node hlm-phase11-experimental-overtime-integrity.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-mobile-skater-controls.chromium.test.js
