name: Mission 1529 Source CPU Advisory
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1527-real-source-browser-review.js'
      - 'hlm-phase11-m1529-source-cpu-advisory.chromium.test.js'
      - '.github/workflows/mission-1529-source-cpu-advisory.yml'
  workflow_dispatch:
jobs:
  source-cpu-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1529-source-cpu-advisory.chromium.test.js
