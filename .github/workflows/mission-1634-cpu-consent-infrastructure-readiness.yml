name: Mission 1634 CPU Consent Infrastructure Readiness
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1634-*'
      - '.github/workflows/mission-1634-cpu-consent-infrastructure-readiness.yml'
  workflow_dispatch:
jobs:
  readiness-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1634-cpu-consent-infrastructure-readiness.test.js
