name: Mission 1516 Atomic Isolated State Persistence
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1516-atomic-isolated-state-persistence.js'
      - 'hlm-phase11-m1516-atomic-isolated-state-persistence.test.js'
      - '.github/workflows/mission-1516-atomic-isolated-state-persistence.yml'
  workflow_dispatch:
jobs:
  atomic-state-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1516-atomic-isolated-state-persistence.test.js
