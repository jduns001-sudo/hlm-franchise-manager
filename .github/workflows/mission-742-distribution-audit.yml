name: Mission 742 Experimental Distribution Audit
on:
  push:
    branches:
      - mission-742-experimental-goal-distribution-audit
  pull_request:
    paths:
      - 'hlm-phase10-experimental-goal-distribution-audit.js'
      - 'hlm-phase10-experimental-goal-distribution-audit.test.js'
      - 'docs/MISSION_742_EXPERIMENTAL_DISTRIBUTION_AUDIT.md'
      - '.github/workflows/mission-742-distribution-audit.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-goal-distribution-audit.test.js
