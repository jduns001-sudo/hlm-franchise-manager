name: Mission 1622 GM CPU Game-Day Integration
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1622-*'
      - '.github/workflows/mission-1622-gm-cpu-game-day.yml'
  workflow_dispatch:
jobs:
  gm-cpu-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1622-gm-cpu-game-day.test.js
  gm-cpu-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1622-gm-cpu-game-day.chromium.test.js
