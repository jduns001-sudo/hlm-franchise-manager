name: Mission 1462 Integrated Player Pick Trade
on:
  pull_request:
    paths:
      - 'hlm-phase11-integrated-player-pick-trade.js'
      - 'hlm-phase11-integrated-player-pick-trade.test.js'
      - '.github/workflows/mission-1462-integrated-player-pick-trade.yml'
  workflow_dispatch:
jobs:
  integrated-trade-node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-integrated-player-pick-trade.test.js
  trade-boundary-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-trade-execution-boundary.chromium.test.js
