name: Mission 750 Roster Playoff Game
on:
  push:
    branches: [mission-750-roster-weighted-playoff-game]
  pull_request:
    paths:
      - 'hlm-phase10-roster-playoff-game.js'
      - 'hlm-phase10-roster-playoff-game.test.js'
      - '.github/workflows/mission-750-roster-playoff.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-roster-playoff-game.test.js
