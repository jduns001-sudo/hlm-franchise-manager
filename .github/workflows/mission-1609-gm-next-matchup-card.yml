name: Mission 1609 GM Next Matchup Card
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1609-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1609-gm-next-matchup-card.yml'
  workflow_dispatch:
jobs:
  gm-next-matchup-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1609-gm-next-matchup-card.js
      - run: node hlm-phase11-m1609-gm-next-matchup-card.test.js
  gm-next-matchup-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1609-gm-next-matchup-card.chromium.test.js
