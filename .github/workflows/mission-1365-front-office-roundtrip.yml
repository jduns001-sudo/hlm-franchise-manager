name: Mission 1365 Front Office Round Trip
on:
  pull_request:
    paths:
      - 'hlm-phase11-continuous-gm-journey.chromium.test.js'
      - 'hlm-phase11-front-office-roundtrip.node.test.js'
      - '.github/workflows/mission-1365-front-office-roundtrip.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-front-office-roundtrip.node.test.js
      - run: node hlm-phase11-isolated-single-game.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-continuous-gm-journey.chromium.test.js
