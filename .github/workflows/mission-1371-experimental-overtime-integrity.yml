name: Mission 1371 Experimental Overtime Integrity
on:
  pull_request:
    paths:
      - 'hlm-phase10-game-simulator.js'
      - 'hlm-phase11-experimental-overtime-integrity.test.js'
      - 'hlm-phase11-experimental-overtime-integrity.chromium.test.js'
      - '.github/workflows/mission-1371-experimental-overtime-integrity.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-experimental-overtime-integrity.test.js
      - run: node hlm-phase11-experimental-roster-score.test.js
      - run: node hlm-phase10-game-simulator.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-experimental-overtime-integrity.chromium.test.js
