name: Mission 1447 GM Trade Review
on:
  pull_request:
    paths:
      - 'hlm-phase11-gm-trade-review.js'
      - 'hlm-phase11-gm-trade-review.test.js'
      - 'hlm-phase11-gm-trade-review.chromium.test.js'
      - '.github/workflows/mission-1447-gm-trade-review.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gm-trade-review-node:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-gm-trade-review.test.js hlm-phase11-isolated-trade-decision.test.js
  gm-trade-review-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-trade-review.chromium.test.js
