name: Mission 1583 Playoff Postgame Continuity
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1583-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1583-playoff-postgame-continuity.yml'
  workflow_dispatch:
jobs:
  playoff-continuity-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1583-playoff-postgame-continuity.js
      - run: node --check hlm-phase11-m1583-playoff-postgame-continuity-panel.js
      - run: node hlm-phase11-m1583-playoff-postgame-continuity.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  playoff-continuity-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1573-active-season-trade-planning.chromium.test.js
