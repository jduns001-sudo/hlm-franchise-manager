name: Phase 11 Playable Roster Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-playable-roster-acceptance*'
      - '.github/workflows/phase11-playable-roster-acceptance.yml'
  workflow_dispatch:
jobs:
  real-universe-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-playable-roster-acceptance.test.js
  two-tab-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-playable-roster-acceptance.chromium.test.js
