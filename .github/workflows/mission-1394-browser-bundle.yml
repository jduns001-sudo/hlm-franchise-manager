name: Mission 1394 Browser Bundle Roster Sync
on:
  pull_request:
    paths:
      - 'hlm-phase10-browser.bundle.js'
      - 'hlm-phase11-browser-bundle-roster-sync.test.js'
      - 'hlm-phase11-deployed-bundle-roster-sync.chromium.test.js'
      - '.github/workflows/mission-1394-browser-bundle.yml'
  push:
    branches: [main]
    paths:
      - 'hlm-phase10-browser.bundle.js'
      - 'hlm-phase11-deployed-bundle-roster-sync.chromium.test.js'
      - '.github/workflows/mission-1394-browser-bundle.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-browser-bundle-roster-sync.test.js
      - run: node hlm-phase11-reviewed-offseason.test.js
  deployed-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-deployed-bundle-roster-sync.chromium.test.js
  live-pages-after-merge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Wait for Pages deployment and validate real bundle
        env:
          MISSION1394_LIVE_PAGES: '1'
        run: |
          for attempt in $(seq 1 12); do
            if node hlm-phase11-deployed-bundle-roster-sync.chromium.test.js; then exit 0; fi
            echo "Pages not yet verified, attempt $attempt/12"
            sleep 30
          done
          exit 1
