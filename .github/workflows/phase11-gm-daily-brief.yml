name: Phase 11 GM Daily Brief
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-gm-daily-brief*'
      - '.github/workflows/phase11-gm-daily-brief.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-daily-brief.test.js
      - run: node hlm-phase11-gm-game-focus.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-daily-brief.chromium.test.js
