name: Mission 1442 Reciprocal Pick Exchange
on:
  push:
    branches: [mission-1442-reciprocal-pick-exchange]
  pull_request:
    paths:
      - 'hlm-phase11-reciprocal-pick-exchange*'
      - '.github/workflows/mission-1442-reciprocal-pick-exchange.yml'
jobs:
  reciprocal-pick-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-reciprocal-pick-exchange.test.js
  reciprocal-pick-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-reciprocal-pick-exchange.chromium.test.js
