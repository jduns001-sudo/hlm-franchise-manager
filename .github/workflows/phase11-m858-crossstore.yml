name: Phase 11 Mission 858 Cross-Store Atomicity
on:
  pull_request:
    paths:
      - 'tests/phase11-m858-crossstore.html'
      - 'tests/phase11-m858-crossstore.spec.js'
      - '.github/workflows/phase11-m858-crossstore.yml'
  push:
    branches: [phase11-m858-cross-store-atomicity]
permissions:
  contents: read
jobs:
  chromium-crossstore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m858-crossstore.spec.js --workers=1
      - run: npm test
