name: Mission 1397 Prospect Signing Ledger
on:
  pull_request:
    paths:
      - 'hlm-phase11-drafted-prospect-signing.js'
      - 'hlm-phase11-drafted-prospect-signing.test.js'
      - 'hlm-phase11-drafted-prospect-signing.chromium.test.js'
      - 'hlm-phase10-browser.bundle.js'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1397-prospect-signing-ledger.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-drafted-prospect-signing.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-drafted-prospect-signing.chromium.test.js
