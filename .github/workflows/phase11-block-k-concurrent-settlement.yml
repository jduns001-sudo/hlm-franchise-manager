name: Phase 11 Block K Concurrent Settlement
on:
  pull_request:
    paths:
      - 'hlm-phase11-block-k-concurrent-settlement.test.py'
      - '.github/workflows/phase11-block-k-concurrent-settlement.yml'
  workflow_dispatch:
jobs:
  concurrent-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independent SQLite connections and replay acceptance
        run: python3 hlm-phase11-block-k-concurrent-settlement.test.py -v
