name: Mission 1598 GM Next Game Approval Receipt
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1598-*'
      - '.github/workflows/mission-1598-gm-next-game-approval-receipt.yml'
  workflow_dispatch:
jobs:
  gm-receipt-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1598-gm-next-game-approval-receipt.js
      - run: node hlm-phase11-m1598-gm-next-game-approval-receipt.test.js
  gm-receipt-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1598-gm-next-game-approval-receipt.chromium.test.js
