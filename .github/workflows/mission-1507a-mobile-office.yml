name: Mission 1507A Mobile Office
on:
  pull_request:
    paths:
      - 'hlm-phase11-mobile-office.html'
      - 'hlm-phase11-mobile-office.test.js'
      - 'hlm-phase11-mobile-office.chromium.test.js'
      - '.github/workflows/mission-1507a-mobile-office.yml'
  workflow_dispatch:
jobs:
  mobile-office-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-mobile-office.test.js
  mobile-office-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-mobile-office.chromium.test.js
