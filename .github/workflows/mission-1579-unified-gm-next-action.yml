name: Mission 1579 Unified GM Next Action
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1579-*'
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-m1573-active-season-trade-planning.chromium.test.js'
      - '.github/workflows/mission-1579-unified-gm-next-action.yml'
  workflow_dispatch:
jobs:
  unified-gm-next-action-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1579-unified-gm-next-action.js
      - run: node --check hlm-phase11-m1579-unified-gm-next-action-panel.js
      - run: node hlm-phase11-m1579-unified-gm-next-action.test.js
      - run: node hlm-phase11-m1578-contract-integration-requirements.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  unified-gm-next-action-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1573-active-season-trade-planning.chromium.test.js
