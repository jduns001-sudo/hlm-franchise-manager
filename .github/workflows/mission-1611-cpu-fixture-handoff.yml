name: Mission 1611 CPU Fixture Handoff
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1608-actionable-cpu-blocker-review.js'
      - 'hlm-phase11-m1611-*'
      - '.github/workflows/mission-1611-cpu-fixture-handoff.yml'
  workflow_dispatch:
jobs:
  handoff-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1611-cpu-fixture-handoff.test.js
  handoff-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1611-cpu-fixture-handoff.chromium.test.js
