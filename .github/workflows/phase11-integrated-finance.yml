name: Phase 11 Integrated Finance
on:
  pull_request:
    paths:
      - 'hlm-phase11-finance-integration.js'
      - 'hlm-phase11-finance-integration.test.js'
      - '.github/workflows/phase11-integrated-finance.yml'
  workflow_dispatch:
jobs:
  finance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-finance-integration.test.js
