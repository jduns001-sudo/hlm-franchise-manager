name: Phase 11 Mission 907 Read Your Writes Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m907-read-your-writes.html'
      - 'tests/phase11-m907-read-your-writes.spec.js'
      - '.github/workflows/phase11-m907-read-your-writes.yml'
  push:
    branches: [phase11-m907-transaction-visibility-durability]
permissions:
  contents: read
jobs:
  chromium-read-your-writes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m907-read-your-writes.spec.js --workers=1
      - run: npm test
