name: Mission 747 Experimental Validation Gates
on:
  push:
    branches:
      - mission-747-experimental-validation-gates-v2
  pull_request:
    paths:
      - 'hlm-phase10-experimental-validation-gates.js'
      - 'hlm-phase10-experimental-validation-gates.test.js'
      - 'docs/MISSION_747_EXPERIMENTAL_VALIDATION_GATES_PLAN.md'
      - '.github/workflows/mission-747-validation-gates.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-validation-gates.test.js
