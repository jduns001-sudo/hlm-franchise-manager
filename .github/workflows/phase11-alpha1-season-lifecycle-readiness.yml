name: Phase 11 Alpha 1 Season Lifecycle Readiness
on:
  pull_request:
    paths:
      - 'hlm-phase11-alpha1-season-lifecycle-readiness*'
      - '.github/workflows/phase11-alpha1-season-lifecycle-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lifecycle-node:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-alpha1-season-lifecycle-readiness.test.js
      - run: node hlm-phase11-season-ledger.test.js
