name: Phase 11 Block C Connected Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-block-c-connected-acceptance.test.js'
      - '.github/workflows/phase11-block-c-connected-acceptance.yml'
      - 'hlm-phase11-real-universe-journey.test.js'
      - 'hlm-phase11-block-b-protected-sqlite-integration.test.py'
  workflow_dispatch:
jobs:
  connected-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Connected real-universe and protected SQLite acceptance
        run: node --test hlm-phase11-block-c-connected-acceptance.test.js
