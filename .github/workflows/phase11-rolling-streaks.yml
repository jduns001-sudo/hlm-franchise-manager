name: Phase 11 Rolling Streaks
on:
  pull_request:
    paths:
      - 'hlm-phase11-rolling-streaks*'
      - 'hlm-phase11-multigame-consistency*'
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-persistent-season.test.js'
      - '.github/workflows/phase11-rolling-streaks.yml'
  workflow_dispatch:
jobs:
  rolling-streaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-rolling-streaks.test.js
      - run: node hlm-phase11-multigame-consistency.test.js
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-browser-persistent-season.test.js
