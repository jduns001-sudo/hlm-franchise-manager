name: Phase 11 Mission 853 Browser IndexedDB Recovery
on:
  pull_request:
    paths:
      - 'tests/phase11-m853-idb-browser.html'
      - 'tests/phase11-m853-idb-browser.spec.js'
      - '.github/workflows/phase11-m853-browser-idb-recovery.yml'
  push:
    branches: [phase11-m853-browser-idb-recovery]
permissions:
  contents: read
jobs:
  browser-idb-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m853-idb-browser.spec.js --workers=1
      - run: npm test
