name: Phase 11 Mission 873 Cursor Interruption Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m873-cursor-interrupt.html'
      - 'tests/phase11-m873-cursor-interrupt.spec.js'
      - '.github/workflows/phase11-m873-cursor-interrupt.yml'
  push:
    branches: [phase11-m873-cursor-resume-durability]
permissions:
  contents: read
jobs:
  chromium-cursor-interrupt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m873-cursor-interrupt.spec.js --workers=1
      - run: npm test
