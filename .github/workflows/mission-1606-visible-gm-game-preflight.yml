name: Mission 1606 Visible GM Game Preflight
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1606-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1606-visible-gm-game-preflight.yml'
  workflow_dispatch:
jobs:
  preflight-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1606-visible-gm-game-preflight.js
      - run: node hlm-phase11-m1606-visible-gm-game-preflight.test.js
  preflight-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1606-visible-gm-game-preflight.chromium.test.js
