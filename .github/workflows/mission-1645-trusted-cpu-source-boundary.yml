name: Mission 1645 Trusted CPU Source Boundary
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1645-*'
      - '.github/workflows/mission-1645-trusted-cpu-source-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trusted-source-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1645-trusted-cpu-source-boundary.test.js
