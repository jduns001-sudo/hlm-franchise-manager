name: Phase 11 Mission 926 Aborted Transaction Late Write Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m926-aborted-late-write.html'
      - 'tests/phase11-m926-aborted-late-write.spec.js'
      - '.github/workflows/phase11-m926-aborted-late-write.yml'
  push:
    branches: [phase11-m926-aborted-transaction-late-write-rejection]
permissions:
  contents: read
jobs:
  chromium-aborted-late-write:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m926-aborted-late-write.spec.js --workers=1
      - run: npm test
