name: Phase 11 Goalie Period Stats
on:
  pull_request:
    paths:
      - 'hlm-phase11-goalie-period-stats*'
      - 'hlm-phase11-shot-outcomes*'
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-persistent-season.test.js'
      - '.github/workflows/phase11-goalie-period-stats.yml'
  workflow_dispatch:
jobs:
  goalie-period:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-goalie-period-stats.test.js
      - run: node hlm-phase11-shot-outcomes.test.js
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-browser-persistent-season.test.js
