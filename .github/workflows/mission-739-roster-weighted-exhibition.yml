name: Mission 739 Roster Weighted Exhibition Tests
on:
  push:
    branches:
      - mission-739-roster-weighted-simulation-prototype
  pull_request:
    paths:
      - 'hlm-phase10-roster-weighted-exhibition.js'
      - 'hlm-phase10-roster-weighted-exhibition.test.js'
      - '.github/workflows/mission-739-roster-weighted-exhibition.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-roster-weighted-exhibition.test.js
