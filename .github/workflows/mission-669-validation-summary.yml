name: Mission 669 Validation Summary Tests
on:
  push:
    branches:
      - mission-669-readonly-validation-summary
  pull_request:
    paths:
      - 'hlm-roster-readiness-validation-summary.js'
      - 'hlm-roster-readiness-validation-summary.test.js'
      - '.github/workflows/mission-669-validation-summary.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-canonical-franchise-bridge.test.js
      - run: node hlm-classified-canonical-bridge.test.js
      - run: node hlm-simulation-roster-eligibility.test.js
      - run: node hlm-simulation-roster-readiness.test.js
      - run: node hlm-simulation-roster-readiness-pipeline.test.js
      - run: node hlm-roster-readiness-validation-summary.test.js
