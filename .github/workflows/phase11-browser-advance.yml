name: Phase 11 Browser Advance Safety
on:
  pull_request:
    paths:
      - 'hlm-phase11-browser-advance.js'
      - 'hlm-phase11-browser-advance.test.js'
      - '.github/workflows/phase11-browser-advance.yml'
  workflow_dispatch:
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-browser-advance.test.js
      - run: node hlm-phase11-browser-simulation-entry.test.js
      - run: bash scripts/build-phase11-browser-simulation.sh
      - run: node --check hlm-phase11-browser-simulation.bundle.js
