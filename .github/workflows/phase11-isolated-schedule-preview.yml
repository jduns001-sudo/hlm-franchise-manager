name: Phase 11 Isolated Schedule Preview
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-schedule-preview*'
      - 'hlm-phase11-gameplay-bridge.html'
      - 'hlm-phase10-browser.bundle.js'
      - '.github/workflows/phase11-isolated-schedule-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-isolated-schedule-preview.test.js
      - run: node hlm-phase11-gameplay-readiness.test.js
      - run: node hlm-phase11-real-roster-staging.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-isolated-schedule-preview.chromium.test.js
