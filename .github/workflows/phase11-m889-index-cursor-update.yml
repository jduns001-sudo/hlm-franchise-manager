name: Phase 11 Mission 889 Index Cursor Update Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m889-index-cursor-update.html'
      - 'tests/phase11-m889-index-cursor-update.spec.js'
      - '.github/workflows/phase11-m889-index-cursor-update.yml'
  push:
    branches: [phase11-m889-index-cursor-update-durability]
permissions:
  contents: read
jobs:
  chromium-index-cursor-update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m889-index-cursor-update.spec.js --workers=1
      - run: npm test
