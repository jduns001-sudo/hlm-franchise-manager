name: Phase 11 Safe Franchise Selection
on:
  pull_request:
    paths:
      - 'hlm-phase11-franchise-selection*'
      - 'phase11-franchise-selection.html'
      - '.github/workflows/phase11-safe-franchise-selection.yml'
  push:
    branches: [phase11-safe-import-selection-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-franchise-selection.test.js
      - run: node hlm-phase11-roster-import-browser.test.js
      - run: node hlm-phase10-roster-save-integrity.test.js
      - run: npm test
