name: Phase 11 Mobile Readonly Preview
on:
  pull_request:
    paths:
      - 'hlm-phase11-mobile-preview*'
      - 'phase11-imported-franchise-preview.html'
      - '.github/workflows/phase11-mobile-preview.yml'
  push:
    branches: [phase11-mobile-readonly-preview]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-mobile-preview.test.js
      - run: node hlm-phase11-frontoffice-readonly.test.js
      - run: node hlm-phase11-browser-activation.test.js
      - run: node hlm-phase10-roster-save-integrity.test.js
      - run: npm test
