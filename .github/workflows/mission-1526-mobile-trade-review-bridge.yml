name: Mission 1526 Mobile Trade Review Bridge
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1526-mobile-trade-review-bridge.js'
      - 'hlm-phase11-m1526-mobile-trade-review-bridge.chromium.test.js'
      - '.github/workflows/mission-1526-mobile-trade-review-bridge.yml'
  workflow_dispatch:
jobs:
  trade-review-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1526-mobile-trade-review-bridge.chromium.test.js
