name: Phase 11 GM Evidence Review Comparison
on:
  pull_request:
    paths:
      - 'hlm-phase11-gm-evidence-review-comparison*'
      - '.github/workflows/phase11-gm-evidence-review-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-evidence-export-validation.test.js
      - run: node hlm-phase11-gm-evidence-review-comparison.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-evidence-review-comparison-mobile.test.js
