name: Phase 11 Mission 869 Multi Store Atomic Commit
on:
  pull_request:
    paths:
      - 'tests/phase11-m869-atomic-commit.html'
      - 'tests/phase11-m869-atomic-commit.spec.js'
      - '.github/workflows/phase11-m869-atomic-commit.yml'
  push:
    branches: [phase11-m869-multi-store-atomic-commit]
permissions:
  contents: read
jobs:
  chromium-atomic-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m869-atomic-commit.spec.js --workers=1
      - run: npm test
