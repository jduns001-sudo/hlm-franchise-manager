name: Phase 11 Release Safety Gate
on:
  pull_request:
    paths:
      - 'PHASE11-ROSTER-ACTIVATION-READINESS.md'
      - 'hlm-phase11-release-safety.spec.js'
      - 'hlm-phase11-release-safety.config.js'
      - '.github/workflows/phase11-release-safety.yml'
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright test --config=hlm-phase11-release-safety.config.js
