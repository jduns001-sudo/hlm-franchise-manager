name: Phase 11 Mapping and Safe Commit
on:
  push:
    branches: [mission-763-phase11-mapping-and-safe-commit]
  pull_request:
    paths:
      - 'hlm-phase11-roster-mapping.js'
      - 'hlm-phase11-roster-mapping.test.js'
      - '.github/workflows/phase11-mapping-safe-commit.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-roster-import.test.js
      - run: node hlm-phase11-roster-mapping.test.js
      - run: node hlm-phase10-roster-save-integrity.test.js
