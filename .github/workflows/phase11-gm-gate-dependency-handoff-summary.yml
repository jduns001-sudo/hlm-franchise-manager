name: Phase 11 GM Gate Dependency Handoff Summary
on:
  pull_request:
    paths:
      - 'hlm-phase11-gm-gate-dependency-handoff-summary*'
      - 'hlm-phase11-gameplay-bridge.html'
      - '.github/workflows/phase11-gm-gate-dependency-handoff-summary.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-gate-dependency-handoff-summary.test.js
      - run: node hlm-phase11-gm-manual-collection-handoff.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-gate-dependency-handoff-summary.chromium.test.js
