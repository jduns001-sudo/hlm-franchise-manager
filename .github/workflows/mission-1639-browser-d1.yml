name: Mission 1639 Browser D1 Bridge
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1639-*'
      - '.github/workflows/mission-1639-browser-d1.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1639-browser-d1.test.js
  bridge-mobile:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: node hlm-phase11-m1639-browser-d1.chromium.test.js
