name: Mission 1507Y Replay Ledger Contract
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1507y-replay-ledger-contract.js'
      - 'hlm-phase11-m1507y-replay-ledger-contract.test.js'
      - '.github/workflows/mission-1507y-replay-ledger-contract.yml'
  workflow_dispatch:
jobs:
  replay-ledger-contract-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1507y-replay-ledger-contract.test.js
