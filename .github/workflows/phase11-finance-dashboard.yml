name: Phase 11 Finance Dashboard
on:
  pull_request:
    paths:
      - 'hlm-phase11-finance-dashboard.html'
      - 'hlm-phase11-finance-dashboard.test.js'
      - '.github/workflows/phase11-finance-dashboard.yml'
  workflow_dispatch:
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-finance-dashboard.test.js
      - run: node hlm-phase11-finance-integration.test.js
