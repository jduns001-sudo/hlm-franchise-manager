name: Mission 756 Experimental Score Report
on:
  push:
    branches:
      - mission-756-experimental-score-report-v2
  pull_request:
    paths:
      - 'hlm-phase10-experimental-score-report.js'
      - 'hlm-phase10-experimental-score-report.test.js'
      - 'docs/MISSION_756_EXPERIMENTAL_SCORE_SUMMARY_PLAN.md'
      - '.github/workflows/mission-756-score-report.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-score-report.test.js
