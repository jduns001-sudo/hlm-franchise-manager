name: Mission 1584 Championship Next Season Handoff
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1584-*'
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-m1573-active-season-trade-planning.chromium.test.js'
      - '.github/workflows/mission-1584-championship-next-season-handoff.yml'
  workflow_dispatch:
jobs:
  championship-handoff-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1584-championship-next-season-handoff.js
      - run: node --check hlm-phase11-m1584-championship-next-season-handoff-panel.js
      - run: node hlm-phase11-m1584-championship-next-season-handoff.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  championship-handoff-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1573-active-season-trade-planning.chromium.test.js
