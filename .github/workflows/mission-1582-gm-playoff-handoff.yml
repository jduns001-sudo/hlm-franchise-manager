name: Mission 1582 GM Playoff Handoff
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1582-*'
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-m1573-active-season-trade-planning.chromium.test.js'
      - '.github/workflows/mission-1582-gm-playoff-handoff.yml'
  workflow_dispatch:
jobs:
  playoff-handoff-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1582-playoff-review-handoff.js
      - run: node --check hlm-phase11-m1582-playoff-review-handoff-panel.js
      - run: node hlm-phase11-m1582-playoff-review-handoff.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  playoff-handoff-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1573-active-season-trade-planning.chromium.test.js
