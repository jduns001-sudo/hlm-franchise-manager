name: Mission 1538 Roster Limit Approval
on:
  pull_request:
  workflow_dispatch:
jobs:
  roster-limit-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1538-roster-limit-approval.chromium.test.js
