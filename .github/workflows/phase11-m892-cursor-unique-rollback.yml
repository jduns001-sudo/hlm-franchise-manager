name: Phase 11 Mission 892 Cursor Unique Rollback Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m892-cursor-unique-rollback.html'
      - 'tests/phase11-m892-cursor-unique-rollback.spec.js'
      - '.github/workflows/phase11-m892-cursor-unique-rollback.yml'
  push:
    branches: [phase11-m892-index-cursor-unique-constraint-rollback]
permissions:
  contents: read
jobs:
  chromium-cursor-unique-rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m892-cursor-unique-rollback.spec.js --workers=1
      - run: npm test
