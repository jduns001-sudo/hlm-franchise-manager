name: Phase 11 Mobile Activation Safety Chromium
on:
  pull_request:
    paths:
      - 'hlm-phase11-mobile-activation-safety.js'
      - 'hlm-phase11-mobile-activation-safety.spec.js'
      - 'hlm-phase11-mobile-activation-safety.config.js'
      - 'phase11-import-workbench.html'
      - '.github/workflows/phase11-mobile-activation-safety.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-mobile-activation-safety.config.js
      - run: npx playwright test --config=hlm-phase11-import-workbench.config.js
      - run: npx playwright test --config=hlm-phase11-real-frontoffice-roster.config.js
