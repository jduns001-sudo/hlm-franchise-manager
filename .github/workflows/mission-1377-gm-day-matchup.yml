name: Mission 1377 GM Day Matchup Review
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-single-game.js'
      - 'hlm-phase11-isolated-single-game.html'
      - 'hlm-phase11-gm-day-matchup.test.js'
      - 'hlm-phase11-gm-day-matchup.chromium.test.js'
      - '.github/workflows/mission-1377-gm-day-matchup.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-day-matchup.test.js
      - run: node hlm-phase11-persisted-day-journey.test.js
      - run: node hlm-phase11-isolated-single-game.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-day-matchup.chromium.test.js
      - run: node hlm-phase11-persisted-day-journey.chromium.test.js
