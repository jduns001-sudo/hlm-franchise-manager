name: Phase 11 Mission 896 Invalid Cursor Jump Recovery Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m896-invalid-cursor-jump.html'
      - 'tests/phase11-m896-invalid-cursor-jump.spec.js'
      - '.github/workflows/phase11-m896-invalid-cursor-jump.yml'
  push:
    branches: [phase11-m896-cursor-invalid-jump-recovery-durability]
permissions:
  contents: read
jobs:
  chromium-invalid-cursor-jump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m896-invalid-cursor-jump.spec.js --workers=1
      - run: npm test
