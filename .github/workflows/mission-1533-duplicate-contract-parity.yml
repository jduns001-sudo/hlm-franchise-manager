name: Mission 1533 Duplicate Contract Parity
on:
  pull_request:
  workflow_dispatch:
jobs:
  duplicate-contract-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1533-duplicate-contract-parity.chromium.test.js
