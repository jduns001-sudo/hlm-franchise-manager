name: Mission 1507T Browser CPU Decision Parity
on:
  push:
    branches:
      - experiment/phase11-m1507t-browser-cpu-engine
  pull_request:
    paths:
      - 'hlm-phase11-m1507t-browser-cpu-engine.js'
      - 'hlm-phase11-m1507m-mobile-trade-review.html'
      - 'hlm-phase11-m1507n-mobile-trade.chromium.test.js'
      - '.github/workflows/mission-1507t-browser-cpu-decision.yml'
jobs:
  browser-cpu-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node --test hlm-phase11-m1507q-cpu-decision-engine.test.js
      - run: node hlm-phase11-m1507n-mobile-trade.chromium.test.js
