name: Phase 11 Browser Finance
on:
  pull_request:
    paths:
      - 'hlm-phase11-real-finance.html'
      - 'hlm-phase11-browser-finance.js'
      - 'hlm-phase11-browser-finance.test.js'
      - '.github/workflows/phase11-browser-finance.yml'
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-browser-finance.test.js
      - run: node hlm-phase11-finance-session.test.js
