name: Mission 1393 Offseason Management
on:
  pull_request:
    paths:
      - 'hlm-phase10-free-agent-signing.js'
      - 'hlm-phase11-reviewed-offseason.test.js'
      - 'hlm-phase11-deployed-offseason-management.chromium.test.js'
      - '.github/workflows/mission-1393-offseason-management.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-reviewed-offseason.test.js
      - run: node hlm-phase10-complete-offseason.test.js
  deployed-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-deployed-offseason-management.chromium.test.js
