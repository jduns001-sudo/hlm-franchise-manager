name: Mission 1573 Active Season Trade Planning
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1573-*'
      - 'hlm-phase11-isolated-single-game*'
      - 'hlm-phase11-new-franchise*'
      - '.github/workflows/mission-1573-active-season-trade-planning.yml'
  workflow_dispatch:
jobs:
  season-trade-source-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1573-season-trade-source.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  season-trade-planning-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1573-active-season-trade-planning.chromium.test.js
