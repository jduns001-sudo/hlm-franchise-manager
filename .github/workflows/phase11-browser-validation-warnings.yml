name: Phase 11 Browser Validation Warnings
on:
  pull_request:
    paths:
      - 'hlm-phase11-roster-validation.js'
      - 'hlm-phase11-mobile-preview*'
      - 'phase11-imported-franchise-preview.html'
      - '.github/workflows/phase11-browser-validation-warnings.yml'
  push:
    branches: [phase11-browser-validation-warnings]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-browser-validation.test.js
      - run: node hlm-phase11-roster-validation.test.js
      - run: node hlm-phase11-mobile-preview.test.js
      - run: node hlm-phase11-mobile-preview-acceptance.test.js
      - run: node hlm-phase10-roster-save-integrity.test.js
      - run: npm test
