name: Phase 11 Mission 911 Cross Connection Commit Isolation Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m911-cross-connection.html'
      - 'tests/phase11-m911-cross-connection.spec.js'
      - '.github/workflows/phase11-m911-cross-connection.yml'
  push:
    branches: [phase11-m911-cross-connection-commit-isolation]
permissions:
  contents: read
jobs:
  chromium-cross-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m911-cross-connection.spec.js --workers=1
      - run: npm test
