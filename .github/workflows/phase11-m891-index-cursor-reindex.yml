name: Phase 11 Mission 891 Index Cursor Reindex Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m891-index-cursor-reindex.html'
      - 'tests/phase11-m891-index-cursor-reindex.spec.js'
      - '.github/workflows/phase11-m891-index-cursor-reindex.yml'
  push:
    branches: [phase11-m891-index-cursor-update-reindex-durability]
permissions:
  contents: read
jobs:
  chromium-index-cursor-reindex:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m891-index-cursor-reindex.spec.js --workers=1
      - run: npm test
