name: Phase 11 Mission 911 Queued Writer Serialization Durability
on:
  pull_request:
    paths:
      - 'tests/phase11-m911-queued-writers.html'
      - 'tests/phase11-m911-queued-writers.spec.js'
      - '.github/workflows/phase11-m911-queued-writers.yml'
  push:
    branches: [phase11-m911-queued-writer-serialization]
permissions:
  contents: read
jobs:
  chromium-queued-writers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m911-queued-writers.spec.js --workers=1
      - run: npm test
