name: Mission 739 Experimental Rating Preview Tests
on:
  push:
    branches:
      - mission-739-experimental-score-preview
  pull_request:
    paths:
      - 'hlm-phase10-experimental-score-preview.js'
      - 'hlm-phase10-experimental-score-preview.test.js'
      - 'docs/MISSION_739_EXPERIMENTAL_PREVIEW.md'
      - '.github/workflows/mission-739-experimental-preview.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-score-preview.test.js
