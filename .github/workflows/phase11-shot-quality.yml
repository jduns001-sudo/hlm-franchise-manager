name: Phase 11 Shot Quality
on:
  pull_request:
    paths:
      - 'hlm-phase11-shot-quality*'
      - 'hlm-phase11-shift-shot-events*'
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-persistent-season.test.js'
      - '.github/workflows/phase11-shot-quality.yml'
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-shot-quality.test.js
      - run: node hlm-phase11-shot-calibration.test.js
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-browser-persistent-season.test.js
