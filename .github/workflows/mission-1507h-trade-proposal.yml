name: Mission 1507H Pure Trade Proposal
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1507h-trade-proposal*'
      - '.github/workflows/mission-1507h-trade-proposal.yml'
jobs:
  trade-proposal-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1507h-trade-proposal.test.js
