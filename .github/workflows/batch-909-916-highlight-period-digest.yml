name: Batch 909-916 Experimental Highlight Period Digest
on:
  push:
    branches:
      - batch-909-916-experimental-highlight-period-digest
  pull_request:
    paths:
      - 'hlm-experimental-highlight-period-digest.js'
      - 'hlm-experimental-highlight-period-digest.test.js'
      - 'docs/BATCH_909_916_EXPERIMENTAL_HIGHLIGHT_PERIOD_DIGEST.md'
      - '.github/workflows/batch-909-916-highlight-period-digest.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-experimental-highlight-period-digest.test.js
