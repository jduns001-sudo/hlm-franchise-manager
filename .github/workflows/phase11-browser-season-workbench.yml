name: Phase 11 Browser Season Workbench
on:
  pull_request:
    paths:
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-season-workbench.bundle.js'
      - 'hlm-phase11-browser-season-workbench.test.js'
      - '.github/workflows/phase11-browser-season-workbench.yml'
  workflow_dispatch:
jobs:
  browser-season:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Integrated two-day gameplay regression
        run: node hlm-phase11-real-roster-multiday-preview.test.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Real browser season preview and production save isolation
        run: node hlm-phase11-browser-season-workbench.test.js
