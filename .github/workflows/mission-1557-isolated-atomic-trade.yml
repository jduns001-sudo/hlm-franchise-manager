name: Mission 1557 Isolated Atomic Trade
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1557-*'
      - '.github/workflows/mission-1557-isolated-atomic-trade.yml'
  workflow_dispatch:
jobs:
  atomic-trade-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1557-isolated-atomic-trade.test.js
  atomic-trade-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1557-isolated-atomic-trade.chromium.test.js
