name: Mission 1618 Real Two-Tab Guarded CPU Fixture
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1618-*'
      - '.github/workflows/mission-1618-real-two-tab-guarded-fixture.yml'
  workflow_dispatch:
jobs:
  guarded-two-tab-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1618-real-two-tab-guarded-fixture.chromium.test.js
