name: Phase 11 Career Goal Reconciliation
on:
  pull_request:
    paths:
      - 'hlm-phase11-real-roster-season-preview*'
      - '.github/workflows/phase11-career-goal-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-career-goals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-real-roster-season-preview.test.js
      - run: node hlm-phase10-roster-day-with-stats.test.js
      - run: node hlm-phase10-experimental-player-goals.test.js
  mobile-career-goals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-real-roster-season-preview.chromium.test.js
