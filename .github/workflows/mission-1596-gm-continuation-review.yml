name: Mission 1596 GM Continuation Review
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1596-*'
      - '.github/workflows/mission-1596-gm-continuation-review.yml'
  workflow_dispatch:
jobs:
  continuation-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1596-gm-continuation-review.js
      - run: node hlm-phase11-m1596-gm-continuation-review.test.js
  continuation-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1596-gm-continuation-review.chromium.test.js
