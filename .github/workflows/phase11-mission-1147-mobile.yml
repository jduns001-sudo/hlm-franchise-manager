name: Phase 11 Mission 1147 Mobile Chromium
on:
  pull_request:
    paths:
      - 'hlm-player-performance-comparison-insights*'
      - '.github/workflows/phase11-mission-1147-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-player-performance-comparison-insights-mobile.test.js
