name: Batch 813-820 Experimental Special Teams
on:
  push:
    branches:
      - batch-813-820-experimental-special-teams
  pull_request:
    paths:
      - 'hlm-experimental-special-teams.js'
      - 'hlm-experimental-special-teams.test.js'
      - 'docs/BATCH_813_820_EXPERIMENTAL_SPECIAL_TEAMS.md'
      - '.github/workflows/batch-813-820-special-teams.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-experimental-special-teams.test.js
