name: Mission 755 Experimental Frequency Consistency
on:
  push:
    branches:
      - mission-755-experimental-frequency-consistency-v2
  pull_request:
    paths:
      - 'hlm-phase10-experimental-frequency-consistency.js'
      - 'hlm-phase10-experimental-frequency-consistency.test.js'
      - 'docs/MISSION_755_EXPERIMENTAL_FREQUENCY_CONSISTENCY_PLAN.md'
      - '.github/workflows/mission-755-frequency-consistency.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-frequency-consistency.test.js
