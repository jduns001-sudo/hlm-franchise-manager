name: Phase 11 Goal Timeline
on:
  pull_request:
    paths:
      - 'hlm-phase11-goal-timeline*'
      - 'hlm-phase11-team-game-shots*'
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-persistent-season.test.js'
      - '.github/workflows/phase11-goal-timeline.yml'
  workflow_dispatch:
jobs:
  goal-timeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-goal-timeline.test.js
      - run: node hlm-phase11-team-game-shots.test.js
      - run: npm install --no-save --no-package-lock playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-browser-persistent-season.test.js
