name: Phase 11 Playable Loop Readiness
on:
  pull_request:
    paths:
      - 'hlm-phase11-playable-loop-readiness*'
      - '.github/workflows/phase11-playable-loop-readiness.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-integrated-season-readiness.test.js
      - run: node hlm-phase11-playable-loop-readiness.test.js
