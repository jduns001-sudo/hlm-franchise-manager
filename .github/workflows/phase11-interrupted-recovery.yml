name: Phase 11 Interrupted Recovery Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-interrupted-recovery.js'
      - 'hlm-phase11-interrupted-recovery.spec.js'
      - 'hlm-phase11-interrupted-recovery.config.js'
      - '.github/workflows/phase11-interrupted-recovery.yml'
  push:
    branches: [phase11-interrupted-activation-recovery]
permissions:
  contents: read
jobs:
  chromium-recovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-interrupted-recovery.config.js
      - run: node hlm-phase11-durable-file-verify.test.js
      - run: npm test
