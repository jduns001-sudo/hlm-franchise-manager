name: Mission 1390 Playoff Championship Acceptance
on:
  pull_request:
    paths:
      - 'hlm-phase11-deployed-playoff-championship.chromium.test.js'
      - '.github/workflows/mission-1390-playoff-championship.yml'
  workflow_dispatch:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-new-franchise.test.js
  deployed-mobile-chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-deployed-playoff-championship.chromium.test.js
