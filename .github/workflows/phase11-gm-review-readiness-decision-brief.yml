name: Phase 11 GM Review Readiness Decision Brief
on:
  pull_request:
    paths:
      - 'hlm-phase11-gm-review-readiness-decision-brief*'
      - '.github/workflows/phase11-gm-review-readiness-decision-brief.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-gm-review-risk-brief-readiness.test.js
      - run: node hlm-phase11-gm-review-readiness-decision-brief.test.js
  mobile-chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-gm-review-readiness-decision-brief-mobile.test.js
