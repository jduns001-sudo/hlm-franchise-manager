name: Phase 11 Mission 863 Process Termination
on:
  pull_request:
    paths:
      - 'tests/phase11-m863-process-termination.html'
      - 'tests/phase11-m863-process-termination.spec.js'
      - 'tests/phase11-m863-process-termination.worker.js'
      - '.github/workflows/phase11-m863-process-termination.yml'
  push:
    branches: [phase11-m863-process-termination]
permissions:
  contents: read
jobs:
  chromium-process-termination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/phase11-m863-process-termination.spec.js --workers=1
      - run: npm test
