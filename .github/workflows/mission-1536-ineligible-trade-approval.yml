name: Mission 1536 Ineligible Trade Approval Guard
on:
  pull_request:
  workflow_dispatch:
jobs:
  ineligible-approval-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1536-ineligible-trade-approval.chromium.test.js
