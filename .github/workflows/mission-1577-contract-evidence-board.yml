name: Mission 1577 Saved-Season Contract Evidence Board
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1577-*'
      - 'hlm-phase11-m1573-active-season-trade-planning.chromium.test.js'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1577-contract-evidence-board.yml'
  workflow_dispatch:
jobs:
  contract-evidence-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1577-contract-evidence-board.js
      - run: node --check hlm-phase11-m1577-contract-evidence-board-panel.js
      - run: node hlm-phase11-m1577-contract-evidence-board.test.js
      - run: node hlm-phase11-m1576-contract-provenance-readiness.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  contract-evidence-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1573-active-season-trade-planning.chromium.test.js
