name: Mission 1594 GM Final Review
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1594-*'
      - '.github/workflows/mission-1594-gm-final-review.yml'
  workflow_dispatch:
jobs:
  gm-final-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1594-gm-final-review.js
      - run: node hlm-phase11-m1594-gm-final-review.test.js
  gm-final-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1594-gm-final-review.chromium.test.js
