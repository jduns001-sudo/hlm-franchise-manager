name: Phase 11 Cutover Preflight
on:
  pull_request:
    paths:
      - 'hlm-phase11-cutover-preflight.js'
      - 'hlm-phase11-cutover-preflight.test.js'
      - '.github/workflows/phase11-cutover-preflight.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-cutover-preflight.test.js
      - run: node hlm-phase11-roster-import.test.js
      - run: node hlm-phase11-imported-roster-view.test.js
