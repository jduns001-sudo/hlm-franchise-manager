name: Mission 1614 Guarded GM Game-Day Review Bridge
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1614-*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1614-gm-game-day-review-bridge.yml'
  workflow_dispatch:
jobs:
  gm-review-bridge-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1614-gm-game-day-review-bridge.js
      - run: node hlm-phase11-m1614-gm-game-day-review-bridge.test.js
  gm-review-bridge-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1614-gm-game-day-review-bridge.chromium.test.js
