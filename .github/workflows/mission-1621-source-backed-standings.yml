name: Mission 1621 Source-Backed Standings
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1621-source-backed-standings.js'
      - 'hlm-phase11-m1621-source-backed-standings.test.js'
      - 'hlm-phase11-m1621-standings-panel.js'
      - 'hlm-phase11-m1621-standings-panel.chromium.test.js'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1621-source-backed-standings.yml'
  workflow_dispatch:
jobs:
  source-backed-standings-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1621-source-backed-standings.test.js
  source-backed-standings-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1621-standings-panel.chromium.test.js
