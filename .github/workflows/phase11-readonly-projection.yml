name: Phase 11 Readonly Front Office Projection
on:
  pull_request:
    paths:
      - 'hlm-phase11-frontoffice-readonly*'
      - '.github/workflows/phase11-readonly-projection.yml'
  push:
    branches: [phase11-readonly-frontoffice-projection]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-frontoffice-readonly.test.js
      - run: node hlm-phase11-browser-activation.test.js
      - run: node hlm-phase10-roster-save-integrity.test.js
      - run: npm test
