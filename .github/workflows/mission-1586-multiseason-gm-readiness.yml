name: Mission 1586 Multi-Season GM Readiness
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1586-*'
      - '.github/workflows/mission-1586-multiseason-gm-readiness.yml'
  workflow_dispatch:
jobs:
  gm-readiness-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check hlm-phase11-m1586-multiseason-gm-readiness.js
      - run: node hlm-phase11-m1586-multiseason-gm-readiness.test.js
      - run: node hlm-phase11-m1585-multiseason-continuation.test.js
      - run: node hlm-phase11-real-universe-journey.test.js
  gm-readiness-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1586-multiseason-gm-readiness.chromium.test.js
