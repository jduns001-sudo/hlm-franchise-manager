name: Phase 11 Pages Byte Fingerprint
on:
  pull_request:
    paths:
      - '.github/workflows/phase11-pages-fingerprint.yml'
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout immutable main commit
        uses: actions/checkout@v4
        with:
          ref: 12654fb5a29ad5f5766e0401dcbbf7fe734598ba
          persist-credentials: false
      - name: Compare published app.html with committed bytes
        shell: bash
        run: |
          set -euo pipefail
          test -s app.html
          expected="$(sha256sum app.html | awk '{print $1}')"
          echo "Main app.html SHA-256: $expected"
          url="https://jduns001-sudo.github.io/hlm-franchise-manager/app.html?fingerprint=${GITHUB_RUN_ID}"
          curl --fail --location --silent --show-error --retry 3 --retry-delay 3 --connect-timeout 15 --max-time 90 --header 'Cache-Control: no-cache' "$url" --output /tmp/phase11-published-app.html
          test -s /tmp/phase11-published-app.html
          actual="$(sha256sum /tmp/phase11-published-app.html | awk '{print $1}')"
          echo "Published app.html SHA-256: $actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error::Published app.html differs from immutable main app.html"
            exit 1
          fi
          echo "PASS: Published app.html byte-identical to immutable main commit"
