name: Phase 11 Player Performance Comparison Insights
on:
  pull_request:
    paths:
      - 'hlm-phase11-player-performance-comparison-insights*'
      - '.github/workflows/phase11-player-performance-comparison-insights.yml'
  workflow_dispatch:
jobs:
  comparison-insights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-player-performance-comparison-insights.test.js
      - run: node hlm-phase11-performance-history-comparisons.test.js
      - run: node hlm-phase11-performance-history-insights.test.js
