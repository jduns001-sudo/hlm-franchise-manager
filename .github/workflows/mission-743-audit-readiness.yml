name: Mission 743 Experimental Audit Readiness
on:
  push:
    branches:
      - mission-743-experimental-audit-readiness-v2
  pull_request:
    paths:
      - 'hlm-phase10-experimental-audit-readiness.js'
      - 'hlm-phase10-experimental-audit-readiness.test.js'
      - 'docs/MISSION_743_EXPERIMENTAL_AUDIT_READINESS_PLAN.md'
      - '.github/workflows/mission-743-audit-readiness.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-audit-readiness.test.js
