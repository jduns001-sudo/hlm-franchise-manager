name: Mission 744 Experimental Readiness Summary
on:
  push:
    branches:
      - mission-744-experimental-readiness-summary
  pull_request:
    paths:
      - 'hlm-phase10-experimental-readiness-summary.js'
      - 'hlm-phase10-experimental-readiness-summary.test.js'
      - 'docs/MISSION_744_EXPERIMENTAL_READINESS_SUMMARY.md'
      - '.github/workflows/mission-744-readiness-summary.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase10-experimental-readiness-summary.test.js
