name: Mission 690 Priority Drift Contract Tests
on:
  push:
    branches:
      - mission-690-priority-drift-contract
  pull_request:
    paths:
      - 'hlm-diagnostic-triage-priority-drift-contract.test.js'
      - 'docs/MISSION_690_PRIORITY_DRIFT_CONTRACT.md'
      - '.github/workflows/mission-690-priority-drift-contract.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-canonical-franchise-bridge.test.js
      - run: node hlm-classified-canonical-bridge.test.js
      - run: node hlm-simulation-roster-eligibility.test.js
      - run: node hlm-simulation-roster-readiness.test.js
      - run: node hlm-simulation-roster-readiness-pipeline.test.js
      - run: node hlm-roster-readiness-validation-summary.test.js
      - run: node hlm-franchise-data-health-report.test.js
      - run: node hlm-franchise-data-health-contract.test.js
      - run: node hlm-franchise-diagnostic-fixtures.test.js
      - run: node hlm-franchise-diagnostic-regression-matrix.test.js
      - run: node hlm-franchise-diagnostic-baseline-v1.test.js
      - run: node hlm-franchise-diagnostic-drift-report.test.js
      - run: node hlm-diagnostic-drift-severity.test.js
      - run: node hlm-diagnostic-triage-summary.test.js
      - run: node hlm-diagnostic-triage-contract.test.js
      - run: node hlm-diagnostic-triage-fixture-matrix.test.js
      - run: node hlm-diagnostic-triage-baseline-v1.test.js
      - run: node hlm-diagnostic-triage-drift-report.test.js
      - run: node hlm-diagnostic-triage-drift-severity.test.js
      - run: node hlm-diagnostic-triage-priority-summary.test.js
      - run: node hlm-diagnostic-triage-priority-contract.test.js
      - run: node hlm-diagnostic-triage-priority-fixture-matrix.test.js
      - run: node hlm-diagnostic-triage-priority-baseline-v1.test.js
      - run: node hlm-diagnostic-triage-priority-drift-report.test.js
      - run: node hlm-diagnostic-triage-priority-drift-severity.test.js
      - run: node hlm-diagnostic-triage-priority-drift-summary.test.js
      - run: node hlm-diagnostic-triage-priority-drift-contract.test.js
