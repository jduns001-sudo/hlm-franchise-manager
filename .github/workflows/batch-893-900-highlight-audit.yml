name: Batch 893-900 Experimental Highlight Audit
on:
  push:
    branches:
      - batch-893-900-experimental-highlight-audit
  pull_request:
    paths:
      - 'hlm-experimental-highlight-audit.js'
      - 'hlm-experimental-highlight-audit.test.js'
      - 'docs/BATCH_893_900_EXPERIMENTAL_HIGHLIGHT_AUDIT.md'
      - '.github/workflows/batch-893-900-highlight-audit.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-experimental-highlight-audit.test.js
