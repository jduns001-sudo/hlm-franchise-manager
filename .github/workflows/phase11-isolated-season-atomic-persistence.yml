name: Phase 11 Isolated Season Atomic Persistence
on:
  pull_request:
    paths:
      - 'hlm-phase11-isolated-season-atomic-store.js'
      - 'hlm-phase11-isolated-season-atomic-store.test.js'
      - '.github/workflows/phase11-isolated-season-atomic-persistence.yml'
  workflow_dispatch:
jobs:
  atomic-season:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Isolated atomic save, rollback, stale-write and recovery regression
        run: node hlm-phase11-isolated-season-atomic-store.test.js
      - name: Real-roster two-day simulation regression
        run: node hlm-phase11-real-roster-multiday-preview.test.js
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Mobile browser game scores and save isolation
        run: node hlm-phase11-browser-season-workbench.test.js
