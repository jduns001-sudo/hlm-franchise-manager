name: Mission 1610 Consolidated DOM Integrity
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1610-dom-integrity*'
      - 'hlm-phase11-isolated-single-game.html'
      - '.github/workflows/mission-1610-dom-integrity.yml'
  workflow_dispatch:
jobs:
  dom-integrity-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-m1610-dom-integrity.test.js
  dom-integrity-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1610-dom-integrity.chromium.test.js
