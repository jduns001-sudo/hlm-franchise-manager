name: Phase 11 Playable Roster Reload Chromium
on:
  pull_request:
    paths:
      - 'hlm-phase11-playable-roster-proof.js'
      - 'hlm-phase11-playable-roster-proof.spec.js'
      - 'hlm-phase11-playable-roster-proof.config.js'
      - '.github/workflows/phase11-playable-roster-proof.yml'
jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=hlm-phase11-playable-roster-proof.config.js
      - run: npx playwright test --config=hlm-phase11-final-roster-gate.config.js
