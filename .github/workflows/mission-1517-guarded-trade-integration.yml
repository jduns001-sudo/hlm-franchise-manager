name: Mission 1517 Guarded Trade Integration
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1517-guarded-trade-integration.js'
      - 'hlm-phase11-m1517-guarded-trade-integration.test.js'
      - '.github/workflows/mission-1517-guarded-trade-integration.yml'
  workflow_dispatch:
jobs:
  guarded-trade-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test hlm-phase11-m1517-guarded-trade-integration.test.js
