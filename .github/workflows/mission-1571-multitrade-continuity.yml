name: Mission 1571 Consecutive Trade Continuity
on:
  pull_request:
    paths:
      - 'hlm-phase11-m1571-*'
      - 'hlm-phase11-m1570-*'
      - 'hlm-phase11-m1562-*'
      - 'hlm-phase11-m1566-*'
      - 'hlm-phase11-m1567-*'
      - 'hlm-phase11-m1568-*'
      - 'hlm-phase11-m1524-*'
      - '.github/workflows/mission-1571-multitrade-continuity.yml'
  workflow_dispatch:
jobs:
  consecutive-trades-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save fake-indexeddb
      - run: node hlm-phase11-m1571-multitrade-continuity.test.js
      - run: node hlm-phase11-m1570-persisted-trade-history.test.js
      - run: node hlm-phase11-m1566-persisted-trade-review-host.test.js
  consecutive-trades-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-m1567-build-trade-browser.js --check
      - run: node hlm-phase11-m1571-multitrade-continuity.chromium.test.js
