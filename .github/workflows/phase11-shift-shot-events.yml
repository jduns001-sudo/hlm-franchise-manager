name: Phase 11 Shift Shot Events
on:
  pull_request:
    paths:
      - 'hlm-phase11-shift-shot-events*'
      - 'hlm-phase11-shift-rotation*'
      - 'hlm-phase11-browser-season-workbench.html'
      - 'hlm-phase11-browser-persistent-season.test.js'
      - '.github/workflows/phase11-shift-shot-events.yml'
  workflow_dispatch:
jobs:
  shot-events:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-phase11-shift-shot-events.test.js
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node hlm-phase11-browser-persistent-season.test.js
