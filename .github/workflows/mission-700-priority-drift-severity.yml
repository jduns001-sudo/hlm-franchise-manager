name: Mission 700 Priority Baseline Drift Severity Tests
on:
  push:
    branches: [mission-700-priority-drift-severity]
  pull_request:
    paths:
      - 'hlm-diagnostic-triage-priority-drift-summary-comparison-priority-drift-severity.js'
      - 'hlm-diagnostic-triage-priority-drift-summary-comparison-priority-drift-severity.test.js'
      - 'docs/MISSION_700_PRIORITY_DRIFT_SEVERITY.md'
      - '.github/workflows/mission-700-priority-drift-severity.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node hlm-diagnostic-triage-priority-drift-summary-comparison-priority-drift-report.test.js
      - run: node hlm-diagnostic-triage-priority-drift-summary-comparison-priority-drift-severity.test.js
