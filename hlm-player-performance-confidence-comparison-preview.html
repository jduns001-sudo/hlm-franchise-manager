<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confidence comparison explorer</title><style>body{margin:0;padding:16px;background:#0f172a;color:#f8fafc;font:16px system-ui}main{max-width:720px;margin:auto}section{background:#1e293b;border-radius:12px;padding:14px;margin:12px 0}label{display:block;margin:10px 0}fieldset{border:1px solid #64748b;border-radius:8px}meter{width:100%}small{color:#cbd5e1}.item{padding:8px 0;border-bottom:1px solid #475569}select{width:100%;padding:10px;font:inherit}</style></head><body><main><h1>Confidence-aware comparisons</h1><small>Experimental synthetic history only. No save access or GM actions.</small><section><fieldset><legend>Select seasons</legend><label><input type="checkbox" value="2027" checked> 2027</label><label><input type="checkbox" value="2028" checked> 2028</label><label><input type="checkbox" value="2029" checked> 2029</label></fieldset><label for="metric">Comparison metric</label><select id="metric"><option value="finishing">Finishing rate</option><option value="consistency">Consistency</option></select></section><section><h2>Player vs Team</h2><div id="chart" aria-live="polite"></div><p id="context"></p></section></main><script>const data=[{year:2027,games:3,finishing:[.12,.1],consistency:[.7,.65]},{year:2028,games:10,finishing:[.17,.15],consistency:[.8,.75]},{year:2029,games:30,finishing:[.2,.18],consistency:[.85,.8]}];function render(){const years=new Set([...document.querySelectorAll('input:checked')].map(x=>Number(x.value))),metric=document.querySelector('#metric').value,root=document.querySelector('#chart');root.replaceChildren();for(const r of data.filter(x=>years.has(x.year))){const item=document.createElement('div');item.className='item';const title=document.createElement('strong');title.textContent=r.year+' · '+r.games+' games · '+(r.games>=20?'established':r.games>=5?'developing':'limited')+' sample';item.append(title);for(const [i,name] of ['Player','Team'].entries()){const label=document.createElement('div');label.textContent=name+' '+metric+': '+r[metric][i];const meter=document.createElement('meter');meter.min=0;meter.max=1;meter.value=r[metric][i];meter.setAttribute('aria-label',name+' '+metric);item.append(label,meter)}root.append(item)}document.querySelector('#context').textContent=years.size?'Confidence-aware descriptive comparison only. Human GM retains all decisions.':'No seasons selected. Select at least one season.';}document.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',render));render();</script></body></html>
