<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental GM Evidence Readiness</title><style>body{font:16px system-ui;max-width:40rem;margin:auto;padding:1rem}main{box-sizing:border-box;width:100%}button{min-height:48px;padding:.75rem}p{overflow-wrap:anywhere}</style><main><h1>Experimental GM evidence readiness</h1><p>Simulated evidence. Production activation disabled. Human GM controls every decision.</p><button id="review" aria-pressed="false">Complete manual review</button><p id="result" aria-live="polite">Evidence gaps require caution. No gameplay action authorized.</p></main><script>document.querySelector('#review').addEventListener('click',e=>{const done=e.currentTarget.getAttribute('aria-pressed')==='true';e.currentTarget.setAttribute('aria-pressed',String(!done));document.querySelector('#result').textContent=done?'Evidence gaps require caution. No gameplay action authorized.':'Review complete locally. Evidence gaps remain. No gameplay action authorized.'});</script></html>
