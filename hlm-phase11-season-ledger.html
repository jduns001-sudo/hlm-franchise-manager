<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental Season Ledger</title><style>body{font:16px system-ui;background:#102035;color:#fff;padding:16px;max-width:700px;margin:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px 5px;text-align:left;border-bottom:1px solid #68788c}main{overflow-x:auto}button{min-height:44px;width:100%;font:inherit}</style></head><body><h1>Experimental season standings</h1><p>Read-only demonstration. No production save access or activation.</p><button id="review">Review sample standings</button><main><table aria-label="Season standings"><thead><tr><th>Team</th><th>GP</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th></tr></thead><tbody id="rows"></tbody></table></main><p id="status" aria-live="polite">No games simulated.</p><script src="./hlm-phase11-season-ledger.js"></script><script>document.getElementById('review').addEventListener('click',()=>{const state={meta:{controlledTeamId:1},universe:{teams:[{id:1,name:'Home'},{id:2,name:'Visitors'}],players:[]},activity:{games:[{id:'demo',homeTeamId:1,awayTeamId:2,status:'final',homeGoals:3,awayGoals:2,overtime:true}]}};const rows=document.getElementById('rows');rows.replaceChildren();for(const t of HLMSeasonLedger.standings(state)){const tr=document.createElement('tr');for(const v of [t.name,t.gp,t.w,t.l,t.otl,t.pts]){const td=document.createElement('td');td.textContent=String(v);tr.append(td)}rows.append(tr)}document.getElementById('status').textContent='Standings reviewed. No save changes.'});</script></body></html>
