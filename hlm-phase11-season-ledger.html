<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental Season Ledger</title><style>body{font:16px system-ui;background:#102035;color:#fff;padding:16px;max-width:700px;margin:auto}table{border-collapse:collapse;width:100%}td,th{padding:9px 5px;text-align:left;border-bottom:1px solid #68788c}main{overflow-x:auto}button{min-height:44px;width:100%;font:inherit}</style></head><body><h1>Experimental season standings</h1><p>Read-only demonstration. No production save access or activation.</p><button id="review">Review sample standings</button><main><table aria-label="Season standings"><thead><tr><th>Team</th><th>GP</th><th>W</th><th>L</th><th>OTL</th><th>PTS</th></tr></thead><tbody id="rows"></tbody></table></main><p id="status" aria-live="polite">No games simulated.</p><section aria-label="Isolated season demo"><h2>Human-approved two-day season demo</h2><button id="start-season">Start isolated sample</button><button id="advance-season" disabled>Approve next game day</button><p id="season-status" aria-live="polite">No isolated season started.</p></section><script src="./hlm-phase11-season-ledger.js"></script><script src="./hlm-phase11-isolated-day-stage.js"></script><script src="./hlm-phase10-game-simulator-browser.js"></script><script src="./hlm-phase11-season-ledger-session.js"></script><script>document.getElementById('review').addEventListener('click',()=>{const state={meta:{controlledTeamId:1},universe:{teams:[{id:1,name:'Home'},{id:2,name:'Visitors'}],players:[]},activity:{games:[{id:'demo',homeTeamId:1,awayTeamId:2,status:'final',homeGoals:3,awayGoals:2,overtime:true}]}};const rows=document.getElementById('rows');rows.replaceChildren();for(const t of HLMSeasonLedger.standings(state)){const tr=document.createElement('tr');for(const v of [t.name,t.gp,t.w,t.l,t.otl,t.pts]){const td=document.createElement('td');td.textContent=String(v);tr.append(td)}rows.append(tr)}document.getElementById('status').textContent='Standings reviewed. No save changes.'});const isolated={isolated:true,revision:0,state:null,load(){return this.state?JSON.parse(JSON.stringify(this.state)):null},loadRevision(){return this.revision},saveIfRevision(next,expected){if(expected!==this.revision)return false;this.state=JSON.parse(JSON.stringify(next));this.revision++;return true}};let session=null;const advanceButton=document.getElementById('advance-season'),seasonStatus=document.getElementById('season-status');document.getElementById('start-season').addEventListener('click',()=>{isolated.state={meta:{controlledTeamId:1,currentDate:'2026-10-18'},universe:{teams:[{id:1,name:'Home'},{id:2,name:'Visitors'}],players:[{id:10,teamId:1},{id:20,teamId:2}]},activity:{games:[{id:'day1',date:'2026-10-19',homeTeamId:1,awayTeamId:2,status:'scheduled'},{id:'day2',date:'2026-10-20',homeTeamId:2,awayTeamId:1,status:'scheduled'}]}};isolated.revision=0;session=HLMSeasonLedgerSession.createSession(isolated,HLMIsolatedDayStage.createStager,HLMPhase10BrowserSimulator.simulateGameScore,HLMSeasonLedger);advanceButton.disabled=false;seasonStatus.textContent='2 games pending. Human approval required.'});advanceButton.addEventListener('click',()=>{try{const next=session.advance(true,1315+isolated.revision,isolated.revision);const pending=session.preview().pending;seasonStatus.textContent='Day '+next.revision+' completed; '+pending+' games pending; standings leader '+next.standings[0].name+'. No production writes.';advanceButton.disabled=pending===0}catch(error){seasonStatus.textContent='Advance refused: '+error.message}});</script></body></html>
