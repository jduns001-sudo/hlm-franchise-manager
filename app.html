<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07111f"><link rel="manifest" href="./manifest.json"><title>HLM 27 Front Office</title>
<style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12233a;--line:#21344f;--text:#eef5ff;--muted:#91a5bf;--accent:#42a5ff;--good:#39d98a;--warn:#ffc857;--bad:#ff6b6b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06101d,#091727 45%,#07111f);color:var(--text);font:14px system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:255px;background:#081421;border-right:1px solid var(--line);padding:14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-weight:800;font-size:18px;padding:8px 6px 16px}.brand small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.navh{color:#6f88a5;font-size:11px;font-weight:800;margin:16px 7px 6px;text-transform:uppercase;letter-spacing:.08em}.nav button{width:100%;text-align:left;background:transparent;border:0;color:#c9d8e9;padding:9px 10px;border-radius:8px;margin:1px 0}.nav button:hover,.nav button.active{background:#11243b;color:white}.main{margin-left:255px;width:calc(100% - 255px);padding:20px;max-width:1600px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.title{font-size:25px;font-weight:800}.sub{color:var(--muted);margin-top:3px}.teamBadge{background:#10243b;border:1px solid var(--line);border-radius:10px;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:rgba(14,27,45,.94);border:1px solid var(--line);border-radius:12px;padding:15px;box-shadow:0 10px 30px rgba(0,0,0,.15)}.metric{font-size:27px;font-weight:800}.label{color:var(--muted);font-size:12px}.section{margin:18px 0 9px;font-size:16px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{background:#163352;color:white;border:1px solid #28537f;border-radius:8px;padding:8px 11px}.btn.primary{background:#1e73be;border-color:#2d8de2}.btn.good{background:#125f43;border-color:#218f67}.btn.warn{background:#6b4c0e;border-color:#9d7319}.btn.danger{background:#68282d;border-color:#984048}.input,.select,.textarea{width:100%;background:#091625;color:white;border:1px solid #29415f;border-radius:8px;padding:9px}.textarea{min-height:90px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:9px 10px;border-bottom:1px solid #1b2c42;text-align:left;white-space:nowrap}.table th{color:#9db2cb;background:#0b192a;font-size:12px;position:sticky;top:0}.pill{display:inline-block;padding:3px 7px;border-radius:99px;background:#19304b;color:#cfe3f8;font-size:11px}.pill.good{background:#123e31;color:#6df0b2}.pill.warn{background:#493a13;color:#ffd66b}.pill.bad{background:#4a2025;color:#ff9292}.notice{padding:10px 12px;border-left:3px solid var(--accent);background:#0c1b2c;border-radius:6px;color:#cbd9e8}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px;border:1px solid #1d3149;border-radius:9px;background:#0b192a}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modalbox{width:min(850px,100%);max-height:92vh;overflow:auto;background:#0b1828;border:1px solid #29415f;border-radius:14px;padding:18px}.formgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field label{display:block;color:#9eb2ca;font-size:11px;margin-bottom:4px}.field.full{grid-column:1/-1}.close{float:right}.empty{padding:30px;text-align:center;color:var(--muted)}.mini{font-size:12px;color:var(--muted)}@media(max-width:900px){.side{position:static;width:100%;height:auto;border-right:0;border-bottom:1px solid var(--line)}.app{display:block}.main{margin-left:0;width:100%;padding:12px}.grid{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.filters{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.side{padding:8px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:2px}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">🏒 HLM 27 Front Office<small>Franchise operating system</small></div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><div class="title" id="title">Command Center</div><div class="sub" id="sub">Your franchise at a glance</div></div><div class="teamBadge" id="controlled">Controlled Team: Not Set</div></div><div id="view"></div></main></div>
<div class="modal" id="modal"><div class="modalbox"><button class="btn close" onclick="closeModal()">Close</button><div id="modalContent"></div></div></div>
<script>
const KEY='hlm_front_office_v5';const DBNAME='hlm_front_office_v5';const OLDDB='hlm_front_office_v4';const STORE='state';let U=null,db=null,current='dashboard';let idb=null;
const navGroups={"🏒 COMMAND CENTER":[['dashboard','⭐ GM Decision Center'],['snapshot','📸 Opening Snapshot'],['competition','⚔️ Roster Competition'],['decisions','📝 Decision Board'],['pipeline','🧬 Franchise Pipeline'],['evolution','📈 Roster Evolution']],"👑 MY FRANCHISE":[['roster','Roster'],['lines','Lines'],['depth','Depth Chart'],['contracts','Contracts'],['cap','Cap'],['prospects','Prospects'],['draftboard','Draft Board'],['picks','Draft Picks'],['transactions','Transactions'],['franchisehistory','Franchise History']],"🌎 LEAGUE":[['teams','Teams'],['teamrosters','Team Rosters'],['teamdepth','Team Depth Charts'],['players','Players'],['freeagents','Free Agents'],['leagueprospects','Prospects'],['rankings','Prospect Rankings'],['draftclasses','Draft Classes'],['futurepicks','Future Draft Picks'],['trades','Trade Market'],['leaguehistory','League History']],"🎯 DRAFT CENTER":[['currentdraft','Current Draft'],['futureclasses','Future Draft Classes'],['draftboard2','Draft Board'],['draftpicks2','Draft Picks'],['drafthistory','Draft History'],['draftneeds','Draft Needs']],"🤖 GM ASSISTANT":[['brief','Daily GM Brief'],['tradeassist','Trade Assistant'],['contractassist','Contract Assistant'],['faassist','Free Agency Assistant'],['callup','Call-Up Assistant'],['depthassist','Depth Chart Assistant'],['injury','Injury Replacement'],['development','Development Assistant'],['capassist','Cap Assistant'],['draftassist','Draft Assistant'],['deadline','Trade Deadline'],['offseason','Offseason Assistant'],['planner','Long-Term Planner'],['staff','Staff Assistant'],['scouting','Scouting Assistant']],"📚 HISTORY":[['seasons','Season History'],['careers','Player Careers'],['rosterhistory','Roster History'],['transactions2','Transactions'],['tradetrees','Trade Trees'],['awards','Awards'],['records','Records'],['championships','Championships'],['retired','Retired Players']],"💾 MANAGEMENT":[['backup','Backup / Restore'],['importexport','Import / Export'],['settings','Franchise Settings'],['controlledteam','Controlled Team'],['database','Database Management']]};
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function money(x){return x?('$'+Number(x).toLocaleString()):'$0'}function teamName(id){return U?.teams.find(t=>t.id==id)?.name||'Free Agent / Other'}function activePlayers(){return db.players.filter(p=>!p.retired)}function myPlayers(){let id=db.settings.controlledTeamId;return activePlayers().filter(p=>p.teamId==id)}function posText(p){return (p.positions&&p.positions.length?p.positions:[p.position||'--']).join('/')}function potentialText(p){if(p.potentialLabel)return `${p.potentialLabel} (${p.potentialMin||p.potentialMax||p.potential}-${p.potentialMax||p.potential})`;if(p.potentialStars)return `${p.potentialStars}★`;return p.potential??'--'}function potentialValue(p){return Number(p.potentialMax||p.potential||0)}
function openStateDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>{idb=r.result;resolve()};r.onerror=()=>reject(r.error)})}
function readState(){return new Promise((resolve,reject)=>{const r=idb.transaction(STORE,'readonly').objectStore(STORE).get('db');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function writeState(state){return new Promise((resolve,reject)=>{const r=idb.transaction(STORE,'readwrite').objectStore(STORE).put(state,'db');r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function compactState(){const base=new Map(U.players.map(p=>[String(p.id),p]));const custom=[];for(const p of db.players){if(!base.has(String(p.id))) custom.push(p)}return {schema:5,settings:db.settings,customPlayers:custom,playerOverrides:{},extraDraftPicks:db.draftPicks.slice(U.draftPicks.length),decisions:db.decisions,transactions:db.transactions,lines:db.lines,depth:db.depth,contracts:db.contracts,prospects:db.prospects,draftBoard:db.draftBoard,history:db.history,notes:db.notes}}
function save(){writeState(compactState()).catch(e=>console.error('Save failed',e))}
async function readOldV4(){return new Promise(resolve=>{try{const r=indexedDB.open(OLDDB,1);r.onsuccess=()=>{const od=r.result;try{const q=od.transaction('state','readonly').objectStore('state').get('db');q.onsuccess=()=>resolve(q.result||null);q.onerror=()=>resolve(null)}catch(e){resolve(null)}};r.onerror=()=>resolve(null)}catch(e){resolve(null)}})}
async function initDB(){await openStateDB();const old=await readState();let st=old;if(!st){const migrated=await readOldV4();st=migrated?{schema:5,settings:migrated.settings||{controlledTeamId:null,franchiseName:'HLM 27 Franchise',season:2026},customPlayers:migrated.customPlayers||[],playerOverrides:{},extraDraftPicks:migrated.extraDraftPicks||[],decisions:migrated.decisions||[],transactions:migrated.transactions||[],lines:migrated.lines||{},depth:migrated.depth||{},contracts:migrated.contracts||[],prospects:migrated.prospects||[],draftBoard:migrated.draftBoard||[],history:migrated.history||[],notes:migrated.notes||[]}:null}if(!st)st={schema:5,settings:{controlledTeamId:null,franchiseName:'HLM 27 Franchise',season:2026},customPlayers:[],playerOverrides:{},extraDraftPicks:[],decisions:[],transactions:[],lines:{},depth:{},contracts:[],prospects:[],draftBoard:[],history:[],notes:[]};db={schema:5,settings:st.settings||{controlledTeamId:null,franchiseName:'HLM 27 Franchise',season:2026},players:U.players.map(p=>({...p})).concat(st.customPlayers||[]),teams:U.teams,seasons:U.seasons,draftPicks:U.draftPicks.concat(st.extraDraftPicks||[]),rookies:U.rookies,decisions:st.decisions||[],transactions:st.transactions||[],lines:st.lines||{},depth:st.depth||{},contracts:st.contracts||[],prospects:st.prospects||[],draftBoard:st.draftBoard||[],history:st.history||[],notes:st.notes||[]};if(!old)save()}

function buildNav(){nav.innerHTML=Object.entries(navGroups).map(([h,items])=>`<div class="navh">${h}</div>${items.map(([id,label])=>`<button class="${current===id?'active':''}" onclick="go('${id}')">${label}</button>`).join('')}`).join('')}
function go(id){current=id;buildNav();render()}
function shell(title,sub,html){document.getElementById('title').textContent=title;document.getElementById('sub').textContent=sub;document.getElementById('controlled').textContent='Controlled Team: '+(db.settings.controlledTeamId?teamName(db.settings.controlledTeamId):'Not Set');view.innerHTML=html}
function metric(label,val){return `<div class="card"><div class="label">${label}</div><div class="metric">${esc(val)}</div></div>`}
function table(headers,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.join(''):`<tr><td colspan="${headers.length}" class="empty">No records found.</td></tr>`}</tbody></table></div>`}
function render(){const f={dashboard:dashboard,snapshot:snapshot,competition:competition,decisions:decisions,pipeline:pipeline,evolution:evolution,roster:roster,lines:lines,depth:depth,contracts:contracts,cap:cap,prospects:prospects,draftboard:draftboard,picks:picks,transactions:transactions,franchisehistory:franchisehistory,teams:teams,teamrosters:teamrosters,teamdepth:teamdepth,players:players,freeagents:freeagents,leagueprospects:leagueprospects,rankings:rankings,draftclasses:draftclasses,futurepicks:futurepicks,trades:trades,leaguehistory:leaguehistory,currentdraft:currentdraft,futureclasses:futureclasses,draftboard2:draftboard,draftpicks2:picks,drafthistory:drafthistory,draftneeds:draftneeds,brief:brief,tradeassist:tradeassist,contractassist:contractassist,faassist:faassist,callup:callup,depthassist:depthassist,injury:injury,development:development,capassist:capassist,draftassist:draftassist,deadline:deadline,offseason:offseason,planner:planner,staff:staff,scouting:scouting,seasons:seasons,careers:careers,rosterhistory:rosterhistory,transactions2:transactions,tradetrees:tradetrees,awards:awards,records:records,championships:championships,retired:retired,backup:backup,settings:settings,controlledteam:controlledteam,database:database};(f[current]||dashboard)()}
function dashboard(){const ap=activePlayers(),mp=myPlayers();shell('GM Decision Center','Command Center for the next move',`<div class="grid">${metric('Players in universe',db.players.length.toLocaleString())}${metric('Active players',ap.length.toLocaleString())}${metric('Teams',db.teams.length.toLocaleString())}${metric('Future picks',db.draftPicks.length.toLocaleString())}</div><div class="section">Franchise pulse</div><div class="grid2"><div class="card"><h3>🤖 Daily GM Brief</h3><div class="list"><div class="row"><span>Controlled roster</span><b>${mp.length}</b></div><div class="row"><span>Average OVR</span><b>${mp.length?(mp.reduce((a,p)=>a+Number(p.ovr||0),0)/mp.length).toFixed(1):'--'}</b></div><div class="row"><span>Potential 85+</span><b>${mp.filter(p=>potentialValue(p)>=85).length}</b></div><div class="row"><span>Players age 30+</span><b>${mp.filter(p=>p.age>=30).length}</b></div></div><button class="btn primary" onclick="go('brief')">Open GM Brief</button></div><div class="card"><h3>⚡ Quick Actions</h3><div class="toolbar"><button class="btn primary" onclick="openPlayer()">+ Add Player</button><button class="btn" onclick="go('controlledteam')">Set Controlled Team</button><button class="btn" onclick="go('lines')">Edit Lines</button><button class="btn" onclick="go('backup')">Backup Franchise</button></div><div class="notice">The assistant recommends options and explains why. You make the roster moves.</div></div></div><div class="section">Your core workflow</div><div class="grid"><div class="card"><b>1. Import</b><div class="mini">Universe loaded from your HLM 27 roster.</div></div><div class="card"><b>2. Analyze</b><div class="mini">Roster, contracts, prospects and league needs.</div></div><div class="card"><b>3. Decide</b><div class="mini">Trade, sign, draft, call up or develop.</div></div><div class="card"><b>4. Track</b><div class="mini">Build a 30+ year franchise history.</div></div></div>`)}
function roster(){const id=db.settings.controlledTeamId;const ps=myPlayers();shell('My Roster',teamName(id),`<div class="toolbar"><button class="btn primary" onclick="openPlayer(${id})">+ Add Player to Team</button><button class="btn" onclick="go('lines')">Lines</button><button class="btn" onclick="go('depth')">Depth Chart</button><input class="input" id="rosterSearch" placeholder="Search roster..."></div>${table(['Player','Pos','Age','OVR','Potential','Type','AAV'],ps.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(posText(p))}</td><td>${p.age}</td><td>${p.ovr}</td><td>${esc(potentialText(p))}</td><td><span class="pill">${esc(p.type)}</span></td><td>${money(p.aav)}</td></tr>`).join(''))}`);document.getElementById('rosterSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#view .table tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')})}
function filterTable(id,q){document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=(r.dataset.search||'').toLowerCase().includes(q.toLowerCase())?'':'none')}
function players(){let ps=activePlayers();shell('Players','Entire active league database',`<div class="toolbar"><button class="btn primary" onclick="openPlayer()">+ Add Player</button><button class="btn" onclick="go('retired')">Historical Archive</button></div><div class="filters"><input class="input" id="psearch" placeholder="Search name, team, type" oninput="renderPlayers()"><select class="select" id="teamfilter" onchange="renderPlayers()"><option value="">All teams</option>${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><select class="select" id="posfilter" onchange="renderPlayers()"><option value="">All positions</option><option>C</option><option>LW</option><option>RW</option><option>LD</option><option>RD</option><option>G</option></select><select class="select" id="ovrfilter" onchange="renderPlayers()"><option value="0">Any OVR</option><option value="80">80+</option><option value="85">85+</option><option value="90">90+</option></select></div><div id="playerTable"></div>`);renderPlayers()}
function renderPlayers(){let q=(document.getElementById('psearch')?.value||'').toLowerCase(),tid=document.getElementById('teamfilter')?.value||'',pos=document.getElementById('posfilter')?.value||'',ov=Number(document.getElementById('ovrfilter')?.value||0);let ps=activePlayers().filter(p=>(!q||p.name.toLowerCase().includes(q)||teamName(p.teamId).toLowerCase().includes(q)||String(p.type).toLowerCase().includes(q))&&(!tid||p.teamId==tid)&&(!pos||((p.positions||[p.position]).includes(pos)))&&Number(p.ovr)>=ov).slice(0,500);document.getElementById('playerTable').innerHTML=table(['Player','Team','Pos','Age','OVR','Potential','Type','AAV','Action'],ps.map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(teamName(p.teamId))}</td><td>${esc(posText(p))}</td><td>${p.age}</td><td>${p.ovr}</td><td>${esc(potentialText(p))}</td><td>${esc(p.type)}</td><td>${money(p.aav)}</td><td><button class="btn" onclick="openPlayerEdit(${p.id})">Edit</button></td></tr>`))}
function teams(){shell('Teams','League-wide team database',`<div class="toolbar"><button class="btn primary" onclick="go('controlledteam')">Choose Controlled Team</button></div>${table(['Team','Abbr','Active Players','Color 1','Color 2'],db.teams.map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.abbr)}</td><td>${activePlayers().filter(p=>p.teamId==t.id).length}</td><td>${esc(t.color1)}</td><td>${esc(t.color2)}</td></tr>`))}`)}
function teamrosters(){shell('Team Rosters','Every team, current active roster',`<div class="filters"><select class="select" id="trteam" onchange="renderTeamRoster()"><option value="">Select a team</option>${db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div><div id="trout" class="card">Select a team to view its roster.</div>`);}
function renderTeamRoster(){let t=document.getElementById('trteam').value,p=activePlayers().filter(x=>x.teamId==t).sort((a,b)=>Number(b.ovr||0)-Number(a.ovr||0));document.getElementById('trout').innerHTML=table(['Player','Pos','Age','OVR','Potential','Type','AAV'],p.map(x=>`<tr><td><b>${esc(x.name)}</b></td><td><span class="pill">${esc(posText(x))}</span></td><td>${x.age}</td><td>${x.ovr}</td><td>${esc(potentialText(x))}</td><td>${esc(x.type)}</td><td>${money(x.aav)}</td></tr>`))}
function controlledteam(){shell('Controlled Team','Choose the franchise you manage',`<div class="card"><h3>Current: ${teamName(db.settings.controlledTeamId)}</h3><select class="select" id="ctselect"><option value="">Choose team</option>${db.teams.map(t=>`<option value="${t.id}" ${db.settings.controlledTeamId==t.id?'selected':''}>${esc(t.name)} (${esc(t.abbr)})</option>`).join('')}</select><div class="toolbar" style="margin-top:12px"><button class="btn primary" onclick="setControlled()">Save Controlled Team</button></div><div class="notice">Changing the controlled team does not delete anything. It changes which franchise powers the GM Assistant and My Franchise sections.</div></div>`)}
function setControlled(){db.settings.controlledTeamId=Number(document.getElementById('ctselect').value)||null;save();buildNav();render()}
function lines(){const ps=myPlayers();shell('Lines','Build your active lineup and save combinations',`<div class="toolbar"><button class="btn primary" onclick="saveLines()">Save Lines</button><button class="btn" onclick="autoLines()">Auto Suggest Lines</button></div><div class="grid2"><div class="card"><h3>Forwards</h3>${lineSelect('LW1','Left Wing',ps)}${lineSelect('C1','Center',ps)}${lineSelect('RW1','Right Wing',ps)}${lineSelect('LW2','Left Wing',ps)}${lineSelect('C2','Center',ps)}${lineSelect('RW2','Right Wing',ps)}</div><div class="card"><h3>Defense</h3>${lineSelect('LD1','Left Defense',ps)}${lineSelect('RD1','Right Defense',ps)}${lineSelect('LD2','Left Defense',ps)}${lineSelect('RD2','Right Defense',ps)}${lineSelect('LD3','Left Defense',ps)}${lineSelect('RD3','Right Defense',ps)}</div></div>`)}
function lineSelect(k,label,ps){return `<div class="field" style="margin:8px 0"><label>${label}</label><select class="select linepick" data-key="${k}"><option value="">Open</option>${ps.slice().sort((a,b)=>b.ovr-a.ovr).map(p=>`<option value="${p.id}" ${db.lines[k]==p.id?'selected':''}>${esc(p.name)} (${p.ovr})</option>`).join('')}</select></div>`}
function saveLines(){document.querySelectorAll('.linepick').forEach(s=>db.lines[s.dataset.key]=Number(s.value)||null);save();alert('Lines saved.')}
function autoLines(){let ps=myPlayers().slice().sort((a,b)=>b.ovr-a.ovr);document.querySelectorAll('.linepick').forEach((s,i)=>s.value=ps[i]?.id||'')}
function depth(){shell('Depth Chart','Position-by-position roster hierarchy',`<div class="grid2">${['C','LW','RW','LD','RD','G'].map(pos=>{let p=myPlayers().filter(x=>x.position==pos).sort((a,b)=>b.ovr-a.ovr);return `<div class="card"><h3>${pos}</h3>${p.slice(0,8).map((x,i)=>`<div class="row"><span>${i+1}. ${esc(x.name)}</span><b>${x.ovr}</b></div>`).join('')||'<div class="mini">No position data</div>'}</div>`}).join('')}</div>`)}
function prospects(){let ps=activePlayers().filter(p=>p.age<=23&&potentialValue(p)>=80).sort((a,b)=>potentialValue(b)-potentialValue(a)).slice(0,100);shell('Prospects','Players with future value in your system',`<div class="toolbar"><button class="btn primary" onclick="openPlayer()">+ Add Prospect</button></div>${table(['Player','Team','Age','OVR','Potential','Type'],ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(teamName(p.teamId))}</td><td>${p.age}</td><td>${p.ovr}</td><td><b>${p.potential}</b></td><td>${esc(p.type)}</td></tr>`))}`)}
function leagueprospects(){prospects()}
function rankings(){let ps=activePlayers().filter(p=>p.age<=23).sort((a,b)=>(potentialValue(b)-potentialValue(a))||0);ps.sort((a,b)=>potentialValue(b)-potentialValue(a));shell('Prospect Rankings','League-wide potential board',table(['Rank','Player','Team','Age','OVR','Potential','Type'],ps.slice(0,100).map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.name)}</td><td>${esc(teamName(p.teamId))}</td><td>${p.age}</td><td>${p.ovr}</td><td>${p.potential}</td><td>${esc(p.type)}</td></tr>`)))}
function freeagents(){let ps=activePlayers().filter(p=>p.teamId<0||teamName(p.teamId)==='Free Agent / Other').sort((a,b)=>b.ovr-a.ovr);shell('Free Agents','Players without a current team',table(['Player','Pos','Age','OVR','Potential','AAV'],ps.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.position||'--')}</td><td>${p.age}</td><td>${p.ovr}</td><td>${p.potential}</td><td>${money(p.aav)}</td></tr>`)))}
function picks(){shell('Draft Picks','Owned and future draft assets',`<div class="toolbar"><button class="btn primary" onclick="addPick()">+ Add Pick</button></div>${table(['Year','Owner','Original','Round'],db.draftPicks.slice().sort((a,b)=>a.year-b.year||a.round-b.round).map(p=>`<tr><td>${p.year}</td><td>${esc(teamName(p.teamId))}</td><td>${esc(teamName(p.originalTeamId))}</td><td>${p.round}</td></tr>`))}`)}
function futurepicks(){picks()}
function draftclasses(){shell('Draft Classes','Future and historical class planning',`<div class="grid">${[2027,2028,2029,2030,2031,2032].map(y=>metric(String(y),db.rookies.filter(r=>String(r.raw).includes(','+y+',')).length)).join('')}</div><div class="notice" style="margin-top:12px">Draft classes can be supplemented manually through Add Player and Draft Board.</div>`)}
function futureclasses(){draftclasses()}
function draftboard(){shell('Draft Board','Your prioritized targets',`<div class="toolbar"><button class="btn primary" onclick="openPlayer()">Add Player to Database</button></div><div class="card"><div class="mini">Draft Board persistence is ready for manual priorities. Add notes and rankings as your franchise develops.</div></div>`)}
function draftclasses2(){}
function currentdraft(){draftboard()};function drafthistory(){shell('Draft History','Historical draft tracking',table(['Year','Team','Round'],db.draftPicks.slice().sort((a,b)=>b.year-a.year).slice(0,100).map(p=>`<tr><td>${p.year}</td><td>${esc(teamName(p.teamId))}</td><td>${p.round}</td></tr>`)))}function draftneeds(){shell('Draft Needs','Positions to target based on roster age and depth',`<div class="grid">${['C','LW','RW','LD','RD','G'].map(pos=>{let p=myPlayers().filter(x=>x.position==pos);return metric(pos,p.length?Math.round(p.reduce((a,x)=>a+Number(x.ovr),0)/p.length):'0')}).join('')}</div>`)}
function brief(){let p=myPlayers();let aging=p.filter(x=>x.age>=30).sort((a,b)=>a.ovr-b.ovr).slice(0,5),young=p.filter(x=>x.age<=23&&x.potential>x.ovr+8).sort((a,b)=>(b.potential-b.ovr)-(a.potential-a.ovr)).slice(0,5);shell('Daily GM Brief','Automated roster scan',`<div class="grid2"><div class="card"><h3>🚨 Attention</h3>${aging.map(x=>`<div class="row"><span>${esc(x.name)}<br><span class="mini">Age ${x.age} • OVR ${x.ovr}</span></span><b>Review</b></div>`).join('')||'<div class="mini">No obvious aging flags.</div>'}</div><div class="card"><h3>🌱 Opportunity</h3>${young.map(x=>`<div class="row"><span>${esc(x.name)}<br><span class="mini">OVR ${x.ovr} • POT ${x.potential}</span></span><b>Develop</b></div>`).join('')||'<div class="mini">No major development flags.</div>'}</div></div><div class="notice" style="margin-top:12px">These are decision prompts, not automatic moves.</div>`)}
function tradeassist(){let p=myPlayers().filter(x=>x.age>=29||x.ovr<75).sort((a,b)=>a.ovr-b.ovr);shell('Trade Assistant','Players to review for possible roster moves',table(['Player','Age','OVR','Potential','Reason'],p.slice(0,30).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.age}</td><td>${x.ovr}</td><td>${esc(potentialText(x))}</td><td>${x.age>=31?'Age curve':'Roster fit / value review'}</td></tr>`)))}
function contractassist(){let p=myPlayers().filter(x=>x.aav>0).sort((a,b)=>a.age-b.age);shell('Contract Assistant','Contract decisions to review',table(['Player','Age','OVR','AAV','Suggested Review'],p.slice(0,50).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.age}</td><td>${x.ovr}</td><td>${money(x.aav)}</td><td>${x.age>=30?'Term/cap risk':'Extension value'}</td></tr>`)))}
function faassist(){let p=activePlayers().filter(x=>x.teamId<0).sort((a,b)=>b.ovr-a.ovr);shell('Free Agency Assistant','Available fits',table(['Player','Age','OVR','Potential','AAV'],p.slice(0,50).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.age}</td><td>${x.ovr}</td><td>${esc(potentialText(x))}</td><td>${money(x.aav)}</td></tr>`)))}
function callup(){shell('Call-Up Assistant','Compare younger players against your current roster',table(['Player','Age','OVR','Potential','Action to Review'],myPlayers().filter(x=>x.age<=24&&x.potential>=x.ovr+5).sort((a,b)=>potentialValue(b)-potentialValue(a)).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.age}</td><td>${x.ovr}</td><td>${esc(potentialText(x))}</td><td>Consider call-up/development plan</td></tr>`)))}
function depthassist(){shell('Depth Chart Assistant','Find buried or misaligned talent',table(['Player','Pos','OVR','Potential','Review'],myPlayers().sort((a,b)=>b.ovr-a.ovr).slice(0,40).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(posText(x))}</td><td>${x.ovr}</td><td>${esc(potentialText(x))}</td><td>Verify role and slot</td></tr>`)))}
function injury(){shell('Injury Replacement','Quick replacement board','<div class="notice">Select the injured position, then use the roster and depth tools to identify the next available replacement.</div>')}
function development(){let p=myPlayers().filter(x=>x.age<=25).sort((a,b)=>(b.potential-b.ovr)-(a.potential-a.ovr));shell('Development Assistant','Players with growth runway',table(['Player','Age','OVR','Potential','Gap'],p.slice(0,50).map(x=>`<tr><td>${esc(x.name)}</td><td>${x.age}</td><td>${x.ovr}</td><td>${esc(potentialText(x))}</td><td>${Number(x.potential)-Number(x.ovr)}</td></tr>`)))}
function cap(){let p=myPlayers();shell('Cap','Franchise contract snapshot',`<div class="grid">${metric('Roster AAV',money(p.reduce((a,x)=>a+Number(x.aav||0),0)))}${metric('Players',p.length)}${metric('AAV / Player',money(p.length?p.reduce((a,x)=>a+Number(x.aav||0),0)/p.length:0))}${metric('Age 30+',p.filter(x=>x.age>=30).length)}</div>`)}function capassist(){cap()};function deadline(){tradeassist()};function offseason(){shell('Offseason Assistant','Annual franchise checklist',`<div class="list">${['Review expiring contracts','Set protected / trade lists','Audit prospect development','Review draft picks','Build draft board','Evaluate free agency','Set opening lines','Record season snapshot'].map(x=>`<div class="row"><span>☐ ${x}</span></div>`).join('')}</div>`)}function planner(){shell('Long-Term Planner','3–5 year franchise outlook',`<div class="card"><textarea class="textarea" id="plan" placeholder="Write your franchise plan...">${esc(db.settings.longPlan||'')}</textarea><button class="btn primary" style="margin-top:8px" onclick="db.settings.longPlan=document.getElementById('plan').value;save();alert('Plan saved.')">Save Plan</button></div>`)}function staff(){shell('Staff Assistant','Staff and organizational notes','<div class="notice">Use this space for coaching, scouting and staff priorities. Staff data can be expanded as franchise history is recorded.</div>')}function scouting(){shell('Scouting Assistant','Scouting workflow','<div class="notice">Prioritize prospects by potential, age, position need and organizational fit. The Prospect Rankings and Draft Board work together here.</div>')}
function contracts(){const rows=db.contracts.map((c,i)=>{const p=db.players.find(x=>x.id==c.playerId);return `<tr><td>${esc(p?.name||c.player||c.playerId||'--')}</td><td>${money(c.aav||c.salary)}</td><td>${esc(c.years??c.term??'--')}</td><td>${esc(c.status||'Tracked')}</td></tr>`});shell('Contracts','Contract commitments and decisions',`${table(['Player','AAV','Years','Status'],rows)}<div class=\"notice\" style=\"margin-top:12px\">Contracts can be tracked manually as you make franchise decisions. Use Contract Assistant for recommendations.</div>`)}
function teamdepth(){const rows=db.teams.map(t=>{const ps=activePlayers().filter(p=>p.teamId==t.id);return `<tr><td>${esc(t.name)}</td><td>${ps.filter(p=>['C','LW','RW'].includes(p.position)).length}</td><td>${ps.filter(p=>['LD','RD'].includes(p.position)).length}</td><td>${ps.filter(p=>p.position==='G').length}</td></tr>`});shell('Team Depth Charts','League-wide roster composition',table(['Team','Forwards','Defense','Goalies'],rows))}
function trades(){shell('Trade Market','League-wide trade targets and assets',`<div class=\"toolbar\"><input class=\"input\" id=\"tradeSearch\" placeholder=\"Search players or teams...\" oninput=\"filterTable('tradeTable',this.value)\"></div>${table(['Player','Team','Pos','Age','OVR','Potential'],activePlayers().slice().sort((a,b)=>Number(b.ovr||0)-Number(a.ovr||0)).slice(0,500).map(p=>`<tr data-search=\"${esc(p.name+' '+teamName(p.teamId))}\"><td>${esc(p.name)}</td><td>${esc(teamName(p.teamId))}</td><td>${esc(p.position||'--')}</td><td>${esc(p.age)}</td><td>${esc(p.ovr)}</td><td>${esc(p.potential)}</td></tr>`))}`);document.getElementById('view').querySelector('.table')?.setAttribute('id','tradeTable')}
function draftassist(){shell('Draft Assistant','Connect roster needs to your draft strategy',`<div class=\"grid\">${['C','LW','RW','LD','RD','G'].map(pos=>{const ps=myPlayers().filter(p=>p.position===pos);const avg=ps.length?Math.round(ps.reduce((a,p)=>a+Number(p.ovr||0),0)/ps.length):0;return metric(pos,avg<70?'High Need':avg<78?'Monitor':'Stable')}).join('')}</div><div class=\"notice\" style=\"margin-top:12px\">Use Draft Board and Prospect Rankings together. The assistant highlights organizational needs without making the selection for you.</div>`)}
function importexport(){shell('Import / Export','Move franchise data between devices',`<div class=\"card\"><h3>Franchise Backup</h3><p class=\"mini\">Export your franchise changes and restore them later without duplicating the large HLM universe file.</p><div class=\"toolbar\"><button class=\"btn primary\" onclick=\"downloadBackup()\">Export Franchise Data</button><label class=\"btn\">Import Franchise Data <input type=file accept=\"application/json\" hidden onchange=\"restoreBackup(this)\"></label></div></div>`)}
function snapshot(){shell('Opening Snapshot','Save the state of your franchise at the start of a run','<div class="card"><textarea class="textarea" id="snap" placeholder="Franchise goals, strengths, weaknesses, cap plan, draft assets...">'+esc(db.settings.snapshot||'')+'</textarea><button class="btn primary" style="margin-top:8px" onclick="db.settings.snapshot=document.getElementById(\'snap\').value;save();alert(\'Snapshot saved.\')">Save Snapshot</button></div>')}function competition(){shell('Roster Competition','Internal competition for roles',table(['Player','Pos','OVR','Potential','Competition Note'],myPlayers().sort((a,b)=>b.ovr-a.ovr).slice(0,50).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(posText(x))}</td><td>${x.ovr}</td><td>${esc(potentialText(x))}</td><td>Compare role, age and development</td></tr>`)))}function decisions(){shell('Decision Board','Your pending GM decisions',`<div class="toolbar"><button class="btn primary" onclick="addDecision()">+ Add Decision</button></div><div class="list">${db.decisions.map((d,i)=>`<div class="row"><span><b>${esc(d.title)}</b><br><span class="mini">${esc(d.note)}</span></span><button class="btn" onclick="db.decisions.splice(${i},1);save();render()">Done</button></div>`).join('')||'<div class="empty">No decisions yet.</div>'}</div>`)}function pipeline(){shell('Franchise Pipeline','Long-range roster construction','<div class="notice">Track the path from prospect to NHL contributor, contract decision, trade asset or retirement. Add players and use the development tools to keep the pipeline alive.</div>')}function evolution(){shell('Roster Evolution','How your roster changes over time',table(['Season','Transactions','Notes'],(db.history||[]).map(h=>`<tr><td>${h.season}</td><td>${h.transactions||0}</td><td>${esc(h.notes||'')}</td></tr>`)))}
function transactions(){shell('Transactions','Franchise transaction log',`<div class="toolbar"><button class="btn primary" onclick="addTransaction()">+ Log Transaction</button></div>${table(['Date','Type','Player','Details'],db.transactions.map(t=>`<tr><td>${esc(t.date)}</td><td>${esc(t.type)}</td><td>${esc(t.player)}</td><td>${esc(t.details)}</td></tr>`))}`)}function franchisehistory(){evolution()};function leaguehistory(){seasons()};function seasons(){shell('Season History','Historical season records',table(['Year','Player','Team','OVR','AAV'],db.seasons.slice().sort((a,b)=>b.year-a.year).slice(0,200).map(s=>`<tr><td>${s.year}</td><td>${esc((db.players.find(p=>p.id==s.playerId)||{}).name||s.playerId)}</td><td>${esc(teamName(s.teamId))}</td><td>${esc(s.ovr)}</td><td>${money(s.aav)}</td></tr>`)))}function careers(){shell('Player Careers','Historical career archive',table(['Player','Team','Age','Status'],db.players.filter(p=>p.retired).slice(0,500).map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(teamName(p.teamId))}</td><td>${p.age}</td><td>Retired / Historical</td></tr>`)))}function retired(){careers()};function rosterhistory(){evolution()};function tradetrees(){shell('Trade Trees','Future and historical asset chains','<div class="notice">Trade-tree records will grow as transactions are logged. Future picks already imported are available under Draft Picks.</div>')}function awards(){shell('Awards','League and player awards archive','<div class="notice">Award history is preserved for future expansion from the HLM archive.</div>')}function records(){shell('Records','Franchise and league records','<div class="notice">Records archive is preserved in the franchise database and can be expanded with season snapshots.</div>')}function championships(){shell('Championships','Franchise championship history','<div class="notice">Record championships here as your 30+ year franchise unfolds.</div>')}
function backup(){shell('Backup / Restore','Protect your franchise database',`<div class="toolbar"><button class="btn primary" onclick="downloadBackup()">Download Backup</button><label class="btn">Restore Backup <input type="file" accept="application/json" hidden onchange="restoreBackup(this)"></label></div><div class="notice">Backups contain your custom players, controlled team, lines, decisions and franchise records.</div>`)}function downloadBackup(){const b=new Blob([JSON.stringify(compactState())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='hlm-front-office-backup.json';a.click();URL.revokeObjectURL(a.href)}function restoreBackup(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const st=JSON.parse(r.result);await writeState(st);await initDB();render();alert('Backup restored.')}catch(e){alert('Invalid backup file: '+e.message)}};r.readAsText(f)}function settings(){shell('Franchise Settings','Name and season controls',`<div class="card"><div class="formgrid"><div class="field"><label>Franchise Name</label><input class="input" id="fname" value="${esc(db.settings.franchiseName)}"></div><div class="field"><label>Current Season</label><input class="input" id="fseason" type="number" value="${db.settings.season}"></div></div><button class="btn primary" style="margin-top:12px" onclick="db.settings.franchiseName=document.getElementById('fname').value;db.settings.season=Number(document.getElementById('fseason').value);save();render()">Save Settings</button></div>`)}function database(){shell('Database Management','Universe and custom records',`<div class="grid">${metric('Imported players',U.meta.playerCount)}${metric('Active players',activePlayers().length)}${metric('Imported teams',U.meta.teamCount)}${metric('Imported picks',U.meta.pickCount)}</div><div class="toolbar" style="margin-top:12px"><button class="btn danger" onclick="if(confirm('Start a blank franchise? This removes current local changes.')){indexedDB.deleteDatabase(DBNAME);location.reload()}">Start New Franchise</button></div>`)}
function addDecision(){const title=prompt('Decision title');if(!title)return;const note=prompt('Notes / options');db.decisions.push({title,note});save();render()}function addTransaction(){const player=prompt('Player');if(!player)return;const type=prompt('Transaction type');const details=prompt('Details');db.transactions.push({date:new Date().toLocaleDateString(),player,type,details});save();render()}function addPick(){const year=Number(prompt('Draft year','2027'));if(!year)return;const team=Number(prompt('Owning team ID',db.settings.controlledTeamId||1));const round=Number(prompt('Round','1'));db.draftPicks.push({league:0,teamId:team,year,originalTeamId:team,round});save();render()}
function openPlayer(teamId=null, edit=null){const p=edit||{first:'',last:'',nation:'USA',birthYear:2005,age:21,position:'C',height:72,shoots:'L',teamId:teamId||db.settings.controlledTeamId||-1,ovr:70,potential:80,type:'PLM',aav:0,retired:false,potentialMin:80,potentialMax:80,potentialLabel:'Custom',positions:['C']};document.getElementById('modalContent').innerHTML=`<h2>${edit?'Edit Player':'Create Player'}</h2><div class="formgrid">${[['first','First Name'],['last','Last Name'],['nation','Nationality'],['birthYear','Birth Year'],['position','Position'],['height','Height (in)'],['shoots','Shoots'],['ovr','Overall'],['potential','Potential'],['type','Player Type'],['aav','AAV'],['age','Age']].map(([k,l])=>`<div class="field"><label>${l}</label><input class="input" id="pf_${k}" value="${esc(p[k]??'')}"></div>`).join('')}<div class="field"><label>Team</label><select class="select" id="pf_team"><option value="-1">Free Agent / Other</option>${db.teams.map(t=>`<option value="${t.id}" ${p.teamId==t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="field"><label>Prospect / Draft Year</label><input class="input" id="pf_draft" type="number" value="${p.draftYear||''}"></div><div class="field full"><label>Notes</label><textarea class="textarea" id="pf_notes">${esc(p.notes||'')}</textarea></div></div><div class="toolbar" style="margin-top:14px"><button class="btn primary" onclick="savePlayer(${edit?p.id:'null'})">${edit?'Save Changes':'Create Player'}</button></div>`;modal.classList.add('open')}
function openPlayerEdit(id){const p=db.players.find(x=>x.id==id);if(p)openPlayer(null,p)}function savePlayer(existing){const p={id:existing&&existing!=='null'?Number(existing):Date.now(),first:val('first'),last:val('last'),name:val('first')+' '+val('last'),nation:val('nation'),birthYear:Number(val('birthYear')),age:Number(val('age')),position:val('position').toUpperCase(),positions:[val('position').toUpperCase()],potentialMin:Number(val('potential')),potentialMax:Number(val('potential')),potentialLabel:'Custom',height:Number(val('height')),shoots:val('shoots').toUpperCase(),teamId:Number(document.getElementById('pf_team').value),ovr:Number(val('ovr')),potential:Number(val('potential')),type:val('type'),aav:Number(val('aav')),retired:false,draftYear:Number(val('draft'))||null,notes:document.getElementById('pf_notes').value,custom:true};if(existing&&existing!=='null'){const i=db.players.findIndex(x=>x.id==p.id);if(i>=0)db.players[i]={...db.players[i],...p}}else db.players.push(p);save();closeModal();render()}function val(k){return document.getElementById('pf_'+k).value}function closeModal(){modal.classList.remove('open')}
(async()=>{try{const r=await fetch('./hlm-universe.json',{cache:'no-store'});U=await r.json();await initDB();buildNav();render()}catch(e){document.body.innerHTML='<div style="padding:30px;color:white;font-family:system-ui"><h2>🏒 HLM Front Office</h2><p>Universe data could not be loaded.</p><p>'+esc(e.message)+'</p></div>'}})();
</script></body></html>
