<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental comparison explorer</title><style>body{margin:0;padding:16px;background:#101827;color:#f1f5f9;font:16px system-ui}main{max-width:720px;margin:auto}section{padding:14px;background:#1e293b;border-radius:12px;margin:12px 0}label{display:block;margin:8px 0}select{padding:10px;width:100%;font:inherit}table{width:100%;border-collapse:collapse}td,th{padding:7px;text-align:left;border-bottom:1px solid #475569}meter{width:100%}small{color:#cbd5e1}</style></head><body><main><h1>Performance explorer</h1><small>Experimental synthetic historical data only. No franchise saves or GM actions.</small><section><label for="season">Season</label><select id="season"><option value="all">All seasons</option><option value="2027">2027</option><option value="2028">2028</option><option value="2029">2029</option></select><label for="metric">Metric</label><select id="metric"><option value="consistency">Consistency</option><option value="volatility">Volatility</option></select></section><section><h2>Player / Team comparison</h2><table><thead><tr><th>Season</th><th>Player</th><th>Team</th></tr></thead><tbody id="rows"></tbody></table><p id="sample"></p></section></main><script>const fixtures=[{season:2027,consistency:[.8,.7],volatility:[.2,.3]},{season:2028,consistency:[.7,.8],volatility:[.3,.2]},{season:2029,consistency:[.9,.6],volatility:[.1,.4]}];function render(){const season=document.querySelector('#season').value,metric=document.querySelector('#metric').value;const rows=fixtures.filter(r=>season==='all'||String(r.season)===season);document.querySelector('#rows').replaceChildren(...rows.map(r=>{const tr=document.createElement('tr');for(const value of [r.season,...r[metric]]){const td=document.createElement('td');td.textContent=String(value);tr.append(td)}return tr}));document.querySelector('#sample').textContent='Sample-aware interpretation: synthetic illustration, not a prediction. Human GM retains authority.';}document.querySelectorAll('select').forEach(el=>el.addEventListener('change',render));render();</script></body></html>
