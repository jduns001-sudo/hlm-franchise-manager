<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sample-aware comparisons</title><style>body{font:16px system-ui;margin:1rem auto;padding:0 1rem;max-width:38rem}button{min-height:48px;padding:.7rem;margin:.4rem .4rem .4rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{width:100%;box-sizing:border-box}</style><main><h1>Experimental comparable samples</h1><p>Opt-in, read-only simulated player/team comparison. No production saves or GM actions.</p><button id="compare">Preview supported samples</button><button id="caution">Preview limited sample</button><button id="clear">Clear</button><pre id="result" aria-live="polite">Inactive by default</pre></main><script src="hlm-phase11-sample-quality-audit.browser.js"></script><script src="hlm-phase11-comparable-sample-insights.browser.js"></script><script>const result=document.getElementById('result'),home=[{shots:8,goals:2,expectedGoals:1},{shots:8,goals:2,expectedGoals:1}],away=[{shots:5,goals:1,expectedGoals:1},{shots:5,goals:0,expectedGoals:1}];function show(sample){result.textContent=JSON.stringify(HLMPhase11ComparableSampleInsights.compareSamples(home,sample),null,2)}document.getElementById('compare').onclick=()=>show(away);document.getElementById('caution').onclick=()=>show([{shots:1,goals:0,expectedGoals:0}]);document.getElementById('clear').onclick=()=>{result.textContent='Inactive by default'};</script></html>
