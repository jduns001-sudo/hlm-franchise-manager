<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental evidence synthesis</title><style>body{font:16px system-ui;margin:1rem auto;padding:0 1rem;max-width:38rem}button{min-height:48px;padding:.7rem;margin:.4rem .4rem .4rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{width:100%;box-sizing:border-box}</style><main><h1>Experimental evidence synthesis</h1><p>Opt-in simulated player/team evidence. No production save writes or GM decisions.</p><button id="preview">Preview combined evidence</button><button id="limited">Preview limited evidence</button><button id="clear">Clear</button><pre id="result" aria-live="polite">Inactive by default</pre></main><script src="hlm-phase11-sample-quality-audit.browser.js"></script><script src="hlm-phase11-comparable-sample-insights.browser.js"></script><script src="hlm-phase11-window-stability-insights.browser.js"></script><script src="hlm-phase11-shot-volume-balance.browser.js"></script><script src="hlm-phase11-evidence-synthesis.browser.js"></script><script>const result=document.getElementById('result'),home=[{shots:15,goals:3,expectedGoals:2},{shots:15,goals:3,expectedGoals:2},{shots:15,goals:6,expectedGoals:2},{shots:15,goals:6,expectedGoals:2}],away=[{shots:5,goals:1,expectedGoals:1},{shots:5,goals:1,expectedGoals:1},{shots:5,goals:1,expectedGoals:1},{shots:5,goals:1,expectedGoals:1}];function show(x){result.textContent=JSON.stringify(HLMPhase11EvidenceSynthesis.synthesizeEvidence(home,x),null,2)}document.getElementById('preview').onclick=()=>show(away);document.getElementById('limited').onclick=()=>show(away.slice(0,2));document.getElementById('clear').onclick=()=>{result.textContent='Inactive by default'};</script></html>
