<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental multi-metric comparison</title><style>*,*:before,*:after{box-sizing:border-box}body{margin:0;background:#101827;color:#f8fafc;font:16px system-ui;padding:14px}main{max-width:760px;margin:auto}section{background:#1e293b;border-radius:12px;padding:16px;margin:12px 0}fieldset{border:1px solid #64748b;border-radius:8px}label{display:block;margin:8px 0}select{width:100%;font:inherit;padding:10px;background:#f8fafc;color:#111827}button{font:inherit;padding:9px}svg{max-width:100%;height:auto}small{color:#cbd5e1}.season{border-bottom:1px solid #64748b;padding:12px 0}meter{width:100%}.muted{color:#cbd5e1}</style></head><body><main><h1>Historical multi-metric explorer</h1><small>Experimental synthetic data only. No production save access.</small><section><fieldset><legend>Seasons</legend><label><input type="checkbox" value="2027" checked> 2027</label><label><input type="checkbox" value="2028" checked> 2028</label><label><input type="checkbox" value="2029" checked> 2029</label></fieldset><label for="metric">Compare metric</label><select id="metric"><option value="points">Points per game</option><option value="goals">Goals per game</option><option value="assists">Assists per game</option><option value="shots">Shots per game</option><option value="finishing">Finishing rate</option></select><label for="focus">Comparison focus</label><select id="focus"><option value="both">Player and team</option><option value="player">Player only</option><option value="team">Team only</option></select></section><section><h2>Season trends</h2><div id="results" aria-live="polite"></div><p id="interpretation" role="status"></p></section></main><script>
const seasons=[{season:2027,games:3,points:[.35,.42],goals:[.2,.25],assists:[.15,.17],shots:[2,2.5],finishing:[.1,.1]},{season:2028,games:12,points:[.6,.55],goals:[.35,.3],assists:[.25,.25],shots:[3,3.2],finishing:[.16,.14]},{season:2029,games:30,points:[.72,.68],goals:[.4,.38],assists:[.32,.3],shots:[3.5,3.6],finishing:[.2,.18]}];
function render(){const chosen=new Set([...document.querySelectorAll('input:checked')].map(x=>Number(x.value))),metric=document.querySelector('#metric').value,focus=document.querySelector('#focus').value,rows=seasons.filter(s=>chosen.has(s.season)),root=document.querySelector('#results');root.replaceChildren();
for(const row of rows){const card=document.createElement('div');card.className='season';const title=document.createElement('strong');title.textContent=row.season+' · '+row.games+' games · '+(row.games>=20?'established':row.games>=5?'developing':'limited')+' sample';card.append(title);for(const [index,name] of ['Player','Team'].entries()){if(focus!=='both'&&focus!==name.toLowerCase())continue;const value=row[metric][index],label=document.createElement('div');label.textContent=name+' '+metric+': '+value;const meter=document.createElement('meter');meter.min=0;meter.max=metric==='shots'?5:1;meter.value=value;meter.setAttribute('aria-label',name+' '+metric);card.append(label,meter)}root.append(card)}
const status=document.querySelector('#interpretation');status.textContent=!rows.length?'No seasons selected. Select a season to compare.':rows.some(s=>s.games<5)?'Limited sample: season changes may be unstable. Directional description only, never a prediction.':'Season differences are descriptive, not predictive. Human GM retains final authority.';}
document.querySelectorAll('input,select').forEach(el=>el.addEventListener('change',render));render();
</script></body></html>
