<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental sample audit</title><style>body{font:16px system-ui;margin:1rem;max-width:36rem}button{min-height:48px;padding:.7rem;margin:.4rem 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}main{width:100%;box-sizing:border-box}</style><main><h1>Experimental sample-quality audit</h1><p>Read-only simulated sample. No save writes or automated GM decisions.</p><button id="preview" type="button">Preview evidence</button><button id="clear" type="button">Clear preview</button><pre id="result" aria-live="polite">Inactive by default</pre></main><script src="hlm-phase11-sample-quality-audit.browser.js"></script><script>const result=document.getElementById('result');document.getElementById('preview').addEventListener('click',()=>{const audit=HLMPhase11SampleQualityAudit.auditPeriods([{shots:8,goals:2,expectedGoals:1.5},{shots:6,goals:1,expectedGoals:1}]);result.textContent=JSON.stringify(audit,null,2)});document.getElementById('clear').addEventListener('click',()=>{result.textContent='Inactive by default'});</script></html>
