<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 11 Franchise Selection</title><style>body{background:#0a1727;color:#edf4ff;font:16px system-ui;max-width:680px;margin:auto;padding:20px}button,a{font:inherit}button{padding:14px;margin:8px 8px 8px 0;min-height:48px}a{color:#9bd0ff}section{border:1px solid #34506b;padding:16px;border-radius:12px;margin:20px 0}</style></head><body><a href="./phase11-roster-import.html">← Roster import</a><h1>Franchise source selection</h1><p>This experimental selection is isolated from the existing Front Office. It does not activate or replace any active franchise save.</p><section><p id="summary" role="status">Checking imported franchise…</p><button id="imported">Select imported franchise</button><button id="existing">Select existing franchise</button></section><a href="./app.html">Open existing Front Office</a><script src="./hlm-phase11-franchise-selection.browser.js"></script><script>(function(){const $=id=>document.getElementById(id),api=window.HLMPhase11Selection;function refresh(){try{const info=api.inspect(localStorage);$('summary').textContent=info.available?'Imported franchise: '+info.teams+' teams, '+info.players+' players. Preference: '+(info.selected?'imported':'existing'):'No imported franchise available.';$('imported').disabled=!info.available}catch(e){$('summary').textContent=e.message;$('imported').disabled=true}}for(const source of ['imported','existing'])$(source).onclick=()=>{if(!confirm('Save '+source+' as an experimental Phase 11 preference? Existing Front Office data will remain unchanged.'))return;try{api.select(localStorage,source,{confirm:true});refresh()}catch(e){$('summary').textContent=e.message}};refresh()})();</script></body></html>
