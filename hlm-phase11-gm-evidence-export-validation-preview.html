<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GM Evidence Export Validation</title><style>body{font:16px system-ui;max-width:40rem;margin:auto;padding:1rem}main{width:100%;box-sizing:border-box}textarea{box-sizing:border-box;width:100%;min-height:140px}button{min-height:48px;padding:.75rem}p{overflow-wrap:anywhere}</style><main><h1>Experimental evidence export validation</h1><p>Local example validation only. Production activation disabled. No save writes.</p><textarea id="data" aria-label="Experimental JSON review export">{"schemaVersion":1,"kind":"experimental-gm-review-evidence","productionActivationEnabled":false,"gameplayActionAuthorized":false,"persistent":false,"requiresGMApproval":true,"rows":[]}</textarea><button id="validate">Validate example</button><p id="result" aria-live="polite">Not validated. No gameplay action authorized.</p></main><script>document.querySelector('#validate').addEventListener('click',()=>{let valid=false;try{const p=JSON.parse(document.querySelector('#data').value);valid=p.schemaVersion===1&&p.kind==='experimental-gm-review-evidence'&&p.productionActivationEnabled===false&&p.gameplayActionAuthorized===false&&p.persistent===false&&p.requiresGMApproval===true&&Array.isArray(p.rows)&&p.rows.every(r=>Number.isSafeInteger(r.threshold)&&r.threshold>0&&typeof r.reviewed==='boolean'&&r.actionAuthorized===false)}catch{}document.querySelector('#result').textContent=(valid?'Example valid.':'Example invalid.')+' No gameplay action authorized. No save writes.'});</script></html>
