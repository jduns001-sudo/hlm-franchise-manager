<!doctype html><meta charset="utf-8"><title>Mission 924 explicit commit request error recovery durability</title><body><script>
'use strict';
const DB='hlm_phase11_m924_commit_error_recovery_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i)=>({store:s,id:i,group:i%3,code:s+'-'+i,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
function open(){const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{for(const s of STORES){const st=r.result.createObjectStore(s);st.createIndex('group','group');st.createIndex('code','code',{unique:true})}};return req(r)}
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
const expected=(s,i)=>i===0?{...value(s,0),payload:'committed-after-handled-error'}:value(s,i);
async function inspect(db){const tx=db.transaction(STORES,'readonly');const results=await Promise.all(STORES.map(async s=>{const st=tx.objectStore(s),[rows,keys,groups,uniqueKeys]=await Promise.all([req(st.getAll()),req(st.getAllKeys()),req(st.index('group').getAllKeys(IDBKeyRange.only(2))),req(st.index('code').getAllKeys(IDBKeyRange.only(s+'-1')))]);return {valid:JSON.stringify(rows)===JSON.stringify(Array.from({length:COUNT},(_,i)=>expected(s,i)))&&JSON.stringify(keys)===JSON.stringify([0,1,2,3,4,5])&&JSON.stringify(groups)===JSON.stringify([2,5])&&JSON.stringify(uniqueKeys)===JSON.stringify([1]),count:rows.length}}));return {valid:results.every(x=>x.valid),results}}
async function handledCommit(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');let errors=0;for(const s of STORES)tx.objectStore(s).put({...value(s,0),payload:'committed-after-handled-error'},0);const conflict=tx.objectStore('roster').add({...value('roster',6),code:'roster-1'},6);conflict.onerror=e=>{errors++;e.preventDefault();e.stopPropagation();tx.commit()};tx.oncomplete=()=>resolve({errors,committed:true});tx.onabort=()=>reject(tx.error||Error('unexpected abort'))})}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();try{await seed(db);mark('seeded',{version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else if(phase==='recover'){const db=await open();try{const attempt=await handledCommit(db),state=await inspect(db);mark(attempt.errors===1&&attempt.committed&&state.valid?'recovered':'failed',{...attempt,...state,version:db.version})}finally{db.close()}}else if(phase==='verify'){const db=await open();try{const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
