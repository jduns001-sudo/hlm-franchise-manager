<!doctype html><meta charset="utf-8"><title>Mission 908 read-your-writes abort durability</title><body><script>
'use strict';
const DB='hlm_phase11_m908_read_your_writes_abort_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i,rev=1)=>({store:s,id:i,group:i%3,revision:rev,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly'),keys=Array.from({length:COUNT},(_,i)=>i);const results=await Promise.all(STORES.map(async s=>{const store=tx.objectStore(s),[all,ids,groupZero]=await Promise.all([req(store.getAll()),req(store.getAllKeys()),req(store.index('group').count(IDBKeyRange.only(0)))]);return {valid:JSON.stringify(all)===JSON.stringify(keys.map(i=>value(s,i)))&&JSON.stringify(ids)===JSON.stringify(keys)&&groupZero===2,count:all.length,groupZero}}));return {valid:results.every(x=>x.valid),results}}
function readThenAbort(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');let observed=0,errors=[];tx.oncomplete=()=>reject(Error('unexpected commit'));tx.onabort=()=>resolve({aborted:true,observed,errors});for(const s of STORES){const store=tx.objectStore(s);store.put(value(s,2,2),2);store.add(value(s,6,2),6);const a=store.get(2),b=store.get(6),c=store.index('group').count(IDBKeyRange.only(0));a.onsuccess=()=>{if(JSON.stringify(a.result)===JSON.stringify(value(s,2,2)))observed++;else errors.push(s+':overwrite')};b.onsuccess=()=>{if(JSON.stringify(b.result)===JSON.stringify(value(s,6,2)))observed++;else errors.push(s+':new')};c.onsuccess=()=>{if(c.result===3)observed++;else errors.push(s+':index-count-'+c.result);if(observed===12&&errors.length===0)tx.abort()};for(const q of [a,b,c])q.onerror=()=>errors.push(s+':request-error')}})}
async function run(){const phase=new URLSearchParams(location.search).get('phase'),db=await open();try{if(phase==='seed'){await seed(db);const state=await inspect(db);mark(state.valid?'seeded':'failed',state)}else if(phase==='abort'){const before=await inspect(db);if(!before.valid)throw Error('baseline invalid');const reads=await readThenAbort(db),after=await inspect(db);mark(after.valid&&reads.aborted&&reads.observed===12&&reads.errors.length===0?'aborted':'failed',{...reads,fullValid:after.valid,results:after.results})}else if(phase==='verify'){const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,stores:Array.from(db.objectStoreNames).sort()})}else throw Error('unknown phase')}finally{db.close()}}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
