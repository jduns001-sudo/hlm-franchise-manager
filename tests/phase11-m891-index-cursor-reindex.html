<!doctype html><meta charset="utf-8"><title>Mission 891 index cursor update reindex durability</title><body><script>
'use strict';
const DB='hlm_phase11_m891_index_cursor_reindex_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=12,TARGET=[4,7];
const value=(s,i)=>({store:s,id:i,group:Math.floor(i/3),revision:1,payload:'franchise-'+s+'-'+i});
const changed=(s,i)=>({...value(s,i),group:4,revision:2,payload:'reindexed-'+s+'-'+i});
const expected=(s,i)=>TARGET.includes(i)?changed(s,i):value(s,i);
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db,updated){const tx=db.transaction(STORES,'readonly'),rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll()))),old=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll(IDBKeyRange.bound(1,2))))),moved=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll(IDBKeyRange.only(4)))));return {valid:STORES.every((s,j)=>{const vals=Array.from({length:COUNT},(_,i)=>updated?expected(s,i):value(s,i));return JSON.stringify(rows[j])===JSON.stringify(vals)&&JSON.stringify(old[j])===JSON.stringify(vals.filter(v=>v.group===1||v.group===2).sort((a,b)=>a.group-b.group||a.id-b.id))&&JSON.stringify(moved[j])===JSON.stringify(vals.filter(v=>v.group===4).sort((a,b)=>a.id-b.id))}),counts:rows.map(r=>r.length),oldCounts:old.map(r=>r.length),movedCounts:moved.map(r=>r.length)}}
function mutate(store,s){return new Promise((resolve,reject)=>{const touched=[],r=store.index('group').openCursor(IDBKeyRange.bound(1,2),'next');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){resolve(touched);return}const i=c.primaryKey;if(TARGET.includes(i)){const u=c.update(changed(s,i));u.onerror=()=>reject(u.error);u.onsuccess=()=>{touched.push({key:c.key,primaryKey:i,result:u.result});c.continue()}}else c.continue()}})}
async function update(db){const tx=db.transaction(STORES,'readwrite'),out={};const done=new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('update aborted'))});await Promise.all(STORES.map(async s=>{out[s]=await mutate(tx.objectStore(s),s)}));await done;return {touched:out,valid:STORES.every(s=>JSON.stringify(out[s])===JSON.stringify(TARGET.map(i=>({key:Math.floor(i/3),primaryKey:i,result:i}))))}}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();await seed(db);const state=await inspect(db,false);db.close();mark(state.valid?'seeded':'failed',state);return}if(phase==='update'){const db=await open(),before=await inspect(db,false);if(!before.valid)throw Error('baseline invalid');const result=await update(db),after=await inspect(db,true);db.close();mark(result.valid&&after.valid?'updated':'failed',{updateValid:result.valid,fullValid:after.valid,counts:after.counts,oldCounts:after.oldCounts,movedCounts:after.movedCounts,touched:result.touched});return}if(phase==='verify'){const db=await open(),state=await inspect(db,true),stores=Array.from(db.objectStoreNames).sort();db.close();mark(state.valid?'verified':'failed',{fullValid:state.valid,counts:state.counts,oldCounts:state.oldCounts,movedCounts:state.movedCounts,stores});return}throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
