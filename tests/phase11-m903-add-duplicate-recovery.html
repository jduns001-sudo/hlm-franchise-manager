<!doctype html><meta charset="utf-8"><title>Mission 903 duplicate add recovery durability</title><body><script>
'use strict';
const DB='hlm_phase11_m903_add_duplicate_recovery_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i)=>({store:s,id:i,group:i%3,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
const write=(db,fn)=>new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('aborted'));fn(tx)});
async function seed(db){await write(db,tx=>{for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i)})}
function recover(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');let errors=0,added=0;tx.oncomplete=()=>resolve({errors,added});tx.onabort=()=>reject(tx.error||Error('unexpected abort'));for(const s of STORES){const store=tx.objectStore(s),duplicate=store.add({...value(s,2),payload:'should-not-overwrite'},2);duplicate.onerror=e=>{if(duplicate.error?.name!=='ConstraintError'){reject(duplicate.error);return}e.preventDefault();errors++};const next=store.add(value(s,6),6);next.onsuccess=()=>added++;next.onerror=()=>reject(next.error)}})}
async function inspect(db,updated){const tx=db.transaction(STORES,'readonly'),keys=Array.from({length:updated?7:6},(_,i)=>i);const all=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll())));const ids=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAllKeys())));const indexes=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll())));const expected=s=>keys.map(i=>value(s,i));return {valid:STORES.every((s,j)=>JSON.stringify(all[j])===JSON.stringify(expected(s))&&JSON.stringify(ids[j])===JSON.stringify(keys)&&JSON.stringify(indexes[j])===JSON.stringify(expected(s).sort((a,b)=>a.group-b.group||a.id-b.id))),counts:all.map(x=>x.length),indexCounts:indexes.map(x=>x.length)}}
async function run(){const phase=new URLSearchParams(location.search).get('phase'),db=await open();try{if(phase==='seed'){await seed(db);const state=await inspect(db,false);mark(state.valid?'seeded':'failed',state)}else if(phase==='recover'){const before=await inspect(db,false);if(!before.valid)throw Error('baseline invalid');const result=await recover(db),after=await inspect(db,true);mark(after.valid&&result.errors===4&&result.added===4?'recovered':'failed',{...result,fullValid:after.valid,counts:after.counts,indexCounts:after.indexCounts})}else if(phase==='verify'){const state=await inspect(db,true);mark(state.valid?'verified':'failed',{...state,stores:Array.from(db.objectStoreNames).sort()})}else throw Error('unknown phase')}finally{db.close()}}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
