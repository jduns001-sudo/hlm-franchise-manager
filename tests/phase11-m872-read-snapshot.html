<!doctype html><meta charset="utf-8"><title>Mission 872 read snapshot consistency</title><script>
'use strict';
const DB='hlm_phase11_m872_read_snapshot_test_only',STORES=['roster','contracts','draftPicks','history'];
const value=(s,n)=>({store:s,revision:n,payload:'franchise-'+s+'-v'+n});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s));return req(r)};
const expected=n=>STORES.map(s=>value(s,n));
async function read(db){
 const tx=db.transaction(STORES,'readonly');
 return Promise.all(STORES.map(s=>req(tx.objectStore(s).get('snapshot'))));
}
async function seed(db){
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORES,'readwrite');
  STORES.forEach(s=>tx.objectStore(s).put(value(s,1),'snapshot'));
  tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'));
 });
}
async function concurrent(db){
 const oldTx=db.transaction(STORES,'readonly');
 const oldRequests=STORES.map(s=>req(oldTx.objectStore(s).get('snapshot')));
 const writer=db.transaction(STORES,'readwrite');
 STORES.forEach(s=>writer.objectStore(s).put(value(s,2),'snapshot'));
 const writerDone=new Promise((resolve,reject)=>{
  writer.oncomplete=()=>resolve(true);writer.onabort=()=>reject(writer.error||Error('writer aborted'));
 });
 const oldRows=await Promise.all(oldRequests);
 const oldComplete=await new Promise((resolve,reject)=>{
  oldTx.oncomplete=()=>resolve(true);oldTx.onabort=()=>reject(oldTx.error||Error('reader aborted'));
 });
 await writerDone;
 const newRows=await read(db);
 return {oldRows,newRows,oldComplete,writerComplete:true,oldConsistent:JSON.stringify(oldRows)===JSON.stringify(expected(1)),newConsistent:JSON.stringify(newRows)===JSON.stringify(expected(2))};
}
async function run(){
 const phase=new URLSearchParams(location.search).get('phase');
 if(phase==='seed'){
  const db=await open();await seed(db);const rows=await read(db);db.close();
  const baseline=JSON.stringify(rows)===JSON.stringify(expected(1));
  mark(baseline?'seeded':'failed',{baseline});return;
 }
 if(phase==='concurrent'){
  const db=await open();const before=await read(db);
  if(JSON.stringify(before)!==JSON.stringify(expected(1)))throw Error('baseline missing');
  const state=await concurrent(db);db.close();
  mark(state.oldConsistent&&state.newConsistent?'consistent':'failed',state);return;
 }
 if(phase==='verify'){
  const db=await open(),rows=await read(db),stores=Array.from(db.objectStoreNames).sort();db.close();
  const durable=JSON.stringify(rows)===JSON.stringify(expected(2));
  mark(durable?'verified':'failed',{durable,rows,stores});return;
 }
 throw Error('unknown phase');
}
run().catch(e=>mark('failed',{error:String(e)}));
</script>
