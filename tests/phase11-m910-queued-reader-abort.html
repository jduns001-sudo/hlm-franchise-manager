<!doctype html><meta charset="utf-8"><title>Mission 910 queued reader after writer abort durability</title><body><script>
'use strict';
const DB='hlm_phase11_m910_queued_reader_abort_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i,rev=1)=>({store:s,id:i,group:i%3,revision:rev,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly'),keys=Array.from({length:COUNT},(_,i)=>i);const results=await Promise.all(STORES.map(async s=>{const store=tx.objectStore(s),[all,ids]=await Promise.all([req(store.getAll()),req(store.getAllKeys())]);return {valid:JSON.stringify(all)===JSON.stringify(keys.map(i=>value(s,i)))&&JSON.stringify(ids)===JSON.stringify(keys),count:all.length}}));return {valid:results.every(x=>x.valid),results}}
function queueBehindAbortedWriter(db){return new Promise((resolve,reject)=>{const writer=db.transaction(STORES,'readwrite');let writes=0,observed=0,aborted=false,readerComplete=false;const errors=[];const finish=()=>{if(aborted&&readerComplete)resolve({writes,observed,aborted,errors})};writer.oncomplete=()=>reject(Error('unexpected writer commit'));writer.onabort=()=>{aborted=true;finish()};for(const s of STORES){const q=writer.objectStore(s).put(value(s,3,2),3);q.onsuccess=()=>{writes++;if(writes===4)writer.abort()}}const reader=db.transaction(STORES,'readonly');reader.onabort=()=>reject(reader.error||Error('reader aborted'));reader.oncomplete=()=>{readerComplete=true;finish()};for(const s of STORES){const q=reader.objectStore(s).get(3);q.onsuccess=()=>{if(JSON.stringify(q.result)===JSON.stringify(value(s,3)))observed++;else errors.push(s+':dirty-read')};q.onerror=()=>errors.push(s+':request-error')}})}
async function run(){const phase=new URLSearchParams(location.search).get('phase'),db=await open();try{if(phase==='seed'){await seed(db);const state=await inspect(db);mark(state.valid?'seeded':'failed',state)}else if(phase==='queue'){const before=await inspect(db);if(!before.valid)throw Error('baseline invalid');const queued=await queueBehindAbortedWriter(db),after=await inspect(db);mark(after.valid&&queued.writes===4&&queued.observed===4&&queued.aborted&&queued.errors.length===0?'queued':'failed',{...queued,fullValid:after.valid,results:after.results})}else if(phase==='verify'){const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,stores:Array.from(db.objectStoreNames).sort()})}else throw Error('unknown phase')}finally{db.close()}}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
