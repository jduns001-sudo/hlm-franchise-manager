<!doctype html><meta charset="utf-8"><title>Mission 922 explicit multi-store commit durability</title><body><script>
'use strict';
const DB='hlm_phase11_m922_explicit_commit_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i)=>({store:s,id:i,group:i%3,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
function open(version,upgrade){const r=indexedDB.open(DB,version);r.onupgradeneeded=()=>upgrade&&upgrade(r.result,r.transaction);return req(r)}
const create=db=>STORES.forEach(s=>db.createObjectStore(s).createIndex('group','group'));
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
const expected=(s,i)=>i===1?{...value(s,1),group:3}:value(s,i);
async function inspect(db){const tx=db.transaction(STORES,'readonly');const results=await Promise.all(STORES.map(async s=>{const st=tx.objectStore(s);const [rows,keys,moved,newRows]=await Promise.all([req(st.getAll()),req(st.getAllKeys()),req(st.index('group').getAllKeys(IDBKeyRange.only(3))),req(st.index('group').getAllKeys(IDBKeyRange.only(0)))]);return {valid:JSON.stringify(rows)===JSON.stringify(Array.from({length:COUNT+1},(_,i)=>expected(s,i)))&&JSON.stringify(keys)===JSON.stringify([0,1,2,3,4,5,6])&&JSON.stringify(moved)===JSON.stringify([1])&&JSON.stringify(newRows)===JSON.stringify([0,3,6]),count:rows.length}}));return {valid:results.every(x=>x.valid),results}}
async function commit(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES){const st=tx.objectStore(s);st.put({...value(s,1),group:3},1);st.add(value(s,6),6)}tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('explicit commit aborted'));tx.commit()})}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open(1,create);try{await seed(db);mark('seeded',{version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else if(phase==='commit'){const db=await open(1);try{await commit(db);const state=await inspect(db);mark(state.valid?'committed':'failed',{...state,version:db.version})}finally{db.close()}}else if(phase==='verify'){const db=await open(1);try{const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
