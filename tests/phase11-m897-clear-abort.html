<!doctype html><meta charset="utf-8"><title>Mission 897 clear abort durability</title><body><script>
'use strict';
const DB='hlm_phase11_m897_clear_abort_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=8;
const record=(s,i)=>({store:s,id:i,group:i%2,payload:'franchise-'+s+'-'+i});
const request=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return request(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(record(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed abort'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly');const all=await Promise.all(STORES.map(s=>request(tx.objectStore(s).getAll())));const keys=await Promise.all(STORES.map(s=>request(tx.objectStore(s).getAllKeys())));const indexes=await Promise.all(STORES.map(s=>request(tx.objectStore(s).index('group').getAll())));return {valid:STORES.every((s,j)=>JSON.stringify(all[j])===JSON.stringify(Array.from({length:COUNT},(_,i)=>record(s,i)))&&JSON.stringify(keys[j])===JSON.stringify(Array.from({length:COUNT},(_,i)=>i))&&indexes[j].length===COUNT&&indexes[j].every((v,i)=>JSON.stringify(v)===JSON.stringify(record(s,i%4*2+Math.floor(i/4))))),counts:all.map(a=>a.length),indexCounts:indexes.map(a=>a.length)}}
async function clearAbort(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');let cleared=0;tx.onerror=e=>{if(e.target.error)reject(e.target.error)};tx.oncomplete=()=>reject(Error('unexpected commit'));tx.onabort=()=>resolve({aborted:true,cleared});for(const s of STORES){const q=tx.objectStore(s).clear();q.onsuccess=()=>{cleared++;if(cleared===STORES.length)tx.abort()};q.onerror=()=>reject(q.error)}})}
async function run(){const phase=new URLSearchParams(location.search).get('phase'),db=await open();try{if(phase==='seed'){await seed(db);const state=await inspect(db);mark(state.valid?'seeded':'failed',state)}else if(phase==='rollback'){const before=await inspect(db);if(!before.valid)throw Error('baseline invalid');const result=await clearAbort(db),after=await inspect(db);mark(after.valid&&result.aborted&&result.cleared===4?'rolledback':'failed',{...result,fullValid:after.valid,counts:after.counts,indexCounts:after.indexCounts})}else if(phase==='verify'){const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,stores:Array.from(db.objectStoreNames).sort()})}else throw Error('unknown phase')}finally{db.close()}}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
