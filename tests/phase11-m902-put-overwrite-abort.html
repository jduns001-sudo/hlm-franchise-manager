<!doctype html><meta charset="utf-8"><title>Mission 902 put overwrite abort durability</title><body><script>
'use strict';
const DB='hlm_phase11_m902_put_overwrite_abort_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=10;
const value=(s,i,rev=1)=>({store:s,id:i,group:rev===2?(i+1)%3:i%3,revision:rev,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly'),keys=Array.from({length:COUNT},(_,i)=>i);const all=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll())));const ids=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAllKeys())));const indexes=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll())));const expected=s=>keys.map(i=>value(s,i));return {valid:STORES.every((s,j)=>JSON.stringify(all[j])===JSON.stringify(expected(s))&&JSON.stringify(ids[j])===JSON.stringify(keys)&&JSON.stringify(indexes[j])===JSON.stringify(expected(s).sort((a,b)=>a.group-b.group||a.id-b.id))),counts:all.map(x=>x.length),indexCounts:indexes.map(x=>x.length),revisions:all.map(rows=>rows.filter(x=>x.revision===2).length)}}
function rollback(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');let written=0;tx.oncomplete=()=>reject(Error('unexpected commit'));tx.onabort=()=>resolve({aborted:true,written});for(const s of STORES){const q=tx.objectStore(s).put(value(s,4,2),4);q.onsuccess=()=>{written++;if(written===STORES.length)tx.abort()};q.onerror=()=>reject(q.error)}})}
async function run(){const phase=new URLSearchParams(location.search).get('phase'),db=await open();try{if(phase==='seed'){await seed(db);const state=await inspect(db);mark(state.valid?'seeded':'failed',state)}else if(phase==='rollback'){const before=await inspect(db);if(!before.valid)throw Error('baseline invalid');const result=await rollback(db),after=await inspect(db);mark(after.valid&&result.aborted&&result.written===STORES.length?'rolledback':'failed',{...result,fullValid:after.valid,counts:after.counts,indexCounts:after.indexCounts,revisions:after.revisions})}else if(phase==='verify'){const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,stores:Array.from(db.objectStoreNames).sort()})}else throw Error('unknown phase')}finally{db.close()}}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
