<!doctype html><meta charset="utf-8"><title>Mission 893 cursor delete explicit abort durability</title><body><script>
'use strict';
const DB='hlm_phase11_m893_cursor_delete_abort_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=10;
const value=(s,i)=>({store:s,id:i,group:Math.floor(i/2),revision:1,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly'),rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll()))),indexed=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll())));return {valid:STORES.every((s,j)=>JSON.stringify(rows[j])===JSON.stringify(Array.from({length:COUNT},(_,i)=>value(s,i)))&&JSON.stringify(indexed[j])===JSON.stringify(Array.from({length:COUNT},(_,i)=>value(s,i)))),counts:rows.map(r=>r.length),indexCounts:indexed.map(r=>r.length)}}
function remove(store){return new Promise((resolve,reject)=>{const removed=[],r=store.index('group').openCursor(IDBKeyRange.only(2));r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){resolve(removed);return}const d=c.delete();d.onerror=()=>reject(d.error);d.onsuccess=()=>{removed.push(c.primaryKey);c.continue()}}})}
async function attempt(db){const tx=db.transaction(STORES,'readwrite'),out={};const done=new Promise((resolve,reject)=>{tx.oncomplete=()=>reject(Error('unexpected commit'));tx.onabort=()=>resolve({aborted:true,error:tx.error?.name||null})});await Promise.all(STORES.map(async s=>{out[s]=await remove(tx.objectStore(s))}));const queued=STORES.every(s=>JSON.stringify(out[s])===JSON.stringify([4,5]));if(!queued)throw Error('cursor delete traversal invalid');tx.abort();const result=await done;return {...result,queued,removed:out}}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();await seed(db);const state=await inspect(db);db.close();mark(state.valid?'seeded':'failed',state);return}if(phase==='rollback'){const db=await open(),before=await inspect(db);if(!before.valid)throw Error('baseline invalid');const result=await attempt(db),after=await inspect(db);db.close();mark(result.aborted&&result.queued&&after.valid?'rolledback':'failed',{...result,fullValid:after.valid,counts:after.counts,indexCounts:after.indexCounts});return}if(phase==='verify'){const db=await open(),state=await inspect(db),stores=Array.from(db.objectStoreNames).sort();db.close();mark(state.valid?'verified':'failed',{fullValid:state.valid,counts:state.counts,indexCounts:state.indexCounts,stores});return}throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
