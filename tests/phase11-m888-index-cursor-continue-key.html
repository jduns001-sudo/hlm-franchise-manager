<!doctype html><meta charset="utf-8"><title>Mission 888 index cursor continue(key) durability</title><body><script>
'use strict';
const DB='hlm_phase11_m888_index_cursor_continue_key_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=12;
const value=(s,i)=>({store:s,id:i,group:Math.floor(i/3),revision:1,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function full(db){const tx=db.transaction(STORES,'readonly'),rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll())));return {valid:STORES.every((s,j)=>rows[j].length===COUNT&&rows[j].every((v,i)=>JSON.stringify(v)===JSON.stringify(value(s,i)))),counts:rows.map(r=>r.length)}}
function scan(index,range,mode){return new Promise((resolve,reject)=>{const result=[],r=index.openCursor(range,'next');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){resolve(result);return}result.push({key:c.key,primaryKey:c.primaryKey,value:c.value});if(mode==='all'&&result.length===1)c.continue(2);else if(mode==='all'&&result.length===3)c.continue(3);else if(mode==='bounded'&&result.length===1)c.continue(3);else c.continue()}})}
async function inspect(db){const tx=db.transaction(STORES,'readonly'),found={};await Promise.all(STORES.map(async s=>{const idx=tx.objectStore(s).index('group');const [all,bounded,missing]=await Promise.all([scan(idx,undefined,'all'),scan(idx,IDBKeyRange.bound(1,3),'bounded'),scan(idx,IDBKeyRange.only(99),'all')]);found[s]={all,bounded,missing}}));return {found,valid:STORES.every(s=>{const row=i=>({key:Math.floor(i/3),primaryKey:i,value:value(s,i)});return JSON.stringify(found[s])===JSON.stringify({all:[0,6,7,9,10,11].map(row),bounded:[3,9,10,11].map(row),missing:[]})})}}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();await seed(db);const state=await full(db);db.close();mark(state.valid?'seeded':'failed',state);return}if(phase==='scan'){const db=await open(),before=await full(db);if(!before.valid)throw Error('baseline invalid');const result=await inspect(db),after=await full(db);db.close();mark(result.valid&&after.valid?'scanned':'failed',{scanValid:result.valid,fullValid:after.valid,found:result.found,counts:after.counts});return}if(phase==='verify'){const db=await open(),state=await full(db),result=await inspect(db),stores=Array.from(db.objectStoreNames).sort();db.close();mark(state.valid&&result.valid?'verified':'failed',{fullValid:state.valid,scanValid:result.valid,counts:state.counts,stores});return}throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
