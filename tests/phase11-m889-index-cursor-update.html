<!doctype html><meta charset="utf-8"><title>Mission 889 indexed cursor update durability</title><body><script>
'use strict';
const DB='hlm_phase11_m889_index_cursor_update_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=12;
const value=(s,i)=>({store:s,id:i,group:Math.floor(i/3),revision:1,payload:'franchise-'+s+'-'+i});
const changed=(s,i)=>({...value(s,i),revision:2,payload:'updated-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
const expected=(s,i)=>i===4||i===7?changed(s,i):value(s,i);
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function full(db,updated){const tx=db.transaction(STORES,'readonly'),rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll())));return {valid:STORES.every((s,j)=>rows[j].length===COUNT&&rows[j].every((v,i)=>JSON.stringify(v)===JSON.stringify(updated?expected(s,i):value(s,i)))),counts:rows.map(r=>r.length)}}
function mutate(store,s){return new Promise((resolve,reject)=>{const updated=[],r=store.index('group').openCursor(IDBKeyRange.bound(1,2),'next');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){resolve(updated);return}const i=c.primaryKey;if(i===4||i===7){const v=changed(s,i),u=c.update(v);u.onerror=()=>reject(u.error);u.onsuccess=()=>{updated.push({key:c.key,primaryKey:i,value:u.result});c.continue()}}else c.continue()}})}
async function update(db){const tx=db.transaction(STORES,'readwrite'),out={};const done=new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('update aborted'))});const results=await Promise.all(STORES.map(async s=>{out[s]=await mutate(tx.objectStore(s),s)}));await done;return {updated:out,valid:results.every((_,j)=>JSON.stringify(out[STORES[j]])===JSON.stringify([4,7].map(i=>({key:Math.floor(i/3),primaryKey:i,value:i}))))}}
async function inspect(db){const state=await full(db,true),tx=db.transaction(STORES,'readonly');const indices=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll(IDBKeyRange.bound(1,2)))));return {valid:state.valid&&STORES.every((s,j)=>JSON.stringify(indices[j])===JSON.stringify([3,4,5,6,7,8].map(i=>expected(s,i)))),counts:state.counts}}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();await seed(db);const state=await full(db,false);db.close();mark(state.valid?'seeded':'failed',state);return}if(phase==='update'){const db=await open(),before=await full(db,false);if(!before.valid)throw Error('baseline invalid');const changedRows=await update(db),after=await inspect(db);db.close();mark(changedRows.valid&&after.valid?'updated':'failed',{updateValid:changedRows.valid,fullValid:after.valid,counts:after.counts,updated:changedRows.updated});return}if(phase==='verify'){const db=await open(),state=await inspect(db),stores=Array.from(db.objectStoreNames).sort();db.close();mark(state.valid?'verified':'failed',{fullValid:state.valid,counts:state.counts,stores});return}throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
