<!doctype html><meta charset="utf-8"><title>Mission 865 explicit abort durability</title><script>
'use strict';
const NAME='hlm_phase11_m865_explicit_abort_test_only';
const STORES=['roster','contracts','draftPicks','history'];
const value=(store,revision)=>({store,revision,payload:store+'-'+revision});
const request=req=>new Promise((resolve,reject)=>{req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});
const status=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
async function open(){
 const req=indexedDB.open(NAME,1);
 req.onupgradeneeded=()=>STORES.forEach(s=>req.result.createObjectStore(s));
 return request(req);
}
function seed(db){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORES,'readwrite');
  STORES.forEach(s=>tx.objectStore(s).put(value(s,1),'snapshot'));
  tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error||Error('seed aborted'));
 });
}
async function inspect(db){
 const tx=db.transaction(STORES,'readonly');
 const rows=await Promise.all(STORES.map(s=>request(tx.objectStore(s).get('snapshot'))));
 const candidates=await Promise.all(STORES.map(s=>request(db.transaction(s,'readonly').objectStore(s).get('candidate'))));
 return {retained:STORES.every((s,i)=>JSON.stringify(rows[i])===JSON.stringify(value(s,1))),noCandidate:candidates.every(v=>v===undefined),stores:STORES};
}
async function run(){
 const phase=new URLSearchParams(location.search).get('phase');
 const db=await open();
 if(phase==='seed'){
  await seed(db);const details=await inspect(db);db.close();
  status(details.retained&&details.noCandidate?'seeded':'failed',details);return;
 }
 if(phase==='abort'){
  const before=await inspect(db);if(!before.retained||!before.noCandidate)throw Error('seed absent');
  const tx=db.transaction(STORES,'readwrite');
  let succeeded=0,completed=false,abortCalled=false;
  tx.oncomplete=()=>{completed=true;status('failed',{error:'candidate committed'})};
  tx.onerror=()=>{};
  tx.onabort=async()=>{
   try{
    const after=await inspect(db);db.close();
    status(succeeded===STORES.length*2&&abortCalled&&!completed&&after.retained&&after.noCandidate?'aborted':'failed',
      {...after,succeeded,abortCalled,completed});
   }catch(e){status('failed',{error:String(e)})}
  };
  for(const s of STORES){
   for(const key of ['snapshot','candidate']){
    const req=tx.objectStore(s).put(value(s,2),key);
    req.onsuccess=()=>{
     succeeded++;
     if(succeeded===STORES.length*2){
      abortCalled=true;
      tx.abort();
     }
    };
    req.onerror=()=>status('failed',{error:String(req.error)});
   }
  }
  return;
 }
 if(phase==='verify'){
  const details=await inspect(db);db.close();
  status(details.retained&&details.noCandidate?'verified':'failed',details);return;
 }
 throw Error('unknown phase');
}
run().catch(e=>status('failed',{error:String(e)}));
</script>
