<!doctype html><meta charset="utf-8"><title>Mission 898 clear commit durability</title><body><script>
'use strict';
const DB='hlm_phase11_m898_clear_commit_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=8;
const record=(s,i,revision=1)=>({store:s,id:i,group:i%2,revision,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
const transaction=(db,fn)=>new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');tx.oncomplete=()=>resolve();tx.onabort=()=>reject(tx.error||Error('aborted'));fn(tx)});
async function seed(db){await transaction(db,tx=>{for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(record(s,i),i)})}
async function inspect(db,mode){const tx=db.transaction(STORES,'readonly');const all=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll())));const keys=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAllKeys())));const indexes=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll())));const expected=mode==='seed'?Array.from({length:COUNT},(_,i)=>i):[2,5];return {valid:STORES.every((s,j)=>JSON.stringify(all[j])===JSON.stringify(expected.map(i=>record(s,i,mode==='seed'?1:2)))&&JSON.stringify(keys[j])===JSON.stringify(expected)&&JSON.stringify(indexes[j])===JSON.stringify(expected.map(i=>record(s,i,mode==='seed'?1:2)).sort((a,b)=>a.group-b.group||a.id-b.id))),counts:all.map(x=>x.length),indexCounts:indexes.map(x=>x.length),keys}}
async function replace(db){await transaction(db,tx=>{for(const s of STORES){const store=tx.objectStore(s);store.clear();for(const i of [2,5])store.put(record(s,i,2),i)}})}
async function run(){const phase=new URLSearchParams(location.search).get('phase'),db=await open();try{if(phase==='seed'){await seed(db);const state=await inspect(db,'seed');mark(state.valid?'seeded':'failed',state)}else if(phase==='replace'){const before=await inspect(db,'seed');if(!before.valid)throw Error('baseline invalid');await replace(db);const after=await inspect(db,'replace');mark(after.valid?'replaced':'failed',after)}else if(phase==='verify'){const state=await inspect(db,'replace');mark(state.valid?'verified':'failed',{...state,stores:Array.from(db.objectStoreNames).sort()})}else throw Error('unknown phase')}finally{db.close()}}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
