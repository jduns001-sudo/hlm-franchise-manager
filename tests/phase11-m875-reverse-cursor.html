<!doctype html><meta charset="utf-8"><title>Mission 875 reverse cursor durability</title><body><script>
'use strict';
const DB='hlm_phase11_m875_reverse_cursor_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=12;
const value=(s,i)=>({store:s,id:i,revision:1,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s));return req(r)};
async function seed(db){
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORES,'readwrite');
  for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);
  tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'));
 });
}
async function full(db){
 const tx=db.transaction(STORES,'readonly');
 const rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll())));
 return {valid:STORES.every((s,j)=>rows[j].length===COUNT&&rows[j].every((v,i)=>JSON.stringify(v)===JSON.stringify(value(s,i)))),counts:rows.map(r=>r.length)};
}
async function reverse(db){
 return new Promise((resolve,reject)=>{
  const tx=db.transaction(STORES,'readonly'),found={};
  for(const s of STORES){
   found[s]=[];
   const request=tx.objectStore(s).openCursor(null,'prev');
   request.onsuccess=()=>{const cursor=request.result;if(!cursor)return;found[s].push({key:cursor.key,value:cursor.value});cursor.continue()};
   request.onerror=()=>reject(request.error);
  }
  tx.oncomplete=()=>resolve({found,valid:STORES.every(s=>JSON.stringify(found[s])===JSON.stringify(Array.from({length:COUNT},(_,j)=>COUNT-1-j).map(i=>({key:i,value:value(s,i)}))))});
  tx.onabort=()=>reject(tx.error||Error('reverse transaction aborted'));
 });
}
async function run(){
 const phase=new URLSearchParams(location.search).get('phase');
 if(phase==='seed'){
  const db=await open();await seed(db);const state=await full(db);db.close();mark(state.valid?'seeded':'failed',state);return;
 }
 if(phase==='reverse'){
  const db=await open(),before=await full(db);
  if(!before.valid)throw Error('baseline invalid');
  const reversed=await reverse(db),after=await full(db);db.close();
  mark(reversed.valid&&after.valid?'reversed':'failed',{reverseValid:reversed.valid,fullValid:after.valid,found:reversed.found,counts:after.counts});return;
 }
 if(phase==='verify'){
  const db=await open(),state=await full(db),reversed=await reverse(db),stores=Array.from(db.objectStoreNames).sort();db.close();
  mark(state.valid&&reversed.valid?'verified':'failed',{fullValid:state.valid,reverseValid:reversed.valid,counts:state.counts,stores});return;
 }
 throw Error('unknown phase');
}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
