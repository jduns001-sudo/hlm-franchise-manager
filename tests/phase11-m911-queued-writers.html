<!doctype html><meta charset="utf-8"><title>Mission 911 queued writer serialization durability</title><body><script>
'use strict';
const DB='hlm_phase11_m911_queued_writer_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i,rev=1)=>({store:s,id:i,group:i%3,revision:rev,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly'),keys=Array.from({length:COUNT},(_,i)=>i);const results=await Promise.all(STORES.map(async s=>{const store=tx.objectStore(s),[all,ids]=await Promise.all([req(store.getAll()),req(store.getAllKeys())]);return {valid:JSON.stringify(all)===JSON.stringify(keys.map(i=>value(s,i,i===3?3:1)))&&JSON.stringify(ids)===JSON.stringify(keys),count:all.length}}));return {valid:results.every(x=>x.valid),results}}
function queueWriters(db){return new Promise((resolve,reject)=>{const first=db.transaction(STORES,'readwrite');let firstWrites=0,secondReads=0,secondWrites=0,firstComplete=false;const errors=[];first.oncomplete=()=>{firstComplete=true};first.onabort=()=>reject(first.error||Error('first writer aborted'));for(const s of STORES){const q=first.objectStore(s).put(value(s,3,2),3);q.onsuccess=()=>firstWrites++}
const second=db.transaction(STORES,'readwrite');second.onabort=()=>reject(second.error||Error('second writer aborted'));second.oncomplete=()=>resolve({firstWrites,secondReads,secondWrites,firstComplete,errors});for(const s of STORES){const store=second.objectStore(s),q=store.get(3);q.onsuccess=()=>{if(JSON.stringify(q.result)===JSON.stringify(value(s,3,2))&&firstComplete)secondReads++;else errors.push(s+':serialization');const update=store.put(value(s,3,3),3);update.onsuccess=()=>secondWrites++;update.onerror=()=>errors.push(s+':write-error')};q.onerror=()=>errors.push(s+':read-error')}})}
async function run(){const phase=new URLSearchParams(location.search).get('phase'),db=await open();try{if(phase==='seed'){await seed(db);const tx=db.transaction(STORES,'readonly');const counts=await Promise.all(STORES.map(s=>req(tx.objectStore(s).count())));mark(counts.every(n=>n===COUNT)?'seeded':'failed',{counts})}else if(phase==='queue'){const queued=await queueWriters(db),after=await inspect(db);mark(after.valid&&queued.firstWrites===4&&queued.secondReads===4&&queued.secondWrites===4&&queued.firstComplete&&queued.errors.length===0?'queued':'failed',{...queued,fullValid:after.valid,results:after.results})}else if(phase==='verify'){const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,stores:Array.from(db.objectStoreNames).sort()})}else throw Error('unknown phase')}finally{db.close()}}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
