<!doctype html><meta charset="utf-8"><title>Mission 928 committed store deletion durability</title><body><script>
'use strict';
const DB='hlm_phase11_m928_committed_store_deletion_test_only',STORES=['roster','contracts','draftPicks','history'],REMAIN=['roster','contracts','history'],COUNT=8;
const value=(s,i)=>({store:s,id:i,group:i%4,revision:i%2,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
function open(version,upgrade){const r=indexedDB.open(DB,version);r.onupgradeneeded=()=>upgrade&&upgrade(r.result,r.transaction);return req(r)}
const create=db=>STORES.forEach(s=>{const st=db.createObjectStore(s);st.createIndex('group','group');st.createIndex('revision','revision')});
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const stores=Array.from(db.objectStoreNames).sort();const tx=db.transaction(REMAIN,'readonly');const results=await Promise.all(REMAIN.map(async s=>{const st=tx.objectStore(s);const [rows,keys,groups,revisions]=await Promise.all([req(st.getAll()),req(st.getAllKeys()),req(st.index('group').getAllKeys(IDBKeyRange.only(2))),req(st.index('revision').getAllKeys(IDBKeyRange.only(1)))]);const indexes=Array.from(st.indexNames).sort();return {valid:JSON.stringify(rows)===JSON.stringify(Array.from({length:COUNT},(_,i)=>value(s,i)))&&JSON.stringify(keys)===JSON.stringify([0,1,2,3,4,5,6,7])&&JSON.stringify(groups)===JSON.stringify([2,6])&&JSON.stringify(revisions)===JSON.stringify([1,3,5,7])&&JSON.stringify(indexes)===JSON.stringify(['group','revision']),indexes}}));let removed=false;try{db.transaction('draftPicks','readonly')}catch(e){removed=e.name==='NotFoundError'}return {valid:removed&&results.every(x=>x.valid)&&JSON.stringify(stores)===JSON.stringify(['contracts','history','roster']),removed,stores,results}}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open(1,create);try{await seed(db);mark('seeded',{version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else if(phase==='delete'){const db=await open(2,d=>d.deleteObjectStore('draftPicks'));try{const state=await inspect(db);mark(state.valid&&db.version===2?'deleted':'failed',{...state,version:db.version})}finally{db.close()}}else if(phase==='verify'){const db=await open(2);try{const state=await inspect(db);mark(state.valid&&db.version===2?'verified':'failed',{...state,version:db.version})}finally{db.close()}}else throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
