<!doctype html><meta charset="utf-8"><title>Mission 926 aborted transaction late write rejection durability</title><body><script>
'use strict';
const DB='hlm_phase11_m926_aborted_transaction_late_write_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i)=>({store:s,id:i,group:i%3,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
function open(){const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)}
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly');const results=await Promise.all(STORES.map(async s=>{const st=tx.objectStore(s),[rows,keys,groups]=await Promise.all([req(st.getAll()),req(st.getAllKeys()),req(st.index('group').getAllKeys(IDBKeyRange.only(2)))]);return {valid:JSON.stringify(rows)===JSON.stringify(Array.from({length:COUNT},(_,i)=>value(s,i)))&&JSON.stringify(keys)===JSON.stringify([0,1,2,3,4,5])&&JSON.stringify(groups)===JSON.stringify([2,5]),count:rows.length}}));return {valid:results.every(x=>x.valid),results}}
async function abortAttempt(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)tx.objectStore(s).put({...value(s,0),payload:'should-roll-back'},0);tx.oncomplete=()=>reject(Error('aborted transaction unexpectedly committed'));tx.onabort=()=>{let rejected=0;for(const s of STORES){try{tx.objectStore(s).put({...value(s,1),payload:'late-write'},1)}catch(e){if(e.name==='InvalidStateError'||e.name==='TransactionInactiveError')rejected++}}resolve({aborted:true,rejected})};tx.abort()})}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();try{await seed(db);mark('seeded',{version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else if(phase==='abort'){const db=await open();try{const attempt=await abortAttempt(db),state=await inspect(db);mark(attempt.aborted&&attempt.rejected===4&&state.valid?'aborted':'failed',{...attempt,...state,version:db.version})}finally{db.close()}}else if(phase==='verify'){const db=await open();try{const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
