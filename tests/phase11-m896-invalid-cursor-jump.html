<!doctype html><meta charset="utf-8"><title>Mission 896 invalid cursor jump recovery durability</title><body><script>
'use strict';
const DB='hlm_phase11_m896_invalid_jump_recovery_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=9;
const value=(s,i,rev=1)=>({store:s,id:i,group:Math.floor(i/3),revision:rev,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db,rev){const tx=db.transaction(STORES,'readonly'),rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll()))),indexed=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll())));return {valid:STORES.every((s,j)=>JSON.stringify(rows[j])===JSON.stringify(Array.from({length:COUNT},(_,i)=>value(s,i,i===0?rev:1)))&&JSON.stringify(indexed[j])===JSON.stringify(Array.from({length:COUNT},(_,i)=>value(s,i,i===0?rev:1)))),counts:rows.map(r=>r.length),indexCounts:indexed.map(r=>r.length)}}
function mutate(db){return new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite'),errors={},updated=[];tx.onerror=()=>reject(tx.error||Error('transaction error'));tx.onabort=()=>reject(tx.error||Error('unexpected abort'));tx.oncomplete=()=>resolve({committed:true,errors,updated});for(const s of STORES){const r=tx.objectStore(s).index('group').openCursor();r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){reject(Error('missing cursor'));return}try{c.continuePrimaryKey(c.key,c.primaryKey);reject(Error('invalid jump accepted'));return}catch(e){if(e.name!=='DataError'){reject(e);return}errors[s]=e.name}const u=c.update(value(s,0,2));u.onerror=()=>reject(u.error);u.onsuccess=()=>updated.push(s)}}})}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();await seed(db);const state=await inspect(db,1);db.close();mark(state.valid?'seeded':'failed',state);return}if(phase==='mutate'){const db=await open(),before=await inspect(db,1);if(!before.valid)throw Error('baseline invalid');const result=await mutate(db),after=await inspect(db,2);db.close();mark(after.valid&&result.updated.length===STORES.length&&Object.values(result.errors).every(x=>x==='DataError')&&Object.keys(result.errors).length===STORES.length?'committed':'failed',{...result,fullValid:after.valid,counts:after.counts,indexCounts:after.indexCounts});return}if(phase==='verify'){const db=await open(),state=await inspect(db,2),stores=Array.from(db.objectStoreNames).sort();db.close();mark(state.valid?'verified':'failed',{...state,stores});return}throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
