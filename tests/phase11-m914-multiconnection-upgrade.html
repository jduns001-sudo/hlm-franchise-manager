<!doctype html><meta charset="utf-8"><title>Mission 914 multi-connection versionchange durability</title><body><script>
'use strict';
const DB='hlm_phase11_m914_multiconnection_upgrade_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=6;
const value=(s,i)=>({store:s,id:i,group:i%3,revision:i%2,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details)=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
function open(version,upgrade){const r=indexedDB.open(DB,version);r.onupgradeneeded=()=>upgrade&&upgrade(r.result,r.transaction);return req(r)}
const create=db=>STORES.forEach(s=>db.createObjectStore(s).createIndex('group','group'));
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).add(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db){const tx=db.transaction(STORES,'readonly');const results=await Promise.all(STORES.map(async s=>{const store=tx.objectStore(s);const [rows,keys,revisions]=await Promise.all([req(store.getAll()),req(store.getAllKeys()),req(store.index('revision').getAllKeys(IDBKeyRange.only(1)))]);return {valid:JSON.stringify(rows)===JSON.stringify(Array.from({length:COUNT},(_,i)=>value(s,i)))&&JSON.stringify(keys)===JSON.stringify([0,1,2,3,4,5])&&JSON.stringify(revisions)===JSON.stringify([1,3,5]),indexes:Array.from(store.indexNames).sort()}}));return {valid:results.every(x=>x.valid&&JSON.stringify(x.indexes)===JSON.stringify(['group','revision'])),results}}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open(1,create);try{await seed(db);mark('seeded',{version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else if(phase==='upgrade'){const first=await open(1),second=await open(1);let versionchanges=0,blocked=false;first.onversionchange=()=>{versionchanges++;first.close()};second.onversionchange=()=>{versionchanges++;second.close()};try{const request=indexedDB.open(DB,2);request.onblocked=()=>{blocked=true};request.onupgradeneeded=()=>{for(const s of STORES)request.transaction.objectStore(s).createIndex('revision','revision')};const upgraded=await req(request);try{const state=await inspect(upgraded);mark(state.valid&&versionchanges===2&&!blocked?'upgraded':'failed',{...state,versionchanges,blocked,version:upgraded.version})}finally{upgraded.close()}}finally{first.close();second.close()}}else if(phase==='verify'){const db=await open(2);try{const state=await inspect(db);mark(state.valid?'verified':'failed',{...state,version:db.version,stores:Array.from(db.objectStoreNames).sort()})}finally{db.close()}}else throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
