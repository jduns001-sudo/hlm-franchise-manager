<!doctype html><meta charset="utf-8"><title>Mission 870 unique constraint rollback</title><script>
'use strict';
const DB='hlm_phase11_m870_unique_rollback_test_only',STORES=['roster','contracts','draftPicks','history'];
const value=(s,n)=>({store:s,revision:n,payload:'franchise-'+s+'-v'+n,uniqueCode:s+'-baseline'});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>{const store=r.result.createObjectStore(s);if(s==='roster')store.createIndex('uniqueCode','uniqueCode',{unique:true})});return req(r)};
async function read(db){
 const tx=db.transaction(STORES,'readonly');
 const rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).get('snapshot'))));
 const unexpected=await req(tx.objectStore('roster').get('duplicate'));
 return {baseline:STORES.every((s,i)=>JSON.stringify(rows[i])===JSON.stringify(value(s,1))),rows,unexpected};
}
async function seed(db){
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(STORES,'readwrite');STORES.forEach(s=>tx.objectStore(s).put(value(s,1),'snapshot'));
  tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed abort'));
 });
}
async function run(){
 const phase=new URLSearchParams(location.search).get('phase');
 if(phase==='seed'){
  const db=await open();await seed(db);const state=await read(db);db.close();
  mark(state.baseline?'seeded':'failed',{baseline:state.baseline});return;
 }
 if(phase==='abort'){
  const db=await open(),before=await read(db);
  if(!before.baseline)throw Error('missing baseline');
  const outcome=await new Promise((resolve,reject)=>{
   const tx=db.transaction(STORES,'readwrite');
   STORES.forEach(s=>tx.objectStore(s).put(value(s,2),'snapshot'));
   tx.objectStore('roster').add({...value('roster',2),uniqueCode:'roster-baseline'},'duplicate');
   tx.onabort=()=>resolve({aborted:true,error:tx.error?.name});
   tx.oncomplete=()=>resolve({aborted:false});
   tx.onerror=()=>{};
  });
  const after=await read(db);db.close();
  const ok=outcome.aborted&&outcome.error==='ConstraintError'&&after.baseline&&after.unexpected===undefined;
  mark(ok?'aborted':'failed',{...outcome,baseline:after.baseline,duplicateAbsent:after.unexpected===undefined});return;
 }
 if(phase==='verify'){
  const db=await open(),state=await read(db),names=Array.from(db.objectStoreNames).sort();db.close();
  const ok=state.baseline&&state.unexpected===undefined;
  mark(ok?'verified':'failed',{baseline:state.baseline,duplicateAbsent:state.unexpected===undefined,rows:state.rows,stores:names});return;
 }
 throw Error('unknown phase');
}
run().catch(e=>mark('failed',{error:String(e)}));
</script>
