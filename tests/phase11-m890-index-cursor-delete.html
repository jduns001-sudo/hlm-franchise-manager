<!doctype html><meta charset="utf-8"><title>Mission 890 indexed cursor delete durability</title><body><script>
'use strict';
const DB='hlm_phase11_m890_index_cursor_delete_test_only',STORES=['roster','contracts','draftPicks','history'],COUNT=12,TARGET=[4,7];
const value=(s,i)=>({store:s,id:i,group:Math.floor(i/3),revision:1,payload:'franchise-'+s+'-'+i});
const req=r=>new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const mark=(stage,details={})=>{document.body.dataset.stage=stage;document.body.dataset.details=JSON.stringify(details)};
const open=()=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>STORES.forEach(s=>r.result.createObjectStore(s).createIndex('group','group'));return req(r)};
async function seed(db){await new Promise((resolve,reject)=>{const tx=db.transaction(STORES,'readwrite');for(const s of STORES)for(let i=0;i<COUNT;i++)tx.objectStore(s).put(value(s,i),i);tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('seed aborted'))})}
async function inspect(db,deleted){const tx=db.transaction(STORES,'readonly'),rows=await Promise.all(STORES.map(s=>req(tx.objectStore(s).getAll()))),indexed=await Promise.all(STORES.map(s=>req(tx.objectStore(s).index('group').getAll(IDBKeyRange.bound(1,2)))));return {valid:STORES.every((s,j)=>{const ids=Array.from({length:COUNT},(_,i)=>i).filter(i=>!deleted||!TARGET.includes(i));return JSON.stringify(rows[j])===JSON.stringify(ids.map(i=>value(s,i)))&&JSON.stringify(indexed[j])===JSON.stringify(ids.filter(i=>i>=3&&i<=8).map(i=>value(s,i)))}),counts:rows.map(r=>r.length),indexCounts:indexed.map(r=>r.length)}}
function remove(store){return new Promise((resolve,reject)=>{const deleted=[],r=store.index('group').openCursor(IDBKeyRange.bound(1,2),'next');r.onerror=()=>reject(r.error);r.onsuccess=()=>{const c=r.result;if(!c){resolve(deleted);return}const i=c.primaryKey;if(TARGET.includes(i)){const d=c.delete();d.onerror=()=>reject(d.error);d.onsuccess=()=>{deleted.push({key:c.key,primaryKey:i});c.continue()}}else c.continue()}})}
async function deleteRows(db){const tx=db.transaction(STORES,'readwrite'),out={};const done=new Promise((resolve,reject)=>{tx.oncomplete=resolve;tx.onabort=()=>reject(tx.error||Error('delete aborted'))});await Promise.all(STORES.map(async s=>{out[s]=await remove(tx.objectStore(s))}));await done;return {deleted:out,valid:STORES.every(s=>JSON.stringify(out[s])===JSON.stringify(TARGET.map(i=>({key:Math.floor(i/3),primaryKey:i}))))}}
async function run(){const phase=new URLSearchParams(location.search).get('phase');if(phase==='seed'){const db=await open();await seed(db);const state=await inspect(db,false);db.close();mark(state.valid?'seeded':'failed',state);return}if(phase==='delete'){const db=await open(),before=await inspect(db,false);if(!before.valid)throw Error('baseline invalid');const result=await deleteRows(db),after=await inspect(db,true);db.close();mark(result.valid&&after.valid?'deleted':'failed',{deleteValid:result.valid,fullValid:after.valid,counts:after.counts,indexCounts:after.indexCounts,deleted:result.deleted});return}if(phase==='verify'){const db=await open(),state=await inspect(db,true),stores=Array.from(db.objectStoreNames).sort();db.close();mark(state.valid?'verified':'failed',{fullValid:state.valid,counts:state.counts,indexCounts:state.indexCounts,stores});return}throw Error('unknown phase')}
run().catch(e=>mark('failed',{error:String(e)}));
</script></body>
