<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 11 Experimental Activation Controls</title><style>body{font:16px system-ui,sans-serif;line-height:1.5;background:#0a1727;color:#edf4ff;max-width:720px;margin:auto;padding:16px}section{border:1px solid #34506b;border-radius:12px;padding:16px;margin:16px 0;background:#152b43}button{font:inherit;min-height:48px;border:0;border-radius:8px;background:#2872d9;color:#fff;padding:12px;margin:8px 8px 8px 0}button:disabled{opacity:.5}a{color:#9bd0ff}#status{overflow-wrap:anywhere}</style></head><body><a href="./phase11-franchise-selection.html">← Franchise selection</a><h1>🏒 Experimental activation controls</h1><p>This experimental tool changes only isolated Phase 11 activation metadata. It does not switch the live Front Office, overwrite existing saves or modify app.html.</p><section><h2>Current status</h2><p id="summary" role="status">Loading…</p><p id="roster"></p></section><section><h2>GM controls</h2><button id="activate">Authorize experimental activation</button><button id="rollback">Authorize rollback</button><button id="recover">Recover interrupted activation</button><p id="status" role="status" aria-live="polite"></p></section><script src="./hlm-phase11-browser-activation.js"></script><script>(function(){'use strict';const api=window.HLMPhase11Activation,$=id=>document.getElementById(id);function refresh(){try{const state=api.inspect(localStorage);$('summary').textContent='Experimental source: '+state.active+'; backup: '+(state.backupExists?'yes':'no')+'; interrupted operation: '+(state.recoveryRequired?'YES':'no');$('activate').disabled=state.backupExists||state.recoveryRequired;$('rollback').disabled=!state.backupExists;$('recover').disabled=!state.recoveryRequired;try{const roster=api.imported(localStorage);$('roster').textContent='Imported roster: '+roster.teams+' teams, '+roster.players+' players'}catch(e){$('roster').textContent=e.message;$('activate').disabled=true}}catch(e){$('summary').textContent=e.message;for(const id of ['activate','rollback','recover'])$(id).disabled=true}}for(const action of ['activate','rollback','recover'])$(action).onclick=()=>{if(!confirm('GM authorization: '+action+' isolated Phase 11 metadata? The live Front Office remains unchanged.'))return;try{api[action](localStorage,true);$('status').textContent='Completed experimental '+action+'.';refresh()}catch(e){$('status').textContent='Operation failed: '+e.message;refresh()}};refresh()})();</script></body></html>
