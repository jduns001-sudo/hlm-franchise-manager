<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GM Evidence Action Boundary</title><style>body{font:16px system-ui;max-width:40rem;margin:auto;padding:1rem}main{box-sizing:border-box;width:100%}button{min-height:48px;padding:.75rem}p{overflow-wrap:anywhere}</style><main><h1>Experimental GM evidence action boundary</h1><p>Simulated evidence. Production activation disabled. Human GM authority required.</p><button id="review" aria-pressed="false">Complete evidence review</button><p id="result" aria-live="polite">No gameplay action authorized.</p></main><script>document.querySelector('#review').addEventListener('click',e=>{const reviewed=e.currentTarget.getAttribute('aria-pressed')==='true';e.currentTarget.setAttribute('aria-pressed',String(!reviewed));document.querySelector('#result').textContent=reviewed?'No gameplay action authorized.':'Review complete locally. No gameplay action authorized. No save writes.'});</script></html>
