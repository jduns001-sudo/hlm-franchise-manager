<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phase 11 Read-only Mobile Readiness</title><style>body{font:16px system-ui,sans-serif;max-width:40rem;margin:2rem auto;padding:0 1rem;line-height:1.5}button,input{font:inherit;max-width:100%}button{padding:.8rem}#result{white-space:pre-wrap;overflow-wrap:anywhere}fieldset{border:1px solid #aaa;padding:1rem}</style></head><body><main><h1>Mobile import readiness preview</h1><p>Read-only inspection only. This page cannot activate production import or modify a franchise save.</p><fieldset><legend>Backup verification</legend><label for="backup">Choose a previously exported production backup</label><p><input id="backup" type="file" accept=".json,application/json"></p><label><input id="confirm" type="checkbox"> I understand this is a read-only preview</label><p><button id="inspect" type="button" disabled>Verify backup</button></p></fieldset><p id="result" role="status" aria-live="polite">No backup inspected.</p></main><script src="hlm-phase11-mobile-readiness.js"></script><script src="hlm-phase11-mobile-optin-preview.js"></script><script>
(function(){'use strict';const file=document.getElementById('backup'),confirm=document.getElementById('confirm'),button=document.getElementById('inspect'),result=document.getElementById('result');function refresh(){button.disabled=!(file.files.length&&confirm.checked)}file.addEventListener('change',refresh);confirm.addEventListener('change',refresh);button.addEventListener('click',async()=>{button.disabled=true;result.textContent='Checking reopened backup...';try{const value=await HLMPhase11MobileOptInPreview.preview({indexedDB,backupFile:file.files[0],confirmation:'I UNDERSTAND THIS IS A READ-ONLY PREVIEW'});result.textContent=value.ready?'Backup verified. Controlled team: '+String(value.controlledTeamId)+'. Custom players: '+value.customPlayers+'. No save changes made.':'Not ready: '+value.reason+'. No save changes made.'}catch(e){result.textContent='Verification refused: '+e.message+'. No save changes made.'}finally{refresh()}})})();
</script></body></html>
