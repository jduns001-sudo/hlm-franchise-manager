<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental GM Evidence Review</title><style>body{font:16px system-ui;max-width:40rem;margin:auto;padding:1rem}main{box-sizing:border-box;width:100%}button{min-height:48px;padding:.75rem}p{overflow-wrap:anywhere}</style><main><h1>Experimental GM evidence review</h1><p>Simulated evidence only. Production activation disabled. No save writes.</p><button id="review" aria-pressed="false">Mark evidence reviewed</button><p id="result" aria-live="polite">GM review pending</p></main><script>document.querySelector('#review').addEventListener('click',e=>{const pressed=e.currentTarget.getAttribute('aria-pressed')==='true';e.currentTarget.setAttribute('aria-pressed',String(!pressed));document.querySelector('#result').textContent=pressed?'GM review pending':'Reviewed by GM (local preview only). No roster or save action.'});</script></html>
