<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HFM Finance Center (Preview)</title><style>body{font:16px system-ui;background:#101b2d;color:#eaf1fc;margin:0;padding:20px}main{max-width:960px;margin:auto}h1{margin:0 0 8px}p{color:#c5d3e8}.fields,.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(185px,1fr));gap:12px}label{display:grid;gap:5px;font-size:14px}input{padding:10px;border:1px solid #73849d;border-radius:7px;background:#22344d;color:white;font:inherit;max-width:100%}section{margin:24px 0}.card{background:#22344d;border-radius:10px;padding:16px}.card strong{display:block;font-size:20px;margin-top:6px}button{padding:12px;border:0;border-radius:7px;background:#70b5ff;color:#071528;font-weight:700;cursor:pointer}.error{color:#ffb0b0}output{display:block;margin:12px 0}</style></head><body><main><h1>Franchise Finance Center</h1><p>Isolated preview. Enter franchise figures to evaluate finances. This page never reads or writes your saved games and is not activated inside Front Office.</p><section><h2>Team financial inputs</h2><div class="fields" id="fields"></div></section><section><h2>Season progress</h2><div class="fields" id="calendar"></div></section><button id="calculate" type="button">Calculate finances</button><output id="status" role="status" aria-live="polite"></output><section><h2>Financial dashboard</h2><div class="cards" id="cards"></div><p id="cpu"></p></section><section><h2>Contract decision preview</h2><label>Proposed annual salary <input id="salary" type="number" min="0" step="1" value="1000000"></label><button id="check" type="button">Check signing</button><output id="decision" role="status" aria-live="polite"></output></section></main><script src="./hlm-phase11-finance-engine.js"></script><script src="./hlm-phase11-finance-integration.js"></script><script>
(function(){'use strict';const defaults={salaryCap:90000000,payroll:85000000,ownerBudget:105000000,attendance:18000,arenaCapacity:20000,ticketPrice:100,merchandiseRevenue:5000000,sponsorshipRevenue:30000000,mediaRevenue:80000000,arenaExpense:12000000,operationsExpense:5000000,homeGamesPlayed:20,remainingHomeGames:21};const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});const names={salaryCap:'Salary cap',payroll:'Team payroll',ownerBudget:'Owner budget',attendance:'Average attendance',arenaCapacity:'Arena capacity',ticketPrice:'Average ticket price',merchandiseRevenue:'Merchandise revenue',sponsorshipRevenue:'Sponsorship revenue',mediaRevenue:'Media revenue',arenaExpense:'Arena expenses',operationsExpense:'Operating expenses',homeGamesPlayed:'Home games played',remainingHomeGames:'Home games remaining'};const keys=Object.keys(defaults);for(const key of keys){const label=document.createElement('label');label.textContent=names[key];const input=document.createElement('input');input.type='number';input.min='0';input.step='1';input.required=true;input.id='f-'+key;input.value=defaults[key];label.append(input);document.getElementById(key.includes('Games')?'calendar':'fields').append(label)}function data(){const values={};for(const key of keys){const element=document.getElementById('f-'+key),n=Number(element.value);if(!element.value.trim()||!Number.isSafeInteger(n)||n<0)throw Error('Invalid '+names[key]);values[key]=n}const {homeGamesPlayed,remainingHomeGames,...team}=values;return {team,calendar:{homeGamesPlayed,remainingHomeGames}}}function error(id,e){const o=document.getElementById(id);o.className='error';o.textContent=e.message}function calculate(){try{const {team,calendar}=data();const result=HLMPhase11FinanceIntegration.dashboard(team,calendar),container=document.getElementById('cards');container.replaceChildren();for(const card of result.cards){const div=document.createElement('div');div.className='card';const title=document.createElement('span');title.textContent=card.label;const val=document.createElement('strong');val.textContent=money.format(card.value);div.append(title,val);container.append(div)}document.getElementById('cpu').textContent='CPU financial priority: '+result.cpuPriority+(result.warning?' | Financial limit exceeded':'');const status=document.getElementById('status');status.className='';status.textContent='Preview calculated. No game save modified.'}catch(e){error('status',e)}}document.getElementById('calculate').addEventListener('click',calculate);document.getElementById('check').addEventListener('click',()=>{try{const {team}=data(),annualSalary=Number(document.getElementById('salary').value);const result=HLMPhase11FinanceIntegration.evaluateDecision(team,{type:'sign',annualSalary});const o=document.getElementById('decision');o.className='';o.textContent=(result.allowed?'Allowed':'Blocked')+' | Projected payroll: '+money.format(result.nextPayroll)+(result.reasons.length?' | '+result.reasons.join(', '):'')+' | No save modified.'}catch(e){error('decision',e)}});calculate()})();
</script></body></html>
