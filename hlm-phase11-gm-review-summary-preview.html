<!doctype html><html lang="en"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Experimental GM Review Summary</title><style>body{font:16px system-ui;max-width:40rem;margin:auto;padding:1rem}main{width:100%;box-sizing:border-box}button{min-height:48px;padding:.75rem}p{overflow-wrap:anywhere}</style><main><h1>Experimental GM review summary</h1><p>Simulated evidence only. Production activation disabled. Human GM retains authority.</p><button id="review" aria-pressed="false">Mark review complete</button><p id="result" aria-live="polite">Review pending. No save writes.</p></main><script>document.querySelector('#review').addEventListener('click',e=>{const done=e.currentTarget.getAttribute('aria-pressed')==='true';e.currentTarget.setAttribute('aria-pressed',String(!done));document.querySelector('#result').textContent=done?'Review pending. No save writes.':'Review marked complete locally. No automatic GM action.'});</script></html>
